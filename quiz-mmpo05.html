<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPO-05 Logistics &amp; SCM - Quiz | StudyHub</title>
    <link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="quiz-header" style="padding-top: 3.5rem;">
        <h1>&#x1F4E0; MMPO-05 Logistics &amp; SCM Quiz</h1>
        <p>Test your knowledge of Logistics &amp; SCM</p>
        <div class="quiz-stats">
            <div class="quiz-stat">
                <div class="stat-value" id="currentQ">1</div>
                <div class="stat-label">Current</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="scoreVal">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="timeVal">20:00</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>
        <div class="quiz-progress-container">
            <div class="quiz-progress-bar" id="progressBar"></div>
        </div>
        <div class="quiz-progress-text" id="progressText">Question 1 of 10</div>
    </header>

    <div class="quiz-controls" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="quizEngine.reviewMode()" id="reviewBtn">
            <span class="icon">&#x1F4CB;</span> Review Answers
        </button>
        <div class="review-panel" id="reviewPanel">
            <h3><span class="icon">&#x1F4CD;</span> Jump to Question</h3>
            <div class="question-nav-grid" id="navGrid"></div>
        </div>
        <button class="btn btn-outline" onclick="quizEngine.toggleTimer()" id="timerBtn">
            <span class="icon">&#x23F1;</span> Toggle Timer
        </button>
    </div>

    <main style="max-width: 800px; margin: 0 auto; padding: 0 1.5rem;">
        <div class="question-nav" id="questionNav">
            <h3><span class="icon">&#x1F50D;</span> Question Navigation</h3>
            <div class="question-nav-grid" id="questionNavGrid"></div>
        </div>

        <div class="question-card current-question" id="questionCard">
            <h3 id="questionTitle">Question Title</h3>
            <div id="questionContent"></div>
        </div>

        <div id="answerOptions"></div>
        <div id="explanationArea" style="margin-top: 1rem;"></div>

        <div class="quiz-controls" style="justify-content: space-between; margin-top: 2rem;">
            <button class="btn btn-outline" onclick="quizEngine.prev()" id="prevBtn">
                <span class="icon">&#x2190;</span> Previous
            </button>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
                <button class="btn btn-secondary" onclick="quizEngine.randomize()" id="randomBtn">
                    <span class="icon">&#x1F500;</span> Randomize
                </button>
                <button class="btn btn-secondary" onclick="quizEngine.markReview()" id="markBtn">
                    <span class="icon">&#x1F516;</span> Mark for Review
                </button>
            </div>
            <button class="btn btn-primary" onclick="quizEngine.next()" id="nextBtn">
                Next <span class="icon">&#x2192;</span>
            </button>
        </div>
    </main>

    <div class="quiz-timer" id="quizTimer">
        <span class="icon">&#x23F1;</span> <span id="timerDisplay">20:00</span>
    </div>

    <script src="quiz-engine.js"></script>
    <script>
        const questions = [
            {
                question: "Which statement correctly describes the relationship between logistics and supply chain management?",
                options: [
                    "Logistics is a subset of SCM",
                    "SCM is a subset of logistics",
                    "Logistics and SCM are identical terms",
                    "Logistics excludes physical distribution"
                ],
                answer: 0,
                explanation: "Logistics manages the flow of goods from origin to consumption, while SCM is the wider network spanning raw material to end customer. Logistics is a subset of SCM."
            },
            {
                question: "According to the T-W-I-O-P mnemonic, which of the following is NOT a component of Physical Distribution Management (PDM)?",
                options: [
                    "Transportation",
                    "Warehousing",
                    "Manufacturing",
                    "Order processing"
                ],
                answer: 2,
                explanation: "PDM components are Transportation, Warehousing, Inventory, Order processing and Packaging (T-W-I-O-P). Manufacturing is a production activity, not part of PDM."
            },
            {
                question: "Features of a product or service that actually win customer orders over competitors are called:",
                options: [
                    "Order qualifiers",
                    "Order winners",
                    "Transaction elements",
                    "Post-transaction services"
                ],
                answer: 1,
                explanation: "Order winners are the features that win orders, while order qualifiers are the minimum requirements for a customer to even consider the firm. Zara wins on speed of delivery."
            },
            {
                question: "What is the correct sequence of the five core processes of the SCOR model?",
                options: [
                    "Plan, Source, Make, Deliver, Return",
                    "Source, Plan, Make, Return, Deliver",
                    "Plan, Make, Source, Deliver, Return",
                    "Plan, Source, Make, Return, Deliver"
                ],
                answer: 0,
                explanation: "SCOR = Plan, Source, Make, Deliver, Return (P-S-M-D-R). It is the Supply Chain Operations Reference model used to describe and measure supply chain processes."
            },
            {
                question: "A JIT (Just-in-Time) / Kanban production system, which produces based on actual demand, is an example of a:",
                options: [
                    "Push system",
                    "Pull system",
                    "Leagile system",
                    "Make-to-stock system"
                ],
                answer: 1,
                explanation: "Pull systems are driven by actual demand (JIT/Kanban), while push systems (MRP) are driven by forecasts. Leagile combines lean upstream with agile downstream."
            },
            {
                question: "To reduce the bullwhip effect caused by price fluctuations and promotional forward-buying, the recommended fix is:",
                options: [
                    "EDLP (Every Day Low Pricing)",
                    "Order batching",
                    "Rationing and gaming",
                    "Eliminating safety stock"
                ],
                answer: 0,
                explanation: "Bullwhip causes are D-O-P-R (Demand forecast errors, Order batching, Price fluctuations, Rationing/gaming) and the fixes are I-V-E: Information sharing, VMI and EDLP."
            },
            {
                question: "Which transportation mode has the lowest cost and the highest capacity, making it best for bulk international shipments?",
                options: [
                    "Road",
                    "Rail",
                    "Air",
                    "Water"
                ],
                answer: 3,
                explanation: "Water is the cheapest mode with the largest capacity, best for bulk international freight. Air is fastest but most expensive, while road offers door-to-door flexibility."
            },
            {
                question: "The Total Cost of Ownership (TCO) of a logistics asset is calculated as purchase price plus:",
                options: [
                    "Operating, maintenance and disposal costs",
                    "Only maintenance costs",
                    "Depreciation only",
                    "Insurance and taxes only"
                ],
                answer: 0,
                explanation: "TCO = Purchase + Operating + Maintenance + Disposal (P-O-M-D). It captures all lifecycle costs rather than just the purchase price."
            },
            {
                question: "Comparing the performance of your warehouse in Mumbai against your own warehouse in Delhi is an example of which benchmarking type?",
                options: [
                    "Competitive benchmarking",
                    "Internal benchmarking",
                    "Functional benchmarking",
                    "Generic benchmarking"
                ],
                answer: 1,
                explanation: "Internal benchmarking compares performance between own departments or plants. Competitive compares with direct rivals, functional compares the same function across industries, and generic compares best practices across any industry."
            },
            {
                question: "Which location technique selects the site that minimizes the total Load x Distance across all demand points, and is best for heavy bulk goods?",
                options: [
                    "Factor rating",
                    "Center-of-gravity",
                    "Load-distance method",
                    "Hub-and-spoke model"
                ],
                answer: 2,
                explanation: "The load-distance method minimizes total load-distance for heavy goods. Factor rating scores locations on weighted factors, while center-of-gravity finds the mathematical centre of demand."
            }
        ];

        const quizEngine = new QuizEngine('mmpo05', 'MMPO05', questions);
        quizEngine.init();

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            switch(e.key) {
                case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); quizEngine.prev(); break;
                case 'ArrowRight': case 'd': case 'D': e.preventDefault(); quizEngine.next(); break;
                case '1': case '2': case '3': case '4':
                    if (quizEngine.state === 'in-progress') {
                        const num = parseInt(e.key);
                        if (num <= quizEngine.getCurrentQuestion().options.length) {
                            quizEngine.selectAnswer(num - 1);
                        }
                    }
                    break;
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                quizEngine.toggleTimer(false);
            } else {
                if (quizEngine.timerEnabled) {
                    quizEngine.toggleTimer(true);
                }
            }
        });
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
