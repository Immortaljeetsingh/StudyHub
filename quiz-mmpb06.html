<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPB-06 Banking Governance - Quiz | StudyHub</title>
    <link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="quiz-header">
        <h1>&#x1F4E0; MMPB-06 Banking Governance Quiz</h1>
        <p>Test your knowledge of Banking Governance</p>
        <div class="quiz-stats">
            <div class="quiz-stat">
                <div class="stat-value" id="currentQ">1</div>
                <div class="stat-label">Current</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="scoreVal">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="timeVal">20:00</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>
        <div class="quiz-progress-container">
            <div class="quiz-progress-bar" id="progressBar"></div>
        </div>
        <div class="quiz-progress-text" id="progressText">Question 1 of 10</div>
    </header>

    <div class="quiz-controls" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="quizEngine.reviewMode()" id="reviewBtn">
            <span class="icon">&#x1F4CB;</span> Review Answers
        </button>
        <div class="review-panel" id="reviewPanel">
            <h3><span class="icon">&#x1F4CD;</span> Jump to Question</h3>
            <div class="question-nav-grid" id="navGrid"></div>
        </div>
        <button class="btn btn-outline" onclick="quizEngine.toggleTimer()" id="timerBtn">
            <span class="icon">&#x23F1;</span> Toggle Timer
        </button>
    </div>

    <main style="max-width: 800px; margin: 0 auto; padding: 0 1.5rem;">
        <div class="question-nav" id="questionNav">
            <h3><span class="icon">&#x1F50D;</span> Question Navigation</h3>
            <div class="question-nav-grid" id="questionNavGrid"></div>
        </div>

        <div class="question-card current-question" id="questionCard">
            <h3 id="questionTitle">Question Title</h3>
            <div id="questionContent"></div>
        </div>

        <div id="answerOptions"></div>
        <div id="explanationArea" style="margin-top: 1rem;"></div>

        <div class="quiz-controls" style="justify-content: space-between; margin-top: 2rem;">
            <button class="btn btn-outline" onclick="quizEngine.prev()" id="prevBtn">
                <span class="icon">&#x2190;</span> Previous
            </button>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
                <button class="btn btn-secondary" onclick="quizEngine.randomize()" id="randomBtn">
                    <span class="icon">&#x1F500;</span> Randomize
                </button>
                <button class="btn btn-secondary" onclick="quizEngine.markReview()" id="markBtn">
                    <span class="icon">&#x1F516;</span> Mark for Review
                </button>
            </div>
            <button class="btn btn-primary" onclick="quizEngine.next()" id="nextBtn">
                Next <span class="icon">&#x2192;</span>
            </button>
        </div>
    </main>

    <div class="quiz-timer" id="quizTimer">
        <span class="icon">&#x23F1;</span> <span id="timerDisplay">20:00</span>
    </div>

    <script src="quiz-engine.js"></script>
    <script>
        const questions = [
            {
                question: "Which ethical theory judges an action by its contribution to the greatest good for the greatest number?",
                options: [
                    "Deontology",
                    "Virtue Ethics",
                    "Utilitarianism",
                    "Stakeholder Theory"
                ],
                answer: 2,
                explanation: "Utilitarianism, associated with Jeremy Bentham and John Stuart Mill, evaluates actions by outcomes, seeking the greatest good for the greatest number, applied through cost-benefit analysis. Deontology (Kant) is duty-based and Virtue Ethics (Aristotle) is character-based."
            },
            {
                question: "According to agency theory, the three components of agency costs are:",
                options: [
                    "Planning, Organizing, Controlling",
                    "Salary, Bonus, Stock options",
                    "Audit, Compliance, Reporting",
                    "Monitoring, Bonding, Residual loss"
                ],
                answer: 3,
                explanation: "Agency costs arise from the separation of ownership and control: monitoring costs to supervise management, bonding costs incurred by management to assure shareholders, and residual loss from remaining information asymmetry."
            },
            {
                question: "In the Basel II framework, which pillar deals with market discipline through public disclosure?",
                options: [
                    "Pillar 1",
                    "Pillar 2",
                    "Pillar 3",
                    "Pillar 4"
                ],
                answer: 2,
                explanation: "Basel II has three pillars: Pillar 1 (minimum capital for credit, market and operational risk), Pillar 2 (supervisory review), and Pillar 3 (market discipline), which requires banks to publicly disclose their risk profile and capital adequacy."
            },
            {
                question: "Under Basel III, the minimum Common Equity Tier 1 (CET1) capital ratio required is:",
                options: [
                    "4.5%",
                    "8%",
                    "2.5%",
                    "6%"
                ],
                answer: 0,
                explanation: "Basel III requires CET1 of 4.5%, Tier 1 of 6%, and a total capital adequacy ratio of 8% plus a 2.5% capital conservation buffer, raising capital quality after the 2008 crisis."
            },
            {
                question: "A loan is classified as a Non-Performing Asset (NPA) when it remains overdue for:",
                options: [
                    "30 days",
                    "60 days",
                    "90 days",
                    "180 days"
                ],
                answer: 2,
                explanation: "Under RBI norms, an asset becomes an NPA when interest or principal remains overdue for 90 or more days. NPAs are classified as Standard, Sub-standard, Doubtful, or Loss with rising provisioning."
            },
            {
                question: "Which of the following is a key restriction on NBFCs compared to banks?",
                options: [
                    "Cannot accept demand deposits",
                    "Cannot issue loans",
                    "Cannot be regulated by RBI",
                    "Cannot invest in securities"
                ],
                answer: 0,
                explanation: "NBFCs cannot accept demand deposits and are not covered by DICGC deposit insurance. They are not required to maintain CRR/SLR, have limited payment system access, and are regulated under the RBI Act and Companies Act rather than the Banking Regulation Act."
            },
            {
                question: "The Net Asset Value (NAV) of a mutual fund is calculated as:",
                options: [
                    "Total Assets / Total Units",
                    "(Total Assets - Total Liabilities) / Total Outstanding Units",
                    "(Total Income - Total Expenses) / Units",
                    "(Total Assets + Total Liabilities) / Units"
                ],
                answer: 1,
                explanation: "NAV = (Total Assets - Total Liabilities) / Total Outstanding Units. Mutual funds have a Sponsor, Trust, Trustee, AMC, and Custodian structure, governed by the SEBI (Mutual Fund) Regulations 1996."
            },
            {
                question: "IRDAI requires insurance companies to maintain a minimum solvency margin of:",
                options: [
                    "100%",
                    "150%",
                    "200%",
                    "75%"
                ],
                answer: 1,
                explanation: "IRDAI requires insurers' assets to exceed liabilities by a minimum solvency margin of 150%, ensuring policyholder claims can be met. Insurance types in India are Life, General, and Health."
            },
            {
                question: "Under Section 135 of the Companies Act 2013, eligible companies must spend at least ___ of their average net profit on CSR activities.",
                options: [
                    "2%",
                    "1%",
                    "5%",
                    "10%"
                ],
                answer: 0,
                explanation: "Companies meeting the CSR threshold (net worth Rs 500 crore, turnover Rs 1000 crore, or net profit Rs 5 crore) must spend at least 2% of the average net profit of the last three years on Schedule VII CSR activities."
            },
            {
                question: "Under RBI anti-money laundering norms, banks must file Cash Transaction Reports (CTRs) for cash transactions above which amount?",
                options: [
                    "Rs 1 lakh",
                    "Rs 5 lakh",
                    "Rs 10 lakh",
                    "Rs 50 lakh"
                ],
                answer: 2,
                explanation: "CTRs are filed for cash transactions exceeding Rs 10 lakh, while STRs flag suspicious patterns. AML mechanisms also include KYC for all customers and enhanced due diligence for Politically Exposed Persons (PEPs)."
            }
        ];

        const quizEngine = new QuizEngine('mmpb06', 'MMPB06', questions);
        quizEngine.init();

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            switch(e.key) {
                case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); quizEngine.prev(); break;
                case 'ArrowRight': case 'd': case 'D': e.preventDefault(); quizEngine.next(); break;
                case '1': case '2': case '3': case '4':
                    if (quizEngine.state === 'in-progress') {
                        const num = parseInt(e.key);
                        if (num <= quizEngine.getCurrentQuestion().options.length) {
                            quizEngine.selectAnswer(num - 1);
                        }
                    }
                    break;
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                quizEngine.toggleTimer(false);
            } else {
                if (quizEngine.timerEnabled) {
                    quizEngine.toggleTimer(true);
                }
            }
        });
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
