<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPC-01 Quiz - Management Functions | StudyHub</title>
    <link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="quiz-header">
        <h1>&#x1F4E0; MMPC-01: Management Functions Quiz</h1>
        <p>Test your knowledge of planning, organizing, directing, and controlling</p>
        <div class="quiz-stats">
            <div class="quiz-stat">
                <div class="stat-value" id="currentQ">1</div>
                <div class="stat-label">Current</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="scoreVal">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="timeVal">20:00</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>
        <div class="quiz-progress-container">
            <div class="quiz-progress-bar" id="progressBar"></div>
        </div>
        <div class="quiz-progress-text" id="progressText">Question 1 of 10</div>
    </header>

    <div class="quiz-controls" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="quizEngine.reviewMode()" id="reviewBtn" style="display:none;">
            <span class="icon">&#x1F4CB;</span> Review Answers
        </button>
        <div class="review-panel" id="reviewPanel">
            <h3><span class="icon">&#x1F4CD;</span> Jump to Question</h3>
            <div class="question-nav-grid" id="navGrid"></div>
        </div>
        <button class="btn btn-outline" onclick="quizEngine.toggleTimer()" id="timerBtn">
            <span class="icon">&#x23F1;</span> Toggle Timer
        </button>
    </div>

    <main style="max-width: 800px; margin: 0 auto; padding: 0 1.5rem;">
        <div class="question-nav" id="questionNav">
            <h3><span class="icon">&#x1F50D;</span> Question Navigation</h3>
            <div class="question-nav-grid" id="questionNavGrid"></div>
        </div>

        <div class="question-card current-question" id="questionCard">
            <h3 id="questionTitle">Question Title</h3>
            <div id="questionContent"></div>
        </div>

        <div id="answerOptions"></div>
        <div id="explanationArea" style="margin-top: 1rem;"></div>

        <div class="quiz-controls" style="justify-content: space-between; margin-top: 2rem;">
            <button class="btn btn-outline" onclick="quizEngine.prev()" id="prevBtn">
                <span class="icon">&#x2190;</span> Previous
            </button>
            <div>
                <button class="btn btn-secondary" onclick="quizEngine.randomize()" id="randomBtn">
                    <span class="icon">&#x1F500;</span> Randomize
                </button>
                <button class="btn btn-secondary" onclick="quizEngine.markReview()" id="markBtn">
                    <span class="icon">&#x1F516;</span> Mark for Review
                </button>
            </div>
            <button class="btn btn-primary" onclick="quizEngine.next()" id="nextBtn">
                Next <span class="icon">&#x2192;</span>
            </button>
        </div>
    </main>

    <div class="quiz-timer" id="quizTimer">
        <span class="icon">&#x23F1;</span> <span id="timerDisplay">20:00</span>
    </div>

    <script src="quiz-engine.js"></script>
    <script>
        const questions = [
            {
                question: "Which function of management involves setting objectives and determining appropriate actions to achieve them?",
                options: [
                    "Directing",
                    "Organizing",
                    "Planning",
                    "Controlling"
                ],
                answer: 2,
                explanation: "Planning is the primary function of management where managers set objectives, determine strategies, and develop plans to coordinate activities. It provides direction, reduces risks of uncertainty, promotes innovative ideas, and facilitates decision-making. Planning is done at all levels of management and all departments."
            },
            {
                question: "The primary reason organizations develop formal plans is to:",
                options: [
                    "Eliminate all possible errors",
                    "Define goals and establish overall strategy",
                    "Increase the workload of employees",
                    "Make work more complex"
                ],
                answer: 1,
                explanation: "Organizations develop formal plans primarily to define goals and establish overall strategy. Planning provides direction to activities, ensures goal achievement, and coordinates various departments and activities within the organization."
            },
            {
                question: "Which of the following is NOT a characteristic of planning?",
                options: [
                    "Planning is goal-oriented",
                    "Planning is looking ahead",
                    "Planning is a one-time process",
                    "Planning is an intellectual process"
                ],
                answer: 2,
                explanation: "Planning is not a one-time process. It is a continuous and ongoing process that needs to be reviewed and revised as circumstances change, goals are accomplished, or new opportunities arise. Plans are made for future periods and need periodic revision."
            },
            {
                question: "Strategic planning is typically done by:",
                options: [
                    "Middle-level management",
                    "Lower-level management",
                    "Top-level management",
                    "All levels equally"
                ],
                answer: 2,
                explanation: "Strategic planning is typically done by top-level management. This involves making long-term decisions about the overall direction of the organization, establishing policies, goals, and objectives that will guide the organization's future."
            },
            {
                question: "Which type of plan sets long-term objectives for the entire organization?",
                options: [
                    "Operational plan",
                    "Strategic plan",
                    "Tactical plan",
                    "Standing plan"
                ],
                answer: 1,
                explanation: "A strategic plan sets long-term objectives for the entire organization. It deals with the overall mission, vision, and long-term goals. Strategic plans are comprehensive plans made by top-level management for a period of 5 years or more."
            },
            {
                question: "The process of establishing a formal structure of authority is called:",
                options: [
                    "Directing",
                    "Organizing",
                    "Planning",
                    "Staffing"
                ],
                answer: 1,
                explanation: "Organizing is the process of establishing a formal structure of authority where work is subdivided, grouped, and coordinated. It involves identifying and grouping work to be performed, defining roles and responsibilities, delegating authority, and establishing relationships to enable people to work together efficiently."
            },
            {
                question: "Span of control refers to:",
                options: [
                    "The area a manager can physically see",
                    "The geographical area of operations",
                    "The number of subordinates a manager can effectively supervise",
                    "The financial resources available to a manager"
                ],
                answer: 2,
                explanation: "Span of control refers to the number of subordinates a supervisor or manager can effectively supervise. It determines the levels of management in the organization. A wider span means fewer levels, while a narrow span results in more levels of management."
            },
            {
                question: "Departmentalization based on product lines is called:",
                options: [
                    "Functional departmentalization",
                    "Geographical departmentalization",
                    "Product departmentalization",
                    "Customer departmentalization"
                ],
                answer: 2,
                explanation: "Product departmentalization occurs when an organization creates separate divisions for each major product line or service. Each department contains the functional specialists needed to produce and sell the product, giving product managers autonomy and responsibility."
            },
            {
                question: "Authority flows downward while accountability flows:",
                options: [
                    "Sideways",
                    "Upward",
                    "In all directions",
                    "Does not flow"
                ],
                answer: 1,
                explanation: "In an organization, authority flows downward from superiors to subordinates through the chain of command. However, accountability flows upward - subordinates are accountable to their superiors for the tasks assigned. Authority is delegated but responsibility is absolute and cannot be delegated."
            },
            {
                question: "Centralization in organization structure means:",
                options: [
                    "Power is distributed to all levels",
                    "Decision-making authority is concentrated at the top",
                    "Departments operate independently",
                    "Managers have no authority"
                ],
                answer: 1,
                explanation: "Centralization refers to the concentration of decision-making authority at the top level of management. In a centralized organization, top management retains most decision-making power, while in a decentralized organization, authority is pushed down to lower levels. Centralization can lead to uniformity but may reduce flexibility."
            }
        ];

        const quizEngine = new QuizEngine('mmpc-01', 'MMPC-01', questions);
        quizEngine.init();

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            
            switch(e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    quizEngine.prev();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    quizEngine.next();
                    break;
                case '1':
                case '2':
                case '3':
                case '4':
                    if (quizEngine.currentState === 'in-progress') {
                        const num = parseInt(e.key);
                        if (num <= quizEngine.getCurrentQuestion().options.length) {
                            quizEngine.selectAnswer(num - 1);
                        }
                    }
                    break;
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                quizEngine.toggleTimer(false);
            } else {
                if (quizEngine.timerEnabled) {
                    quizEngine.toggleTimer(true);
                }
            }
        });
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
