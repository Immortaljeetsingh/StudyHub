<body class="subject-mmpc03">

    <script>document.write(renderApiSettingsModal());document.write(renderToolbar('mmpc-03'));</script>
    <div class="quiz-header"><h1>&#x1F4D9; MMPC-03: Business Environment Quiz</h1><p class="quiz-subtitle">Test your knowledge of the business environment &#x2014; economic policy, regulatory frameworks, and market dynamics.</p><div class="quiz-stats"><div class="quiz-stat"><div class="stat-value" id="scoreDisplay">0</div><div class="stat-label">Score</div></div><div class="quiz-stat"><div class="stat-value" id="answeredDisplay">0/50</div><div class="stat-label">Answered</div></div><div class="quiz-stat"><div class="stat-value" id="percentDisplay">0%</div><div class="stat-label">Percentage</div></div></div></div>
    <div class="quiz-controls"><button class="btn btn-primary" onclick="checkAllAnswers()">&#x2705; Check All</button><button class="btn btn-success" onclick="saveScore()">&#x1F4BE; Save Score</button><button class="btn btn-outline" onclick="resetQuiz()">&#x1F504; Reset</button></div>
    <div class="quiz-container" id="quizContainer"></div>
    <div class="study-footer"><a href="study-mmpc03.html">&#x1F4D9; Study Material</a> | <a href="study-hub.html">&#x2190; Hub</a></div>
    <script>
    const QUIZ_ID = 'mmpc03';
    function getGrade(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
    const questions = [
        {q:"PESTLE analysis includes which factors?",options:["Price, Economy, Sales, Technology, Labor, Export","Political, Economic, Socio-cultural, Technological, Legal, Environmental","Production, Efficiency, Strategy, Training, Leadership, Evaluation","Planning, Execution, Staffing, Testing, Logistics, Engineering"],correct:1,explanation:"PESTLE covers 6 macro-environmental factors affecting business."},
        {q:"India's 1991 economic reforms are known as:",options:["Green Revolution","White Revolution","LPG reforms (Liberalization, Privatization, Globalization)","Digital India initiative"],correct:2,explanation:"The 1991 crisis led PM Narasimha Rao and FM Manmohan Singh to introduce LPG reforms."},
        {q:"GDP stands for:",options:["General Domestic Price","Gross Domestic Product","Global Development Program","Government Deficit Plan"],correct:1,explanation:"GDP is the total value of all goods and services produced within a country's borders in a specific period."},
        {q:"GST was implemented in India in:",options:["2014","2016","2017","2019"],correct:2,explanation:"GST (Goods & Services Tax) was rolled out on July 1, 2017, replacing 17 indirect taxes."},
        {q:"The repo rate is set by:",options:["SEBI","Ministry of Finance","Reserve Bank of India (RBI)","NITI Aayog"],correct:2,explanation:"RBI sets the repo rate &#x2014; the rate at which commercial banks borrow from RBI. It influences lending rates and inflation."},
        {q:"WTO stands for:",options:["World Trade Organization","World Technology Office","Western Tariff Organization","World Tax Office"],correct:0,explanation:"WTO governs international trade rules among 164 member nations."},
        {q:"FDI stands for:",options:["Fixed Deposit Interest","Foreign Direct Investment","Financial Development Index","Federal Domestic Income"],correct:1,explanation:"FDI is investment by a company from one country into business interests in another country."},
        {q:"SEBI regulates:",options:["Banking sector","Insurance industry","Capital/securities markets","Telecom industry"],correct:2,explanation:"Securities and Exchange Board of India regulates stock exchanges, mutual funds, and protects investor interests."},
        {q:"Make in India initiative aims to:",options:["Increase imports","Promote manufacturing in India","Reduce government spending","Privatize all public companies"],correct:1,explanation:"Launched in 2014, Make in India promotes manufacturing, FDI, and job creation in India."},
        {q:"The Competition Act, 2002 prevents:",options:["Foreign investment","Anti-competitive practices and abuse of dominant position","Employee strikes","Environmental pollution"],correct:1,explanation:"CCI prevents cartels, price-fixing, and abuse of market dominance to promote fair competition."},
        {q:"A weak rupee benefits:",options:["Importers","Exporters","Both equally","Neither"],correct:1,explanation:"Weak rupee makes Indian goods cheaper in foreign markets &#x2192; exports become more competitive."},
        {q:"FEMA governs:",options:["Factory safety","Foreign exchange transactions","Food quality standards","Financial education"],correct:1,explanation:"Foreign Exchange Management Act regulates foreign exchange transactions and FDI in India."},
        {q:"India's demographic dividend refers to:",options:["High birth rate","Large working-age population that can boost economic growth","High GDP per capita","Aging population"],correct:1,explanation:"With median age ~28, India's young workforce can drive economic growth if properly skilled."},
        {q:"Creative destruction (Schumpeter) means:",options:["Deliberately destroying competitors","Innovation that destroys old markets while creating new ones","Environmental destruction by industries","Reducing workforce through automation"],correct:1,explanation:"E.g., smartphones destroyed the camera industry but created the app economy."},
        {q:"The Consumer Protection Act, 2019 introduced:",options:["GST","CCPA (Central Consumer Protection Authority)","SEBI","CCI"],correct:1,explanation:"The 2019 Act established CCPA, e-commerce regulation, and product liability provisions."},
        {q:"PLI scheme stands for:",options:["Product Liability Insurance","Production Linked Incentive","Profit and Loss Integration","Public Lending Institution"],correct:1,explanation:"PLI offers financial incentives to boost domestic manufacturing in targeted sectors."},
        {q:"Which entry mode has the HIGHEST risk and control?",options:["Exporting","Licensing","Joint venture","Wholly-owned subsidiary (FDI)"],correct:3,explanation:"FDI gives full control but carries the highest financial risk and commitment."},
        {q:"CPI measures:",options:["Corporate Performance Index","Consumer Price Index (inflation)","Company Profit Indicator","Capital Production Input"],correct:1,explanation:"CPI tracks changes in prices of a basket of consumer goods &#x2014; primary measure of retail inflation."},
        {q:"Fiscal policy involves:",options:["RBI interest rate decisions","Government taxation and spending decisions","Foreign trade agreements","Environmental regulations"],correct:1,explanation:"Fiscal policy = government's use of taxation and expenditure to influence the economy. Monetary policy = RBI's tools."},
        {q:"NITI Aayog replaced:",options:["RBI","SEBI","Planning Commission","Election Commission"],correct:2,explanation:"NITI Aayog (2015) replaced the Planning Commission as India's premier policy think-tank."},
        {q:"Disinvestment means:",options:["Investing more in public sector","Government selling its stake in public enterprises","Banning foreign investment","Increasing government spending"],correct:1,explanation:"Disinvestment reduces government ownership in PSUs &#x2014; raising revenue and improving efficiency."},
        {q:"Which is NOT a micro-environmental factor?",options:["Suppliers","Customers","Inflation rate","Competitors"],correct:2,explanation:"Inflation is a macro-environmental factor. Micro factors are specific to the industry: suppliers, buyers, competitors."},
        {q:"TRAI regulates:",options:["Banking","Telecom industry","Aviation","Pharmaceuticals"],correct:1,explanation:"Telecom Regulatory Authority of India regulates telecom services, tariffs, and quality standards."},
        {q:"Joint venture entry mode means:",options:["Exporting through a distributor","Two companies share ownership of a new entity in a foreign market","Buying 100% of a foreign company","Licensing intellectual property"],correct:1,explanation:"Joint venture: two or more firms create a jointly-owned business &#x2014; sharing risk, resources, and control."},
        {q:"The License Raj referred to:",options:["Free market economy","Complex system of permits and regulations controlling Indian industry before 1991","A software licensing system","Government-issued driving licenses"],correct:1,explanation:"License Raj was the elaborate system of government approvals required to start and run businesses &#x2014; dismantled by 1991 reforms."},
        {q:"Which organization provides development finance to developing countries?",options:["WTO","IMF","World Bank","OPEC"],correct:2,explanation:"World Bank provides loans and grants for development projects in agriculture, education, infrastructure, etc."},
        {q:"Monetary policy tools include:",options:["Tax rates and subsidies","Repo rate, CRR, SLR, open market operations","Export duties","Labor laws"],correct:1,explanation:"RBI uses repo rate, reverse repo rate, CRR (Cash Reserve Ratio), SLR, and OMO to manage money supply."},
        {q:"The socio-cultural environment includes:",options:["GDP growth rate","Tax rates","Demographics, lifestyle, values, education","Exchange rates"],correct:2,explanation:"Socio-cultural factors shape consumer behavior and workforce expectations &#x2014; demographics, attitudes, cultural values."},
        {q:"Import substitution strategy aims to:",options:["Increase imports","Replace imported goods with domestically produced ones","Export raw materials only","Attract FDI"],correct:1,explanation:"Import substitution reduces dependence on foreign goods by promoting domestic production &#x2014; India followed this before 1991."},
        {q:"Companies Act, 2013 mandates CSR spending of:",options:["1% of revenue","2% of average net profit (for qualifying companies)","5% of total sales","10% of tax savings"],correct:1,explanation:"Companies with net worth &#x2265;&#x20B9;500 crore OR turnover &#x2265;&#x20B9;1000 crore OR profit &#x2265;&#x20B9;5 crore must spend 2% of average net profit on CSR."},
        {q:"Bilateral trade agreements are between:",options:["Multiple countries","Two countries","A country and WTO","Regional trade blocs only"],correct:1,explanation:"Bilateral = between 2 countries. Multilateral = among many. Regional = within a geographic bloc (ASEAN, EU)."},
        {q:"What does PPP stand for in economics?",options:["Public-Private Partnership","Purchasing Power Parity","Profit Per Product","Payment Processing Protocol"],correct:1,explanation:"PPP adjusts GDP for cost-of-living differences across countries &#x2014; enabling meaningful comparisons."},
        {q:"MSME stands for:",options:["Medium Scale Manufacturing Enterprise","Micro, Small and Medium Enterprises","Market Supply Management Entity","Multi-State Management Enterprise"],correct:1,explanation:"MSMEs are the backbone of Indian economy &#x2014; contributing ~30% of GDP and employing ~110 million people."},
        {q:"Dumping in international trade means:",options:["Disposing waste illegally","Exporting goods below cost to capture foreign markets","Importing excess goods","Stockpiling unsold inventory"],correct:1,explanation:"Dumping is selling goods in foreign markets below production cost to eliminate competition &#x2014; anti-dumping duties can be imposed."},
        {q:"Which body resolves international trade disputes?",options:["United Nations","International Court of Justice","WTO Dispute Settlement Body","World Bank"],correct:2,explanation:"WTO's Dispute Settlement Body resolves trade conflicts between member nations."},
        {q:"Swadeshi movement is related to:",options:["Promoting foreign goods","Promoting use of domestically produced goods","Technology exports","Digital transformation"],correct:1,explanation:"Swadeshi = self-reliance through domestic production. Modern version: Atmanirbhar Bharat initiative."},
        {q:"Balance of Payment (BOP) records:",options:["Government budget","All economic transactions between a country and the rest of the world","Internal trade within a country","Company financial statements"],correct:1,explanation:"BOP includes current account (trade, services, transfers) and capital account (investments, loans)."},
        {q:"SEZ stands for:",options:["Stock Exchange Zone","Special Economic Zone","Standard Export Zone","Secure Enterprise Zone"],correct:1,explanation:"SEZs offer tax benefits and relaxed regulations to promote exports and attract investment."},
        {q:"Inflation hurts:",options:["Borrowers","Fixed-income earners","Exporters","All equally"],correct:1,explanation:"Inflation reduces purchasing power &#x2014; those on fixed incomes (pensioners, salaried workers) suffer most as prices rise but income doesn't."},
        {q:"Which is an example of technological disruption?",options:["Government policy change","UPI replacing cash transactions","Change in labor laws","Population growth"],correct:1,explanation:"UPI revolutionized payments in India &#x2014; processing 12+ billion transactions monthly, disrupting cash and card-based systems."},
        {q:"India is a member of which trade bloc?",options:["European Union","ASEAN","BRICS","NATO"],correct:2,explanation:"India is part of BRICS (Brazil, Russia, India, China, South Africa) &#x2014; a group of major emerging economies."},
        {q:"RBI was established in:",options:["1935","1947","1950","1991"],correct:0,explanation:"RBI was established on April 1, 1935 under the Reserve Bank of India Act, 1934."},
        {q:"What is the current account in BOP?",options:["Bank savings account","Trade in goods, services, income, and transfers with other countries","Government's fiscal account","Capital investments only"],correct:1,explanation:"Current account records exports/imports of goods & services, income from abroad, and unilateral transfers."},
        {q:"IRDAI regulates:",options:["Telecom","Insurance industry","Railways","Information Technology"],correct:1,explanation:"Insurance Regulatory and Development Authority of India regulates and promotes the insurance sector."},
        {q:"Mixed economy means:",options:["Only private sector exists","Only public sector exists","Both public and private sectors coexist","No government intervention"],correct:2,explanation:"India is a mixed economy &#x2014; both public and private sectors operate, with government playing a regulatory role."},
        {q:"Sunrise industries are:",options:["Industries in decline","Emerging, high-growth industries (IT, biotech, renewable energy)","Traditional manufacturing","Government monopolies"],correct:1,explanation:"Sunrise industries are new, rapidly growing sectors &#x2014; contrasted with sunset industries (declining sectors)."},
        {q:"TRIPS agreement under WTO relates to:",options:["Trade tariffs","Intellectual property rights protection","Transport regulations","Tax policies"],correct:1,explanation:"TRIPS (Trade-Related Aspects of Intellectual Property Rights) sets minimum standards for IP protection among WTO members."},
        {q:"Stagflation is a combination of:",options:["High growth and low inflation","Stagnant economy and high inflation simultaneously","Deflation and high employment","Rapid growth and full employment"],correct:1,explanation:"Stagflation = stagnant growth + high inflation + high unemployment &#x2014; a challenging economic situation with no easy policy fix."},
        {q:"E-governance aims to:",options:["Replace government entirely","Deliver government services efficiently using technology","Privatize all government functions","Eliminate taxes"],correct:1,explanation:"E-governance uses ICT (Aadhaar, DigiLocker, UPI) to improve government service delivery, transparency, and citizen participation."},
        {q:"BIS stands for:",options:["Bureau of Indian Standards","Business Information Systems","Bank Investment Services","Board of Industrial Services"],correct:0,explanation:"BIS sets quality standards for products and services in India &#x2014; ISI mark certification."}
    ];

    let userAnswers=new Array(questions.length).fill(-1);
    function renderQuiz(){const c=document.getElementById('quizContainer');c.innerHTML=questions.map((q,i)=>`<div class="question-card" id="qcard-${i}"><div class="q-number">Question ${i+1} of ${questions.length}</div><div class="q-text">${q.q}</div><div class="q-options">${q.options.map((opt,j)=>`<div class="q-option" onclick="selectAnswer(${i},${j})" id="q${i}-opt${j}"><span class="q-option-letter">${'ABCD'[j]}</span><span>${opt}</span></div>`).join('')}</div><div class="q-explanation" id="q${i}-exp">&#x1F4A1; ${q.explanation}</div></div>`).join('');}
    function selectAnswer(qi,oi){if(document.getElementById(`qcard-${qi}`).classList.contains('correct')||document.getElementById(`qcard-${qi}`).classList.contains('incorrect'))return;userAnswers[qi]=oi;questions[qi].options.forEach((_,j)=>{document.getElementById(`q${qi}-opt${j}`).classList.toggle('selected',j===oi);});updateStats();}
    function checkAllAnswers(){questions.forEach((q,i)=>{const card=document.getElementById(`qcard-${i}`);if(userAnswers[i]===-1)return;card.classList.add(userAnswers[i]===q.correct?'correct':'incorrect');document.getElementById(`q${i}-opt${q.correct}`).classList.add('correct-answer');if(userAnswers[i]!==q.correct&&userAnswers[i]>=0)document.getElementById(`q${i}-opt${userAnswers[i]}`).classList.add('wrong-answer');document.getElementById(`q${i}-exp`).classList.add('visible');});updateStats();}
    function updateStats(){const answered=userAnswers.filter(a=>a>=0).length;const correct=userAnswers.filter((a,i)=>a===questions[i].correct).length;const pct=answered>0?Math.round((correct/answered)*100):0;document.getElementById('scoreDisplay').textContent=correct;document.getElementById('answeredDisplay').textContent=`${answered}/${questions.length}`;document.getElementById('percentDisplay').textContent=pct+'%';}
    function saveScore(){const answered=userAnswers.filter(a=>a>=0).length;if(answered<questions.length&&!confirm(`Answered ${answered}/${questions.length}. Save?`))return;checkAllAnswers();const correct=userAnswers.filter((a,i)=>a===questions[i].correct).length;const pct=answered>0?Math.round((correct/answered)*100):0;localStorage.setItem(`studyhub-quiz-${QUIZ_ID}`,pct);localStorage.setItem(`studyhub-quiz-${QUIZ_ID}-details`,JSON.stringify({score:correct*10,total:questions.length*10,percentage:pct,grade:getGrade(pct),courseId:QUIZ_ID,courseName:'MMPC-03: Business Environment',questions:questions,timestamp:Date.now()}));if(pct>=80)localStorage.setItem(`studyhub-progress-${QUIZ_ID}`,100);showToast(`Score: ${pct}%`,pct>=80?'success':'info');setTimeout(()=>{window.location.href='quiz-results.html?course='+QUIZ_ID;},2000);}
    function resetQuiz(){userAnswers=new Array(questions.length).fill(-1);renderQuiz();updateStats();}
    renderQuiz();
    </script>
    <script src="pwa-register.js"></script>
