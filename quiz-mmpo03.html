<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPO-03 Operations Management - Quiz | StudyHub</title>
    <link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="quiz-header" style="padding-top: 3.5rem;">
        <h1>&#x1F4E0; MMPO-03 Operations Management Quiz</h1>
        <p>Test your knowledge of Operations Management</p>
        <div class="quiz-stats">
            <div class="quiz-stat">
                <div class="stat-value" id="currentQ">1</div>
                <div class="stat-label">Current</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="scoreVal">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="timeVal">20:00</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>
        <div class="quiz-progress-container">
            <div class="quiz-progress-bar" id="progressBar"></div>
        </div>
        <div class="quiz-progress-text" id="progressText">Question 1 of 10</div>
    </header>

    <div class="quiz-controls" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="quizEngine.reviewMode()" id="reviewBtn">
            <span class="icon">&#x1F4CB;</span> Review Answers
        </button>
        <div class="review-panel" id="reviewPanel">
            <h3><span class="icon">&#x1F4CD;</span> Jump to Question</h3>
            <div class="question-nav-grid" id="navGrid"></div>
        </div>
        <button class="btn btn-outline" onclick="quizEngine.toggleTimer()" id="timerBtn">
            <span class="icon">&#x23F1;</span> Toggle Timer
        </button>
    </div>

    <main style="max-width: 800px; margin: 0 auto; padding: 0 1.5rem;">
        <div class="question-nav" id="questionNav">
            <h3><span class="icon">&#x1F50D;</span> Question Navigation</h3>
            <div class="question-nav-grid" id="questionNavGrid"></div>
        </div>

        <div class="question-card current-question" id="questionCard">
            <h3 id="questionTitle">Question Title</h3>
            <div id="questionContent"></div>
        </div>

        <div id="answerOptions"></div>
        <div id="explanationArea" style="margin-top: 1rem;"></div>

        <div class="quiz-controls" style="justify-content: space-between; margin-top: 2rem;">
            <button class="btn btn-outline" onclick="quizEngine.prev()" id="prevBtn">
                <span class="icon">&#x2190;</span> Previous
            </button>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
                <button class="btn btn-secondary" onclick="quizEngine.randomize()" id="randomBtn">
                    <span class="icon">&#x1F500;</span> Randomize
                </button>
                <button class="btn btn-secondary" onclick="quizEngine.markReview()" id="markBtn">
                    <span class="icon">&#x1F516;</span> Mark for Review
                </button>
            </div>
            <button class="btn btn-primary" onclick="quizEngine.next()" id="nextBtn">
                Next <span class="icon">&#x2192;</span>
            </button>
        </div>
    </main>

    <div class="quiz-timer" id="quizTimer">
        <span class="icon">&#x23F1;</span> <span id="timerDisplay">20:00</span>
    </div>

    <script src="quiz-engine.js"></script>
    <script>
        const questions = [
            {
                question: "Which service characteristic means the service is produced and consumed simultaneously (I-I-H-P)?",
                options: [
                    "Intangibility",
                    "Inseparability",
                    "Heterogeneity",
                    "Perishability"
                ],
                answer: 1,
                explanation: "I-I-H-P = Intangibility (cannot be touched), Inseparability (produced and consumed simultaneously), Heterogeneity (quality varies), and Perishability (cannot be stored)."
            },
            {
                question: "For a budget airline, safety is a minimum standard customers expect but it does not win orders. Safety is therefore a(n):",
                options: [
                    "Order winner",
                    "Order qualifier",
                    "Core competency",
                    "Value chain activity"
                ],
                answer: 1,
                explanation: "Order qualifiers are minimum requirements to even be considered in the market. Order winners are the differentiators that win orders, such as low cost for a budget airline."
            },
            {
                question: "The 7 wastes of Lean operations, known by the mnemonic TIMWOOD, are:",
                options: [
                    "Transport, Inventory, Motion, Waiting, Overproduction, Over-processing, Defects",
                    "Time, Ideas, Materials, Workforce, Output, Overhead, Delays",
                    "Tools, Inspection, Maintenance, Waste, Output, Ordering, Delivery",
                    "Training, Integration, Marketing, Warehousing, Operations, Ordering, Design"
                ],
                answer: 0,
                explanation: "TIMWOOD = Transport, Inventory, Motion, Waiting, Overproduction, Over-processing, Defects. Lean operations eliminate all forms of waste in the system."
            },
            {
                question: "In process and capacity analysis, the bottleneck is:",
                options: [
                    "The step with the highest capacity",
                    "The process step with the lowest capacity, which limits the entire system",
                    "The first step in the process",
                    "The step with the highest cost"
                ],
                answer: 1,
                explanation: "The bottleneck is the resource with the lowest capacity and it limits overall throughput. The Theory of Constraints (TOC) says: Identify, Exploit, Subordinate, Elevate, Repeat."
            },
            {
                question: "The break-even point (BEP) in units is calculated as:",
                options: [
                    "BEP = FC / (P - VC)",
                    "BEP = FC x (P - VC)",
                    "BEP = (P - VC) / FC",
                    "BEP = FC + P - VC"
                ],
                answer: 0,
                explanation: "BEP = Fixed Cost / (Price - Variable Cost per unit). It is the output level at which total revenue equals total cost."
            },
            {
                question: "The Economic Order Quantity (EOQ), which minimizes total ordering and holding costs, is given by:",
                options: [
                    "EOQ = sqrt(2DS/H)",
                    "EOQ = sqrt(DS/H)",
                    "EOQ = 2DS/H",
                    "EOQ = sqrt(2DH/S)"
                ],
                answer: 0,
                explanation: "EOQ = sqrt(2DS/H), where D = annual demand, S = ordering cost per order, and H = holding cost per unit per year. Reorder point ROP = d x L + Safety Stock."
            },
            {
                question: "The exponential smoothing forecast formula, where alpha is the smoothing constant, is:",
                options: [
                    "F(t+1) = alpha x D(t) + (1 - alpha) x F(t)",
                    "F(t+1) = alpha x F(t) + (1 - alpha) x D(t)",
                    "F(t+1) = D(t) + alpha x F(t)",
                    "F(t+1) = (D(t) + F(t)) / 2"
                ],
                answer: 0,
                explanation: "F(t+1) = alpha x D(t) + (1 - alpha) x F(t). Higher alpha gives more weight to recent actual demand and makes the forecast more reactive."
            },
            {
                question: "Which aggregate planning strategy matches demand by adjusting the workforce through hiring and firing, keeping inventory low?",
                options: [
                    "Chase strategy",
                    "Level strategy",
                    "Mixed strategy",
                    "EOQ strategy"
                ],
                answer: 0,
                explanation: "Chase strategy adjusts capacity (hire/fire) to match demand and keeps inventory low. Level strategy keeps a constant production rate and uses inventory or backlog to absorb fluctuations; Mixed combines both."
            },
            {
                question: "DMAIC, the Six Sigma methodology used for improving EXISTING processes, stands for:",
                options: [
                    "Define, Measure, Analyze, Improve, Control",
                    "Define, Measure, Analyze, Design, Verify",
                    "Design, Measure, Analyze, Improve, Control",
                    "Define, Measure, Adjust, Improve, Control"
                ],
                answer: 0,
                explanation: "DMAIC = Define, Measure, Analyze, Improve, Control (existing processes). DMADV = Define, Measure, Analyze, Design, Verify is used for new processes. Six Sigma targets 3.4 DPMO."
            },
            {
                question: "Overall Equipment Effectiveness (OEE) is calculated as:",
                options: [
                    "OEE = Availability x Performance x Quality",
                    "OEE = Availability + Performance + Quality",
                    "OEE = Availability / Performance / Quality",
                    "OEE = Quality x Speed x Cost"
                ],
                answer: 0,
                explanation: "OEE = Availability x Performance x Quality. Availability = MTBF/(MTBF+MTTR), and world-class OEE is 85% or higher."
            }
        ];

        const quizEngine = new QuizEngine('mmpo03', 'MMPO03', questions);
        quizEngine.init();

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            switch(e.key) {
                case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); quizEngine.prev(); break;
                case 'ArrowRight': case 'd': case 'D': e.preventDefault(); quizEngine.next(); break;
                case '1': case '2': case '3': case '4':
                    if (quizEngine.state === 'in-progress') {
                        const num = parseInt(e.key);
                        if (num <= quizEngine.getCurrentQuestion().options.length) {
                            quizEngine.selectAnswer(num - 1);
                        }
                    }
                    break;
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                quizEngine.toggleTimer(false);
            } else {
                if (quizEngine.timerEnabled) {
                    quizEngine.toggleTimer(true);
                }
            }
        });
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
