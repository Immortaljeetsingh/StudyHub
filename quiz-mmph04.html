<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPH-04 Industrial Relations - Quiz | StudyHub</title>
    <link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="quiz-header">
        <h1>&#x1F4E0; MMPH-04 Industrial Relations Quiz</h1>
        <p>Test your knowledge of Industrial Relations</p>
        <div class="quiz-stats">
            <div class="quiz-stat">
                <div class="stat-value" id="currentQ">1</div>
                <div class="stat-label">Current</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="scoreVal">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="timeVal">20:00</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>
        <div class="quiz-progress-container">
            <div class="quiz-progress-bar" id="progressBar"></div>
        </div>
        <div class="quiz-progress-text" id="progressText">Question 1 of 10</div>
    </header>

    <div class="quiz-controls" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="quizEngine.reviewMode()" id="reviewBtn">
            <span class="icon">&#x1F4CB;</span> Review Answers
        </button>
        <button class="btn btn-outline" onclick="quizEngine.toggleTimer()" id="timerBtn">
            <span class="icon">&#x23F1;</span> Toggle Timer
        </button>
    </div>
    <div class="review-panel" id="reviewPanel">
        <h3><span class="icon">&#x1F4CD;</span> Jump to Question</h3>
        <div class="question-nav-grid" id="navGrid"></div>
    </div>

    <main style="max-width: 800px; margin: 0 auto; padding: 0 1.5rem;">
        <div class="question-nav" id="questionNav">
            <h3><span class="icon">&#x1F50D;</span> Question Navigation</h3>
            <div class="question-nav-grid" id="questionNavGrid"></div>
        </div>

        <div class="question-card current-question" id="questionCard">
            <h3 id="questionTitle">Question Title</h3>
            <div id="questionContent"></div>
        </div>

        <div id="answerOptions"></div>
        <div id="explanationArea" style="margin-top: 1rem;"></div>

        <div class="quiz-controls" style="justify-content: space-between; margin-top: 2rem;">
            <button class="btn btn-outline" onclick="quizEngine.prev()" id="prevBtn">
                <span class="icon">&#x2190;</span> Previous
            </button>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
                <button class="btn btn-secondary" onclick="quizEngine.randomize()" id="randomBtn">
                    <span class="icon">&#x1F500;</span> Randomize
                </button>
                <button class="btn btn-secondary" onclick="quizEngine.markReview()" id="markBtn">
                    <span class="icon">&#x1F516;</span> Mark for Review
                </button>
            </div>
            <button class="btn btn-primary" onclick="quizEngine.next()" id="nextBtn">
                Next <span class="icon">&#x2192;</span>
            </button>
        </div>
    </main>

    <div class="quiz-timer" id="quizTimer">
        <span class="icon">&#x23F1;</span> <span id="timerDisplay">20:00</span>
    </div>

    <script src="quiz-engine.js"></script>
    <script>
        const questions = [
            {
                question: "The Systems approach to industrial relations is associated with:",
                options: [
                    "Dunlop",
                    "Marx",
                    "Webb",
                    "Fox"
                ],
                answer: 0,
                explanation: "John Dunlop (1958) built the systems model of IR: three contexts (technology, market, power) plus three actors and an ideology produce the rules of the system (mnemonic C-M-I-R)."
            },
            {
                question: "The Industrial Disputes Act was enacted in:",
                options: [
                    "1926",
                    "1947",
                    "1948",
                    "1972"
                ],
                answer: 1,
                explanation: "The Industrial Disputes Act came in 1947. The Trade Unions Act came in 1926, the Factories Act and Minimum Wages Act in 1948, and the Gratuity Act in 1972."
            },
            {
                question: "The ILO was founded in:",
                options: [
                    "1920, London",
                    "1947, New Delhi",
                    "1919, Geneva",
                    "1958, Paris"
                ],
                answer: 2,
                explanation: "The International Labour Organisation was established in 1919 in Geneva. It is tripartite (governments, employers, workers), India is a founding member, and it has ratified all 8 core conventions."
            },
            {
                question: "The term 'collective bargaining' was coined by:",
                options: [
                    "John Dunlop",
                    "Sidney and Beatrice Webb",
                    "Karl Marx",
                    "Alan Fox"
                ],
                answer: 1,
                explanation: "Sidney and Beatrice Webb coined the term in 1897 in their book 'Industrial Democracy'. Collective bargaining is negotiation between employers and workers' representatives over terms and conditions of employment."
            },
            {
                question: "BATNA in negotiation stands for:",
                options: [
                    "Best Alternative To Negotiated Agreement",
                    "Basic Agreement on Trade and Negotiations",
                    "Binding Arbitration To Negotiate Agreements",
                    "Bilateral Action Towards New Agreements"
                ],
                answer: 0,
                explanation: "BATNA is the Best Alternative To Negotiated Agreement - the walk-away point that gives a negotiator power in bargaining."
            },
            {
                question: "Fisher and Ury's influential book on principled negotiation is:",
                options: [
                    "Getting to No",
                    "The Art of War",
                    "Getting to Yes",
                    "Industrial Democracy"
                ],
                answer: 2,
                explanation: "Fisher and Ury of the Harvard Negotiation Project wrote 'Getting to Yes' (1981), built on four principles: separate people from the problem, focus on interests, generate options and use objective criteria."
            },
            {
                question: "According to Jucious, a grievance is:",
                options: [
                    "Any discontent or dissatisfaction connected with the company",
                    "A formal legal complaint filed in court",
                    "A strike notice issued to management",
                    "A disciplinary action against a worker"
                ],
                answer: 0,
                explanation: "Jucious defined a grievance as 'any discontent or dissatisfaction, whether valid or not, arising from anything connected with the company'. A written grievance is formal, while a verbal complaint is informal."
            },
            {
                question: "The natural justice principle 'audi alteram partem' means:",
                options: [
                    "No one should be judge in their own case",
                    "Hear the other side",
                    "Let the punishment fit the crime",
                    "Innocent until proven guilty"
                ],
                answer: 1,
                explanation: "'Audi alteram partem' means hearing both sides before deciding. The companion principle, 'nemo judex in causa sua', means no one should judge their own case."
            },
            {
                question: "The Minimum Wages Act was enacted in:",
                options: [
                    "1936",
                    "1965",
                    "1948",
                    "1972"
                ],
                answer: 2,
                explanation: "The Minimum Wages Act (1948) fixed minimum wages, revised every 5 years. It is now consolidated into the Code on Wages 2019 along with the Payment of Wages Act 1936 and the Payment of Bonus Act 1965."
            },
            {
                question: "Under the IR Code 2020, a union needs what membership share to be recognised as sole negotiating agent?",
                options: [
                    "25%",
                    "33%",
                    "75%",
                    "51%"
                ],
                answer: 3,
                explanation: "The IR Code 2020 requires 51% or more membership (or a secret ballot) for recognition. It also raised the worker threshold for standing orders from 100 to 300."
            }
        ];

        const quizEngine = new QuizEngine('mmph04', 'MMPH04', questions);
        quizEngine.init();

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            switch(e.key) {
                case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); quizEngine.prev(); break;
                case 'ArrowRight': case 'd': case 'D': e.preventDefault(); quizEngine.next(); break;
                case '1': case '2': case '3': case '4':
                    if (quizEngine.state === 'in-progress') {
                        const num = parseInt(e.key);
                        if (num <= quizEngine.getCurrentQuestion().options.length) {
                            quizEngine.selectAnswer(num - 1);
                        }
                    }
                    break;
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                quizEngine.toggleTimer(false);
            } else {
                if (quizEngine.timerEnabled) {
                    quizEngine.toggleTimer(true);
                }
            }
        });
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
