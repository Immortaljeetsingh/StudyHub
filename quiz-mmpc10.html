<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPC-10 Managerial Economics - Quiz | StudyHub</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Mobile fixes (<=480px): clear lane for the fixed timer pill, no overlap, no spill */
        @media (max-width: 480px) {
            .top-toolbar { padding-right: 4.5rem; }
            .quiz-header { padding-top: 3.5rem; }
            .quiz-timer { top: 0.5rem; right: 0.5rem; font-size: 0.72rem; padding: 0.25rem 0.6rem; }
            .question-card { padding: 1.25rem; }
        }
    </style>

<link rel="manifest" href="manifest.json">
</head>
<body class="subject-mmpc10">
    <div id="liveRegion" class="sr-only" aria-live="polite"></div>
    <script src="api-utils.js"></script>
    <script>document.write(renderApiSettingsModal());document.write(renderToolbar('mmpc-10'));</script>

    <header class="quiz-header">
        <h1>&#x1F4E0; MMPC-10 Managerial Economics Quiz</h1>
        <p>Test your knowledge of Managerial Economics</p>
        <div class="quiz-stats">
            <div class="quiz-stat">
                <div class="stat-value" id="currentQ">1</div>
                <div class="stat-label">Current</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="scoreVal">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="timeVal">20:00</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>
        <div class="quiz-progress-container">
            <div class="quiz-progress-bar" id="progressBar"></div>
        </div>
        <div class="quiz-progress-text" id="progressText">Question 1 of 10</div>
    </header>

    <div class="quiz-controls" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="quizEngine.reviewMode()" id="reviewBtn">
            <span class="icon">&#x1F4CB;</span> Review Answers
        </button>
        <div class="review-panel" id="reviewPanel">
            <h3><span class="icon">&#x1F4CD;</span> Jump to Question</h3>
            <div class="question-nav-grid" id="navGrid"></div>
        </div>
        <button class="btn btn-outline" onclick="quizEngine.toggleTimer()" id="timerBtn">
            <span class="icon">&#x23F1;</span> Toggle Timer
        </button>
    </div>

    <main style="max-width: 800px; margin: 0 auto; padding: 0 1.5rem;">
        <div class="question-nav" id="questionNav">
            <h3><span class="icon">&#x1F50D;</span> Question Navigation</h3>
            <div class="question-nav-grid" id="questionNavGrid"></div>
        </div>

        <div class="question-card current-question" id="questionCard">
            <h3 id="questionTitle">Question Title</h3>
            <div id="questionContent"></div>
        </div>

        <div id="answerOptions"></div>
        <div id="explanationArea" style="margin-top: 1rem;"></div>

        <div class="quiz-controls" style="justify-content: space-between; margin-top: 2rem;">
            <button class="btn btn-outline" onclick="quizEngine.prev()" id="prevBtn">
                <span class="icon">&#x2190;</span> Previous
            </button>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
                <button class="btn btn-secondary" onclick="quizEngine.randomize()" id="randomBtn">
                    <span class="icon">&#x1F500;</span> Randomize
                </button>
                <button class="btn btn-secondary" onclick="quizEngine.markReview()" id="markBtn">
                    <span class="icon">&#x1F516;</span> Mark for Review
                </button>
            </div>
            <button class="btn btn-primary" onclick="quizEngine.next()" id="nextBtn">
                Next <span class="icon">&#x2192;</span>
            </button>
        </div>
    </main>

    <div class="quiz-timer" id="quizTimer">
        <span class="icon">&#x23F1;</span> <span id="timerDisplay">20:00</span>
    </div>

    <script src="quiz-engine.js"></script>
    <script>
        const questions = [
            {
                question: "Managerial Economics is described as normative (prescriptive) because it:",
                options: [
                    "Describes what already happened",
                    "Only studies government policy",
                    "Avoids business decisions",
                    "Tells managers what they should do"
                ],
                answer: 3,
                explanation: "Managerial economics is applied microeconomics for business decisions. It is normative or prescriptive because it guides managers on what they should do, unlike positive (descriptive) economics which states what is."
            },
            {
                question: "A movement along the demand curve occurs when there is a change in:",
                options: [
                    "Consumer income",
                    "Tastes and preferences",
                    "The price of the good itself",
                    "The price of substitutes"
                ],
                answer: 2,
                explanation: "A movement along the demand curve happens only when the good's own price changes. Changes in income, tastes or the prices of related goods shift the entire demand curve: 'Move on Price, Shift on the rest.'"
            },
            {
                question: "For a good with inelastic demand (|Ed| < 1), an increase in price will cause total revenue to:",
                options: [
                    "Fall",
                    "Stay the same",
                    "Rise",
                    "Become zero"
                ],
                answer: 2,
                explanation: "For inelastic demand, price and total revenue move in the same direction, so a price rise increases revenue - petrol in India behaves this way because commuters have few substitutes. Revenue is maximized only at unit elasticity."
            },
            {
                question: "In production theory, the optimal range of production is Stage II, where:",
                options: [
                    "MP is negative",
                    "MP and AP both rise",
                    "TP is falling",
                    "MP > 0 and falling, AP falling"
                ],
                answer: 3,
                explanation: "Stage II is optimal because marginal product is still positive but falling while AP is falling. In Stage I, MP is rising so inputs should be added; in Stage III, MP is negative so total output falls and inputs should be cut."
            },
            {
                question: "The break-even quantity for a firm is computed as:",
                options: [
                    "Q = FC x P",
                    "Q = FC / (P - AVC)",
                    "Q = ATC / MC",
                    "Q = P - AVC"
                ],
                answer: 1,
                explanation: "Break-even output is Q = FC / (P - AVC), the quantity where total revenue equals total cost. If price falls below AVC, the firm reaches its shutdown point and should stop production."
            },
            {
                question: "The long-run average cost curve (LRAC) is also known as:",
                options: [
                    "The marginal revenue curve",
                    "The demand curve",
                    "The envelope curve",
                    "The total cost curve"
                ],
                answer: 2,
                explanation: "LRAC is the envelope curve because it touches or envelopes all short-run average cost curves, and it is U-shaped due to economies then diseconomies of scale. At the minimum of LRAC, SRAC = SRMC = LRAC = LRMC."
            },
            {
                question: "Economies of scale arise when:",
                options: [
                    "Average cost falls as output increases",
                    "Average cost rises as output increases",
                    "Marginal cost equals average cost",
                    "Fixed costs rise with output"
                ],
                answer: 0,
                explanation: "Economies of scale mean per-unit (average) cost falls as output grows, from production, marketing, managerial, transport, pecuniary and external sources. When average cost rises with output, the firm faces diseconomies of scale."
            },
            {
                question: "Which market structure is characterized by a few large, interdependent firms?",
                options: [
                    "Perfect competition",
                    "Monopolistic competition",
                    "Monopoly",
                    "Oligopoly"
                ],
                answer: 3,
                explanation: "Oligopoly has few interdependent firms (e.g., Jio, Airtel and Vi in telecom) with significant price control and difficult entry. Perfect competition has many price-taking firms, monopoly has one, and monopolistic competition has many differentiated sellers."
            },
            {
                question: "In perfect competition, the condition P = MR = MC holds at profit maximization because:",
                options: [
                    "The firm is a price maker",
                    "Demand is downward sloping",
                    "The firm faces a horizontal demand curve and is a price taker",
                    "The firm has market power"
                ],
                answer: 2,
                explanation: "In perfect competition the firm is a price taker facing a perfectly elastic (horizontal) demand curve, so P = MR = AR, and the universal rule MR = MC becomes P = MC. In monopoly, MR lies below price, so P > MR = MC."
            },
            {
                question: "In an optimal two-part tariff, the per-unit usage fee should be set equal to:",
                options: [
                    "Average cost",
                    "Marginal cost",
                    "Fixed cost",
                    "Market price"
                ],
                answer: 1,
                explanation: "The optimal two-part tariff sets the usage fee equal to marginal cost and extracts the remaining consumer surplus through the fixed entry fee - for example a club charging membership plus drink prices, or Jio's monthly plan plus data charges."
            }
        ];

        const quizEngine = new QuizEngine('mmpc10', 'MMPC10', questions);
        quizEngine.init();

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            switch(e.key) {
                case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); quizEngine.prev(); break;
                case 'ArrowRight': case 'd': case 'D': e.preventDefault(); quizEngine.next(); break;
                case '1': case '2': case '3': case '4':
                    if (quizEngine.state === 'in-progress') {
                        const num = parseInt(e.key);
                        if (num <= quizEngine.getCurrentQuestion().options.length) {
                            quizEngine.selectAnswer(num - 1);
                        }
                    }
                    break;
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                quizEngine.toggleTimer(false);
            } else {
                if (quizEngine.timerEnabled) {
                    quizEngine.toggleTimer(true);
                }
            }
        });
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
