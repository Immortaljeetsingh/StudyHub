<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPO-08 Management of R&amp;D and Innovation - Quiz | StudyHub</title>
    <link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="quiz-header">
        <h1>&#x1F4E0; MMPO-08 Management of R&amp;D and Innovation Quiz</h1>
        <p>Test your knowledge of Management of R&amp;D and Innovation</p>
        <div class="quiz-stats">
            <div class="quiz-stat">
                <div class="stat-value" id="currentQ">1</div>
                <div class="stat-label">Current</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="scoreVal">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="timeVal">20:00</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>
        <div class="quiz-progress-container">
            <div class="quiz-progress-bar" id="progressBar"></div>
        </div>
        <div class="quiz-progress-text" id="progressText">Question 1 of 10</div>
    </header>

    <div class="quiz-controls" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="quizEngine.reviewMode()" id="reviewBtn">
            <span class="icon">&#x1F4CB;</span> Review Answers
        </button>
        <div class="review-panel" id="reviewPanel">
            <h3><span class="icon">&#x1F4CD;</span> Jump to Question</h3>
            <div class="question-nav-grid" id="navGrid"></div>
        </div>
        <button class="btn btn-outline" onclick="quizEngine.toggleTimer()" id="timerBtn">
            <span class="icon">&#x23F1;</span> Toggle Timer
        </button>
    </div>

    <main style="max-width: 800px; margin: 0 auto; padding: 0 1.5rem;">
        <div class="question-nav" id="questionNav">
            <h3><span class="icon">&#x1F50D;</span> Question Navigation</h3>
            <div class="question-nav-grid" id="questionNavGrid"></div>
        </div>

        <div class="question-card current-question" id="questionCard">
            <h3 id="questionTitle">Question Title</h3>
            <div id="questionContent"></div>
        </div>

        <div id="answerOptions"></div>
        <div id="explanationArea" style="margin-top: 1rem;"></div>

        <div class="quiz-controls" style="justify-content: space-between; margin-top: 2rem;">
            <button class="btn btn-outline" onclick="quizEngine.prev()" id="prevBtn">
                <span class="icon">&#x2190;</span> Previous
            </button>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
                <button class="btn btn-secondary" onclick="quizEngine.randomize()" id="randomBtn">
                    <span class="icon">&#x1F500;</span> Randomize
                </button>
                <button class="btn btn-secondary" onclick="quizEngine.markReview()" id="markBtn">
                    <span class="icon">&#x1F516;</span> Mark for Review
                </button>
            </div>
            <button class="btn btn-primary" onclick="quizEngine.next()" id="nextBtn">
                Next <span class="icon">&#x2192;</span>
            </button>
        </div>
    </main>

    <div class="quiz-timer" id="quizTimer">
        <span class="icon">&#x23F1;</span> <span id="timerDisplay">20:00</span>
    </div>

    <script src="quiz-engine.js"></script>
    <script>
        const questions = [
            {
                question: "Which type of R&D has the highest risk and the longest timeline, aiming to generate new knowledge without a specific application in view?",
                options: [
                    "Basic research",
                    "Applied research",
                    "Experimental development",
                    "Commercialization"
                ],
                answer: 0,
                explanation: "Basic research pursues new knowledge (highest risk, longest timeline, usually government-funded). Applied research targets a practical aim, and development produces commercial products."
            },
            {
                question: "R&D intensity, an indicator of a firm's innovation commitment, is measured as:",
                options: [
                    "R&D expenditure divided by sales revenue",
                    "Sales revenue divided by R&D expenditure",
                    "R&D employees divided by total employees",
                    "Patents filed divided by sales revenue"
                ],
                answer: 0,
                explanation: "R&D intensity = R&D expenditure / Sales revenue. Pharma companies spend 15-20% of revenue on R&D, giving them a high intensity."
            },
            {
                question: "According to Christensen, a disruptive innovation is one that:",
                options: [
                    "Creates a new market by displacing established competitors",
                    "Makes small improvements to an existing product",
                    "Copies a competitor's mature technology",
                    "Improves an existing process incrementally"
                ],
                answer: 0,
                explanation: "Disruptive innovation (Christensen) creates a new market and displaces incumbents - the iPhone displaced Nokia and BlackBerry. Incremental innovation makes small improvements to existing products."
            },
            {
                question: "In Rogers' diffusion of innovation curve, the 'early majority' adopters represent what percentage of the market?",
                options: [
                    "2.5%",
                    "13.5%",
                    "34%",
                    "16%"
                ],
                answer: 2,
                explanation: "Rogers' curve: innovators 2.5%, early adopters 13.5%, early majority 34%, late majority 34% and laggards 16%. The chasm (Moore) lies between early adopters and the early majority."
            },
            {
                question: "The Triple Helix model of national innovation systems emphasizes interaction between:",
                options: [
                    "University, industry and government",
                    "Suppliers, distributors and retailers",
                    "Banks, insurers and auditors",
                    "Startups, incubators and accelerators"
                ],
                answer: 0,
                explanation: "The Triple Helix combines University (research), Industry (commercialization) and Government (policy and funding). India's NIS includes institutions like DST, CSIR and DSIR."
            },
            {
                question: "Samsung, which quickly imitates and improves on the market leader's innovations, follows which R&D strategy?",
                options: [
                    "Leader strategy",
                    "Fast follower strategy",
                    "Niche strategy",
                    "Imitator strategy"
                ],
                answer: 1,
                explanation: "The leader (Apple) is first to market, the fast follower (Samsung) quickly imitates and improves, niche players focus on one area (Qualcomm), and imitators copy mature technology (generic pharma)."
            },
            {
                question: "Which R&D budgeting method requires each project to justify its entire funding from scratch every year?",
                options: [
                    "Percentage of sales",
                    "Competitive parity",
                    "Task-based budgeting",
                    "Zero-based budgeting"
                ],
                answer: 3,
                explanation: "Zero-based budgeting rebuilds the budget from zero each year - efficient but unstable. Percentage of sales is simple, competitive parity matches rivals, and task-based budgets per project needs."
            },
            {
                question: "In the TRL (Technology Readiness Level) scale, TRL 1 represents:",
                options: [
                    "Basic principles observed",
                    "Prototype demonstrated in space",
                    "System proven in operational environment",
                    "Commercially available product"
                ],
                answer: 0,
                explanation: "TRL runs from 1 (basic principles) to 9 (proven technology). TRL 1-3 covers concept/feasibility, TRL 4-6 development, and TRL 7-9 deployment."
            },
            {
                question: "The Maruti-Suzuki arrangement, which transferred Japanese automobile manufacturing technology to India, is an example of which technology transfer mode?",
                options: [
                    "Licensing",
                    "Joint venture",
                    "Turnkey project",
                    "Technical agreement"
                ],
                answer: 1,
                explanation: "Technology transfer modes include licensing (low control, low cost), joint ventures (Maruti-Suzuki), FDI (Samsung India) and turnkey projects. JVs offer medium control, cost and risk."
            },
            {
                question: "Jugaad-style 'frugal innovation' is best described as:",
                options: [
                    "Doing more with less, using minimal resources while maintaining quality",
                    "Copying mature technology from developed markets",
                    "Outsourcing R&D to low-cost countries",
                    "Protecting every idea through patents"
                ],
                answer: 0,
                explanation: "Frugal innovation (jugaad) delivers value with minimal resources - e.g. Tata Nano, Jaipur Foot and Mitticool. Reverse innovation is developed in emerging markets and later sold in developed ones (GE MAC 400)."
            }
        ];

        const quizEngine = new QuizEngine('mmpo08', 'MMPO08', questions);
        quizEngine.init();

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            switch(e.key) {
                case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); quizEngine.prev(); break;
                case 'ArrowRight': case 'd': case 'D': e.preventDefault(); quizEngine.next(); break;
                case '1': case '2': case '3': case '4':
                    if (quizEngine.state === 'in-progress') {
                        const num = parseInt(e.key);
                        if (num <= quizEngine.getCurrentQuestion().options.length) {
                            quizEngine.selectAnswer(num - 1);
                        }
                    }
                    break;
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                quizEngine.toggleTimer(false);
            } else {
                if (quizEngine.timerEnabled) {
                    quizEngine.toggleTimer(true);
                }
            }
        });
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
