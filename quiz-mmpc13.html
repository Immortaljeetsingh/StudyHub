<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPC-13 Business Law - Quiz | StudyHub</title>
    <link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="quiz-header" style="padding-top: 3.5rem;">
        <h1>&#x1F4E0; MMPC-13 Business Law Quiz</h1>
        <p>Test your knowledge of Business Law</p>
        <div class="quiz-stats">
            <div class="quiz-stat">
                <div class="stat-value" id="currentQ">1</div>
                <div class="stat-label">Current</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="scoreVal">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="timeVal">20:00</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>
        <div class="quiz-progress-container">
            <div class="quiz-progress-bar" id="progressBar"></div>
        </div>
        <div class="quiz-progress-text" id="progressText">Question 1 of 10</div>
    </header>

    <div class="quiz-controls" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="quizEngine.reviewMode()" id="reviewBtn">
            <span class="icon">&#x1F4CB;</span> Review Answers
        </button>
        <div class="review-panel" id="reviewPanel">
            <h3><span class="icon">&#x1F4CD;</span> Jump to Question</h3>
            <div class="question-nav-grid" id="navGrid"></div>
        </div>
        <button class="btn btn-outline" onclick="quizEngine.toggleTimer()" id="timerBtn">
            <span class="icon">&#x23F1;</span> Toggle Timer
        </button>
    </div>

    <main style="max-width: 800px; margin: 0 auto; padding: 0 1.5rem;">
        <div class="question-nav" id="questionNav">
            <h3><span class="icon">&#x1F50D;</span> Question Navigation</h3>
            <div class="question-nav-grid" id="questionNavGrid"></div>
        </div>

        <div class="question-card current-question" id="questionCard">
            <h3 id="questionTitle">Question Title</h3>
            <div id="questionContent"></div>
        </div>

        <div id="answerOptions"></div>
        <div id="explanationArea" style="margin-top: 1rem;"></div>

        <div class="quiz-controls" style="justify-content: space-between; margin-top: 2rem;">
            <button class="btn btn-outline" onclick="quizEngine.prev()" id="prevBtn">
                <span class="icon">&#x2190;</span> Previous
            </button>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
                <button class="btn btn-secondary" onclick="quizEngine.randomize()" id="randomBtn">
                    <span class="icon">&#x1F500;</span> Randomize
                </button>
                <button class="btn btn-secondary" onclick="quizEngine.markReview()" id="markBtn">
                    <span class="icon">&#x1F516;</span> Mark for Review
                </button>
            </div>
            <button class="btn btn-primary" onclick="quizEngine.next()" id="nextBtn">
                Next <span class="icon">&#x2192;</span>
            </button>
        </div>
    </main>

    <div class="quiz-timer" id="quizTimer">
        <span class="icon">&#x23F1;</span> <span id="timerDisplay">20:00</span>
    </div>

    <script src="quiz-engine.js"></script>
    <script>
        const questions = [
            {
                question: "Which of the following is one of the three pillars of business law?",
                options: [
                    "Litigation",
                    "Property",
                    "Arbitration",
                    "Negotiation"
                ],
                answer: 1,
                explanation: "The three pillars of business law are Law, Rule of Law, and Property (LRP). Litigation and arbitration are dispute resolution mechanisms, not pillars."
            },
            {
                question: "Which ADR method gives a neutral third party the authority to make a binding decision?",
                options: [
                    "Mediation",
                    "Conciliation",
                    "Arbitration",
                    "Negotiation"
                ],
                answer: 2,
                explanation: "In arbitration the neutral third party makes a binding decision. Mediation is non-binding, conciliation proposes a settlement, and negotiation is direct discussion between parties."
            },
            {
                question: "A partner who only lends their name to the firm, without participating in management, is called a:",
                options: [
                    "Nominal partner",
                    "Sleeping partner",
                    "Sub-partner",
                    "Active partner"
                ],
                answer: 0,
                explanation: "A nominal partner only gives their name to the firm and has unlimited liability, with public notice required on retirement. A sleeping partner invests money but does not manage."
            },
            {
                question: "Which case established that a company is a separate legal entity distinct from its members?",
                options: [
                    "Salomon v Salomon",
                    "Donoghue v Stevenson",
                    "Rylands v Fletcher",
                    "Carlill v Carbolic Smoke Ball"
                ],
                answer: 0,
                explanation: "Salomon v Salomon established the separate legal entity of a company, a key feature of the Companies Act, 2013 along with perpetual succession and limited liability."
            },
            {
                question: "Which of the following is a vitiating element that makes consent not free under the Indian Contract Act?",
                options: [
                    "Lawful consideration",
                    "Competency of parties",
                    "Lawful object",
                    "Undue influence"
                ],
                answer: 3,
                explanation: "The five vitiating elements are coercion (s.15), undue influence (s.16), fraud (s.17), misrepresentation (s.18), and mistake (s.20-22). Undue influence arises from misuse of a dominant position."
            },
            {
                question: "The CISG (UN Convention on Contracts for International Sale of Goods) applies to:",
                options: [
                    "Auction sales",
                    "Commercial cross-border sale of goods",
                    "Sales of consumer goods",
                    "Sales of ships"
                ],
                answer: 1,
                explanation: "The CISG applies to commercial cross-border sales of goods. It does not apply to consumer goods, auctions, ships, or electricity, and it respects party autonomy."
            },
            {
                question: "FEMA (1999) differs from FERA (1973) in that FEMA treats contraventions as:",
                options: [
                    "Criminal offences",
                    "Capital offences",
                    "Civil offences",
                    "Non-offences"
                ],
                answer: 2,
                explanation: "FERA was restrictive, treated violations as criminal offences, and presumed guilt. FEMA is liberal, treats contraventions as civil offences, and presumes innocence until proven guilty."
            },
            {
                question: "Under the Patents Act, 1970, a patent protects inventions for a period of:",
                options: [
                    "10 years, renewable",
                    "Author's life plus 60 years",
                    "20 years from filing",
                    "15 years"
                ],
                answer: 2,
                explanation: "Patents last 20 years from filing. Trademarks and geographical indications last 10 years (renewable), designs last 15 years, and copyright lasts the author's life plus 60 years."
            },
            {
                question: "Under Section 135 of the Companies Act, 2013, eligible companies must spend what share of average net profits on CSR?",
                options: [
                    "1%",
                    "2%",
                    "5%",
                    "10%"
                ],
                answer: 1,
                explanation: "Companies meeting the net worth, turnover, or net profit thresholds must spend 2% of the average net profits of the preceding three years on CSR activities listed in Schedule VII."
            },
            {
                question: "Under the Consumer Protection Act, 2019, complaints with value up to Rs. 1 crore are filed with the:",
                options: [
                    "District Commission",
                    "National Commission",
                    "Supreme Court",
                    "State Commission"
                ],
                answer: 0,
                explanation: "The three-tier system is: District Commission (up to Rs. 1 crore, appeal to State Commission), State Commission (Rs. 1-10 crore), and National Commission (above Rs. 10 crore, appeal to Supreme Court)."
            }
        ];

        const quizEngine = new QuizEngine('mmpc13', 'MMPC13', questions);
        quizEngine.init();

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            switch(e.key) {
                case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); quizEngine.prev(); break;
                case 'ArrowRight': case 'd': case 'D': e.preventDefault(); quizEngine.next(); break;
                case '1': case '2': case '3': case '4':
                    if (quizEngine.state === 'in-progress') {
                        const num = parseInt(e.key);
                        if (num <= quizEngine.getCurrentQuestion().options.length) {
                            quizEngine.selectAnswer(num - 1);
                        }
                    }
                    break;
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                quizEngine.toggleTimer(false);
            } else {
                if (quizEngine.timerEnabled) {
                    quizEngine.toggleTimer(true);
                }
            }
        });
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
