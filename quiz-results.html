<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results | StudyHub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles-enhanced.css">
    <style>
        body {
            background: #06060f !important;
        }
        .results-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        .results-header {
            text-align: center;
            padding: 3rem 2rem;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }
        .results-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #c8c8c8, #b0b0b0, #d0d0d0);
        }
        .results-score {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #b0b0b0, #b0b0b0, #d0d0d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .results-grade {
            font-size: 2rem;
            font-weight: 800;
            color: var(--success);
            margin-bottom: 0.5rem;
        }
        .results-header p {
            color: rgba(255,255,255,0.4);
            font-size: 1rem;
        }
        .results-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .results-stat-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .results-stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }
        .results-stat-card .stat-value {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #b0b0b0, #b0b0b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .results-stat-card .stat-label {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            margin-top: 0.25rem;
        }
        .btn {
            border-radius: 60px;
            font-weight: 700;
            padding: 0.7rem 1.5rem;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #c8c8c8, #d0d0d0);
            color: #fff;
            border: none;
            box-shadow: 0 4px 16px rgba(200,200,200,0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #fff;
            border: none;
            box-shadow: 0 4px 16px rgba(52,211,153,0.3);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
            color: var(--accent);
        }
        .igl {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 1.5rem;
        }
        .igl h4 {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }
        .igl p {
            color: rgba(255,255,255,0.55);
            font-size: 0.9rem;
        }
        h3 {
            color: var(--text-primary);
            font-weight: 700;
        }
        .question-review-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
    </style>
    <link rel="stylesheet" href="enhancements.css">
    <link rel="stylesheet" href="revision-mode.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="light-theme.css">
    <link rel="stylesheet" href="components.css">
</head>
<body>
    <div class="results-container">
        <div class="results-header">
            <div class="results-score" id="finalScore">0%</div>
            <div class="results-grade" id="finalGrade">A</div>
            <p id="gradeText">Excellent Performance</p>
        </div>

        <div class="results-stats">
            <div class="results-stat-card">
                <div class="stat-value" id="correctCount">0</div>
                <div class="stat-label">Correct Answers</div>
            </div>
            <div class="results-stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Total Questions</div>
            </div>
            <div class="results-stat-card">
                <div class="stat-value" id="accuracy">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>
        </div>

        <div style="margin: 2rem 0;">
            <h3 style="color: var(--text-primary); margin-bottom: 1rem;">&#x1F4E0; Progress Overview</h3>
            <div class="igl" id="progressOverview">
                <h4>Course Progress</h4>
                <p id="courseProgressText">Loading...</p>
            </div>
        </div>

        <div style="margin: 2rem 0;">
            <h3 style="color: var(--text-primary); margin-bottom: 1rem;">&#x1F4DD; Question Review</h3>
            <div class="question-review-list" id="questionReviewList"></div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 3rem;">
            <button class="btn btn-primary btn-lg" onclick="retakeQuiz()">
                <span class="icon">&#x1F504;</span> Retake Quiz
            </button>
            <button class="btn btn-success btn-lg" onclick="goToStudy()">
                <span class="icon">&#x1F4E1;</span> Review Materials
            </button>
            <button class="btn btn-secondary btn-lg" onclick="goToHub()">
                <span class="icon">&#x1F3E0;</span> Return to Hub
            </button>
        </div>
    </div>

    <script>
        const questions = {
            'mmpc-01': [
                { question: "Which function of management involves setting objectives and determining appropriate actions to achieve them?", options: ["Directing", "Organizing", "Planning", "Controlling"], answer: 2 },
                { question: "The primary reason organizations develop formal plans is to:", options: ["Eliminate all possible errors", "Define goals and establish overall strategy", "Increase the workload of employees", "Make work more complex"], answer: 1 },
                { question: "Which of the following is NOT a characteristic of planning?", options: ["Planning is goal-oriented", "Planning is looking ahead", "Planning is a one-time process", "Planning is an intellectual process"], answer: 2 },
                { question: "Strategic planning is typically done by:", options: ["Middle-level management", "Lower-level management", "Top-level management", "All levels equally"], answer: 2 },
                { question: "Which type of plan sets long-term objectives for the entire organization?", options: ["Operational plan", "Strategic plan", "Tactical plan", "Standing plan"], answer: 1 },
                { question: "The process of establishing a formal structure of authority is called:", options: ["Directing", "Organizing", "Planning", "Staffing"], answer: 1 },
                { question: "Span of control refers to:", options: ["The area a manager can physically see", "The geographical area of operations", "The number of subordinates a manager can effectively supervise", "The financial resources available to a manager"], answer: 2 },
                { question: "Departmentalization based on product lines is called:", options: ["Functional departmentalization", "Geographical departmentalization", "Product departmentalization", "Customer departmentalization"], answer: 2 },
                { question: "Authority flows downward while accountability flows:", options: ["Sideways", "Upward", "In all directions", "Does not flow"], answer: 1 },
                { question: "Centralization in organization structure means:", options: ["Power is distributed to all levels", "Decision-making authority is concentrated at the top", "Departments operate independently", "Managers have no authority"], answer: 1 }
            ],
            'mmpc-02': [
                { question: "Recruitment process begins with:", options: ["Selection", "Training", "Identifying vacancy", "Interview"], answer: 2 },
                { question: "Performance appraisal is primarily concerned with:", options: ["Salary increment", "Evaluating employee performance", "Training needs", "Promotion eligibility"], answer: 1 },
                { question: "The process of attracting qualified applicants for employment is called:", options: ["Selection", "Recruitment", "Induction", "Training"], answer: 1 },
                { question: "Compensation management is concerned with:", options: ["Salary and benefits", "Employee relations", "Safety standards", "Work environment"], answer: 0 },
                { question: "360-degree feedback involves feedback from:", options: ["Only supervisor", "Supervisor and peers", "All stakeholders", "Employee only"], answer: 2 }
            ],
            'mmpc-03': [
                { question: "Business environment includes:", options: ["Only internal factors", "Only external factors", "Both internal and external factors", "None of these"], answer: 2 },
                { question: "Economic environment includes:", options: ["Political system", "GDP, inflation, unemployment", "Technological changes", "Social customs"], answer: 1 },
                { question: "Foreign Direct Investment (FDI) refers to:", options: ["Investment in foreign stocks", "Direct investment by foreign entity in domestic economy", "Loans from foreign banks", "Export of goods"], answer: 1 },
                { question: "Liberalization means:", options: ["Government control over business increases", "Removal of restrictions and opening of economy", "Protection of domestic industries", "Nationalization of industries"], answer: 1 },
                { question: "Privatization involves:", options: ["Government taking over private enterprises", "Transfer of ownership from public to private sector", "New public sector enterprises", "None of above"], answer: 1 }
            ],
            'mmpc-04': [
                { question: "Accounting is the language of:", options: ["Management", "Finance", "Business", "Economics"], answer: 2 },
                { question: "Double entry system means:", options: ["Every transaction has two aspects", "Every transaction recorded twice", "Both A and B correct", "None of above"], answer: 2 },
                { question: "Assets = Liabilities + ______", options: ["Capital", "Revenue", "Expenses", "Profit"], answer: 0 },
                { question: "Current assets include:", options: ["Land and building", "Machinery", "Inventory and cash", "Goodwill"], answer: 2 },
                { question: "Ratio analysis helps in:", options: ["Forecasting", "Decision making", "Evaluating performance", "All of above"], answer: 3 }
            ],
            'mmpc-05': [
                { question: "Mean is also known as:", options: ["Median", "Mode", "Average", "Variance"], answer: 2 },
                { question: "Median is the:", options: ["Middle value", "Most frequent value", "Average value", "Difference between values"], answer: 0 },
                { question: "Probability of an event ranges between:", options: ["0 and 100", "-1 and 1", "0 and 1", "1 and 10"], answer: 2 },
                { question: "Standard deviation measures:", options: ["Central tendency", "Dispersion", "Correlation", "Trend"], answer: 1 },
                { question: "Hypothesis testing is used to:", options: ["Prove a theory", "Test assumptions", "Collect data", "Analyze variance"], answer: 1 }
            ],
            'mmpc-06': [
                { question: "Marketing is defined as:", options: ["Only selling", "Only advertising", "Process of creating, communicating, delivering value", "Customer complaint handling"], answer: 2 },
                { question: "STP stands for:", options: ["Strategy, Tactics, Planning", "Segmentation, Targeting, Positioning", "Sales, Target, Profit", "Service, Technology, People"], answer: 1 },
                { question: "4Ps of marketing are:", options: ["Product, Price, Place, Promotion", "People, Process, Physical evidence, Performance", "Plan, Prepare, Perform, Perfect", "Price, Product, Profit, People"], answer: 0 },
                { question: "Market segmentation divides market into:", options: ["Similar groups", "Different products", "Geographic areas", "Profit levels"], answer: 0 },
                { question: "Brand equity refers to:", options: ["Brand value", "Production cost", "Distribution network", "Employee skills"], answer: 0 }
            ],
            'mmpc-07': [
                { question: "Communication is the process of:", options: ["Only speaking", "Exchanging information", "Writing letters", "Non-verbal cues only"], answer: 1 },
                { question: "Formal communication follows:", options: ["Organizational hierarchy", "Any route", "Informal networks", "Personal preferences"], answer: 0 },
                { question: "Upward communication flows:", options: ["Top to bottom", "Bottom to top", "Horizontal", "Diagonal"], answer: 1 },
                { question: "Barriers to communication include:", options: ["Semantic barriers", "Personal barriers", "Organizational barriers", "All of above"], answer: 3 },
                { question: "Effective communication requires:", options: ["Clarity", "Feedback", "Active listening", "All of above"], answer: 3 }
            ]
        };

        function getUrlParam(name) {
            const match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
            return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : null;
        }

        function getCourseIdFromUrl() {
            const path = window.location.pathname;
            const filename = path.substring(path.lastIndexOf('/') + 1);
            return filename.replace('quiz-results.html', '').replace('quiz-', '').replace('.html', '');
        }

        window.onload = function() {
            const courseId = getUrlParam('course') || getCourseIdFromUrl() || 'mmpc-01';
            const courseName = document.getElementById('gradeText');
            const detailsKey = `studyhub-quiz-${courseId}-details`;
            const details = JSON.parse(localStorage.getItem(detailsKey) || '{}');

            if (!details.score) {
                const courseQuizKey = `studyhub-quiz-${courseId}`;
                const pct = parseInt(localStorage.getItem(courseQuizKey) || '0');
                const courseQs = questions[courseId] || [];
                details.score = Math.round((pct / 100) * (courseQs.length * 10));
                details.total = courseQs.length * 10;
                details.percentage = pct;
                details.grade = getGrade(pct);
            }

            const score = details.score || 0;
            const total = details.total || 100;
            const pct = details.percentage || Math.round((score / total) * 100);
            const grade = details.grade || getGrade(pct);
            const correct = Math.round(score / 10);
            const totalQ = Math.round(total / 10);

            document.getElementById('finalScore').textContent = pct + '%';
            document.getElementById('finalGrade').textContent = grade;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('totalCount').textContent = totalQ;
            document.getElementById('accuracy').textContent = pct + '%';

            const gradeTexts = {
                'A': 'Excellent Performance! Outstanding work!',
                'B': 'Good Performance! Well done!',
                'C': 'Satisfactory Performance. Room for improvement.',
                'D': 'Below Average. Review materials and retry.',
                'F': 'Failing. Strongly recommend reviewing materials.'
            };
            document.getElementById('gradeText').textContent = gradeTexts[grade] || gradeTexts.F;

            // Progress overview
            const progress = localStorage.getItem(`studyhub-progress-${courseId}`);
            const progressEl = document.getElementById('courseProgressText');
            progressEl.innerHTML = `
                Your quiz score of <strong>${pct}%</strong> has been recorded.<br>
                Course progress: <strong>${progress || 0}%</strong> complete.<br>
                <small style="color:var(--text-muted)">Note: Scores >= 80% unlock 100% progress.</small>
            `;

            // Question review
            const reviewList = document.getElementById('questionReviewList');
            const quizState = JSON.parse(localStorage.getItem(`quiz-state-${courseId}`) || '{}');
            const userAnswers = quizState.userAnswers || {};
            const courseQuestions = questions[courseId] || [];

            if (courseQuestions.length > 0) {
                courseQuestions.forEach((q, i) => {
                    const userAnswer = userAnswers[i];
                    const isCorrect = userAnswer === q.answer;
                    const item = document.createElement('div');
                    item.className = `question-review-item ${isCorrect ? 'correct' : 'incorrect'}`;
                    item.innerHTML = `
                        <div class="review-qnum">Q${i + 1}</div>
                        <div class="review-content">
                            <strong>${isCorrect ? '&#x2713; Correct' : '&#x2717; Incorrect'}</strong>
                            <div><strong>Question:</strong> ${q.question}</div>
                            ${userAnswer !== undefined ? `<div><strong>Your answer:</strong> ${q.options[userAnswer]}</div>` : ''}
                            ${!isCorrect ? `<div><strong>Correct answer:</strong> ${q.options[q.answer]}</div>` : ''}
                            ${q.explanation ? `<div class="review-explanation"><strong>Explanation:</strong> ${q.explanation}</div>` : ''}
                        </div>
                    `;
                    reviewList.appendChild(item);
                });
            } else {
                reviewList.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:2rem;">No question data available.</p>';
            }
        };

        function getGrade(pct) {
            if (pct >= 90) return 'A';
            if (pct >= 80) return 'B';
            if (pct >= 70) return 'C';
            if (pct >= 60) return 'D';
            return 'F';
        }

        function retakeQuiz() {
            const courseId = getUrlParam('course') || getCourseIdFromUrl() || 'mmpc-01';
            localStorage.removeItem(`quiz-state-${courseId}`);
            window.location.href = `quiz-${courseId}.html`;
        }

        function goToStudy() {
            const courseId = getUrlParam('course') || getCourseIdFromUrl() || 'mmpc-01';
            window.location.href = `study-${courseId}.html`;
        }

        function goToHub() {
            window.location.href = 'study-hub.html';
        }
    </script>
    <script src="enhancements.js"></script>
    <script src="revision-mode.js"></script>
    <script src="pwa-register.js"></script>
</body>
</html>
