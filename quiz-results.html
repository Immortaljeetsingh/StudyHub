<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StudyHub quiz results - see your IGNOU MBA quiz score, accuracy, and grade instantly.">
    <title>Quiz Results | StudyHub</title>
    <link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">
</head>
<body>
    <h1 class="sr-only">Quiz Results</h1>
    <div class="results-container">
        <div class="results-header">
            <div class="results-ring">
                <svg viewBox="0 0 120 120" role="img" aria-label="Score ring" class="results-ring-svg">
                    <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                    <circle class="ring-progress" id="ringProgress" cx="60" cy="60" r="52"></circle>
                </svg>
                <div class="results-score" id="finalScore">0%</div>
            </div>
            <div class="results-grade" id="finalGrade">A</div>
            <p id="gradeText">Excellent Performance</p>
        </div>

        <div class="results-stats">
            <div class="results-stat-card">
                <div class="stat-value" id="correctCount">0</div>
                <div class="stat-label">Correct Answers</div>
            </div>
            <div class="results-stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Total Questions</div>
            </div>
            <div class="results-stat-card">
                <div class="stat-value" id="accuracy">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>
        </div>

        <div style="margin: 2rem 0;">
            <h3 style="color: var(--text-primary); margin-bottom: 1rem;">&#x1F4E0; Progress Overview</h3>
            <div class="igl" id="progressOverview">
                <h4>Course Progress</h4>
                <p id="courseProgressText">Loading...</p>
            </div>
        </div>

        <div style="margin: 2rem 0;">
            <h3 style="color: var(--text-primary); margin-bottom: 1rem;">&#x1F4DD; Question Review</h3>
            <div class="question-review-list" id="questionReviewList"></div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 3rem;">
            <button id="retakeBtn" class="btn btn-primary btn-lg" onclick="retakeQuiz()">
                <span class="icon">&#x1F504;</span> Retake Quiz
            </button>
            <button id="studyBtn" class="btn btn-success btn-lg" onclick="goToStudy()">
                <span class="icon">&#x1F4E1;</span> Review Materials
            </button>
            <button class="btn btn-secondary btn-lg" onclick="goToHub()">
                <span class="icon">&#x1F3E0;</span> Return to Hub
            </button>
            <button class="btn btn-outline btn-lg" onclick="shareResult()">
                <span class="icon">&#x1F91D;</span> Share Result
            </button>
        </div>
        <p id="actionMessage" style="color:var(--accent);text-align:center;margin-top:1rem;min-height:1.2em;"></p>
    </div>

    <script>
        function getUrlParam(name) {
            const match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
            return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : null;
        }

        function safeJSON(str) {
            try { return JSON.parse(str); } catch (e) { return null; }
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        let currentCourseId = null;

        window.onload = function() {
            let courseId = getUrlParam('course');
            let details = courseId ? safeJSON(localStorage.getItem(`studyhub-quiz-${courseId}-details`)) : null;

            if (!courseId || !details || Object.keys(details).length === 0) {
                let latestTs = 0;
                for (const key of Object.keys(localStorage)) {
                    if (!key.startsWith('studyhub-quiz-') || !key.endsWith('-details')) continue;
                    const d = safeJSON(localStorage.getItem(key));
                    if (d && d.timestamp > latestTs) {
                        latestTs = d.timestamp;
                        courseId = key.slice('studyhub-quiz-'.length, -'-details'.length);
                        details = d;
                    }
                }
            }

            if (!courseId || !details || Object.keys(details).length === 0) {
                document.getElementById('finalScore').textContent = '--';
                document.getElementById('finalGrade').textContent = '--';
                document.getElementById('gradeText').textContent = 'No quiz result found. Take a quiz to see your results here.';
                document.getElementById('courseProgressText').textContent = 'No quiz data.';
                document.getElementById('questionReviewList').innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:2rem;">Question review unavailable.</p>';
                document.getElementById('actionMessage').textContent = 'Course not identified - Retake and Review Materials are unavailable.';
                document.getElementById('retakeBtn').disabled = true;
                document.getElementById('studyBtn').disabled = true;
                return;
            }
            currentCourseId = courseId;

            if (details.score === undefined) {
                const courseQuizKey = `studyhub-quiz-${courseId}`;
                const pct = parseInt(localStorage.getItem(courseQuizKey) || '0');
                const qCount = Array.isArray(details.questions) ? details.questions.length : 0;
                details.score = qCount > 0 ? Math.round((pct / 100) * (qCount * 10)) : 0;
                details.total = qCount * 10;
                details.percentage = pct;
                details.grade = getGrade(pct);
            }

            const score = details.score || 0;
            const total = details.total > 0 ? details.total : 0;
            const pct = details.percentage !== undefined ? details.percentage : (total > 0 ? Math.round((score / total) * 100) : 0);
            const grade = details.grade || getGrade(pct);
            const correct = Math.round(score / 10);
            const totalQ = Math.round(total / 10);

            document.getElementById('finalScore').textContent = pct + '%';
            document.getElementById('finalGrade').textContent = grade;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('totalCount').textContent = totalQ;
            document.getElementById('accuracy').textContent = pct + '%';

            const ring = document.getElementById('ringProgress');
            if (ring) {
                const C = 2 * Math.PI * 52;
                ring.style.strokeDasharray = C;
                ring.style.strokeDashoffset = C * (1 - pct / 100);
                ring.style.stroke = grade === 'A' || grade === 'B' ? '#22d3ee' : grade === 'C' ? '#fcd34d' : '#a78bfa';
            }

            const gradeTexts = {
                'A': 'Excellent Performance! Outstanding work!',
                'B': 'Good Performance! Well done!',
                'C': 'Satisfactory Performance. Room for improvement.',
                'D': 'Below Average. Review materials and retry.',
                'F': 'Failing. Strongly recommend reviewing materials.'
            };
            document.getElementById('gradeText').textContent = gradeTexts[grade] || gradeTexts.F;

            // Progress overview
            const progress = localStorage.getItem(`studyhub-progress-${courseId}`);
            const progressEl = document.getElementById('courseProgressText');
            progressEl.innerHTML = `
                Your quiz score of <strong>${escapeHtml(pct)}%</strong> has been recorded.<br>
                Course progress: <strong>${escapeHtml(progress || 0)}%</strong> complete.<br>
                <small style="color:var(--text-muted)">Note: Scores >= 80% unlock 100% progress.</small>
            `;

            // Question review
            const reviewList = document.getElementById('questionReviewList');
            const quizState = safeJSON(localStorage.getItem(`quiz-state-${courseId}`)) || {};
            const userAnswers = quizState.userAnswers || {};
            const storedQuestions = Array.isArray(details.questions) ? details.questions : [];

            if (storedQuestions.length > 0) {
                storedQuestions.forEach((q, i) => {
                    const userAnswer = userAnswers[i];
                    const qText = q.question || q.q;
                    const correctIdx = q.answer ?? q.correct;
                    const isCorrect = userAnswer === correctIdx;
                    const item = document.createElement('div');
                    item.className = `question-review-item ${isCorrect ? 'correct' : 'incorrect'}`;
                    item.innerHTML = `
                        <div class="review-qnum">Q${i + 1}</div>
                        <div class="review-content">
                            <strong>${isCorrect ? '&#x2713; Correct' : '&#x2717; Incorrect'}</strong>
                            <div><strong>Question:</strong> ${escapeHtml(qText)}</div>
                            ${userAnswer !== undefined ? `<div><strong>Your answer:</strong> ${escapeHtml(q.options[userAnswer])}</div>` : ''}
                            ${!isCorrect ? `<div><strong>Correct answer:</strong> ${escapeHtml(q.options[correctIdx])}</div>` : ''}
                            ${q.explanation ? `<div class="review-explanation"><strong>Explanation:</strong> ${escapeHtml(q.explanation)}</div>` : ''}
                        </div>
                    `;
                    reviewList.appendChild(item);
                });
            } else {
                reviewList.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:2rem;">Question review unavailable.</p>';
            }
        };

        function getGrade(pct) {
            if (pct >= 90) return 'A';
            if (pct >= 80) return 'B';
            if (pct >= 70) return 'C';
            if (pct >= 60) return 'D';
            return 'F';
        }

        function retakeQuiz() {
            if (!currentCourseId) return;
            localStorage.removeItem(`quiz-state-${currentCourseId}`);
            window.location.href = `quiz-${currentCourseId}.html`;
        }

        function goToStudy() {
            if (!currentCourseId) return;
            window.location.href = `study-${currentCourseId}.html`;
        }

        function goToHub() {
            window.location.href = 'study-hub.html';
        }

        function shareResult() {
            if (!currentCourseId) return;
            const pct = document.getElementById('finalScore').textContent;
            const grade = document.getElementById('finalGrade').textContent;
            const text = `I scored ${pct} (${grade}) on the ${currentCourseId.toUpperCase()} quiz on StudyHub!`;
            const msg = document.getElementById('actionMessage');
            if (navigator.share) {
                navigator.share({ title: 'StudyHub Quiz Result', text, url: window.location.href }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(text)
                    .then(() => { msg.textContent = 'Result copied to clipboard.'; })
                    .catch(() => { msg.textContent = text; });
            } else {
                msg.textContent = text;
            }
        }
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
