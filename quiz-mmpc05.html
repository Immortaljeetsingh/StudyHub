<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPC-05 Quiz: Quantitative Analysis | StudyHub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="subject-mmpc05">
    <div id="liveRegion" class="sr-only" aria-live="polite"></div>
    <script src="api-utils.js"></script>
    <script>document.write(renderApiSettingsModal());document.write(renderToolbar('mmpc-05'));</script>
    <div class="quiz-header"><h1>📓 MMPC-05: Quantitative Analysis Quiz</h1><div class="quiz-stats"><div class="quiz-stat"><div class="stat-value" id="scoreDisplay">0</div><div class="stat-label">Score</div></div><div class="quiz-stat"><div class="stat-value" id="answeredDisplay">0/50</div><div class="stat-label">Answered</div></div><div class="quiz-stat"><div class="stat-value" id="percentDisplay">0%</div><div class="stat-label">Percentage</div></div></div></div>
    <div class="quiz-controls"><button class="btn btn-primary" onclick="checkAllAnswers()">✅ Check All</button><button class="btn btn-success" onclick="saveScore()">💾 Save Score</button><button class="btn btn-outline" onclick="resetQuiz()">🔄 Reset</button></div>
    <div class="quiz-container" id="quizContainer"></div>
    <div class="study-footer"><a href="study-mmpc05.html">📓 Study Material</a> | <a href="study-hub.html">← Hub</a></div>
    <script>
    const QUIZ_ID = 'mmpc-05';
    const questions = [
        {q:"The mean of 10, 12, 14, 16, 18 is:",options:["12","14","16","15"],correct:1,explanation:"Mean = (10+12+14+16+18)/5 = 70/5 = 14."},
        {q:"The median of 3, 7, 2, 9, 5 is:",options:["5","7","3","2"],correct:0,explanation:"Sort: 2,3,5,7,9. Middle value = 5. For even count, median = average of two middle values."},
        {q:"Mode is:",options:["The average value","The middle value","The most frequently occurring value","The range of data"],correct:2,explanation:"Mode is the value that appears most often. A dataset can be unimodal, bimodal, or multimodal."},
        {q:"Standard deviation measures:",options:["Central tendency","Spread of data around the mean","The most common value","Correlation between variables"],correct:1,explanation:"SD = √(variance). Higher SD = data more spread out from the mean."},
        {q:"Coefficient of Variation (CV) is useful for:",options:["Measuring central tendency","Comparing variability of datasets with different units/means","Finding the mode","Calculating probability"],correct:1,explanation:"CV = (SD/Mean) × 100. It standardizes variability — enabling comparison across different scales."},
        {q:"Probability ranges from:",options:["0 to 100","−1 to +1","0 to 1","1 to 10"],correct:2,explanation:"P = 0 (impossible event) to P = 1 (certain event). Sum of all probabilities = 1."},
        {q:"P(A or B) for mutually exclusive events equals:",options:["P(A) × P(B)","P(A) + P(B)","P(A) − P(B)","P(A|B) × P(B)"],correct:1,explanation:"For mutually exclusive (can't occur together): P(A∪B) = P(A) + P(B). No need to subtract overlap."},
        {q:"P(A and B) for independent events equals:",options:["P(A) + P(B)","P(A) × P(B)","P(A) − P(B)","P(A) ÷ P(B)"],correct:1,explanation:"If A and B are independent (one doesn't affect the other): P(A∩B) = P(A) × P(B)."},
        {q:"Bayes' Theorem is used to:",options:["Calculate mean","Update probability based on new evidence","Measure standard deviation","Find correlation"],correct:1,explanation:"Bayes' Theorem: P(A|B) = P(B|A)×P(A)/P(B). It revises prior probabilities using new data."},
        {q:"The Normal Distribution is also called:",options:["Uniform distribution","Bell curve","Exponential curve","Skewed distribution"],correct:1,explanation:"The normal distribution forms a symmetric bell-shaped curve — most data clusters around the mean."},
        {q:"In a normal distribution, approximately 68% of data falls within:",options:["±1 standard deviation","±2 standard deviations","±3 standard deviations","The mean only"],correct:0,explanation:"68-95-99.7 rule: 68% within ±1σ, 95% within ±2σ, 99.7% within ±3σ of the mean."},
        {q:"95% of data in a normal distribution falls within:",options:["±1 SD","±2 SD","±3 SD","±0.5 SD"],correct:1,explanation:"About 95% of values lie within 2 standard deviations of the mean in a normal distribution."},
        {q:"Binomial distribution is used when:",options:["Data is continuous","There are exactly two outcomes (success/failure) per trial","Events are uncountable","Distribution is skewed left"],correct:1,explanation:"Binomial: fixed number of trials, each with two outcomes, constant probability, independent trials."},
        {q:"Poisson distribution models:",options:["Normal events","Rare events occurring in a fixed interval of time/space","Continuous data only","Binary outcomes"],correct:1,explanation:"Poisson distribution counts rare events (arrivals per hour, defects per batch, accidents per week)."},
        {q:"The null hypothesis (H₀) typically states:",options:["There is a significant effect","No significant difference or effect exists","The alternative is true","Data is normally distributed"],correct:1,explanation:"H₀ is the 'status quo' hypothesis — no effect, no difference. We test whether evidence is strong enough to reject it."},
        {q:"Type I error occurs when:",options:["We fail to reject a false H₀","We reject a true H₀ (false alarm)","We accept the correct H₀","No error occurs"],correct:1,explanation:"Type I error (α): concluding there IS an effect when there isn't one — like a false positive medical test."},
        {q:"Type II error occurs when:",options:["We reject a true H₀","We fail to reject a false H₀ (missed finding)","We correctly reject H₀","Both H₀ and H₁ are rejected"],correct:1,explanation:"Type II error (β): failing to detect a real effect — like a false negative. Power = 1 - β."},
        {q:"If p-value < 0.05, we:",options:["Accept H₀","Reject H₀ (result is statistically significant)","Need more data","Cannot make a decision"],correct:1,explanation:"p-value < significance level (α=0.05) means the result is unlikely under H₀ — strong enough to reject it."},
        {q:"A t-test is used instead of z-test when:",options:["Sample size is large (n > 30)","Sample size is small and population SD is unknown","Population is not normal","Data is categorical"],correct:1,explanation:"t-test is used for small samples (n < 30) when population standard deviation is unknown."},
        {q:"Chi-square test is used for:",options:["Comparing means","Testing association between categorical variables","Regression analysis","Time series analysis"],correct:1,explanation:"Chi-square tests whether two categorical variables are independent or associated (e.g., gender vs product preference)."},
        {q:"Correlation coefficient (r) ranges from:",options:["0 to 1","−1 to +1","0 to 100","−∞ to +∞"],correct:1,explanation:"r = −1 (perfect negative) to +1 (perfect positive). r = 0 means no linear relationship."},
        {q:"r = 0.92 indicates:",options:["Weak positive correlation","No correlation","Strong positive correlation","Strong negative correlation"],correct:2,explanation:"Values close to +1 indicate strong positive correlation — as one variable increases, the other also increases strongly."},
        {q:"Correlation does NOT imply:",options:["Association","Relationship","Causation","Pattern"],correct:2,explanation:"Two variables can be correlated without one causing the other. Ice cream sales and drownings correlate (both rise in summer)."},
        {q:"In simple linear regression Y = a + bX, 'b' represents:",options:["Y-intercept","Slope (change in Y per unit change in X)","Correlation coefficient","Error term"],correct:1,explanation:"b (slope) tells how much Y changes for each one-unit increase in X. a is the Y-intercept."},
        {q:"R² = 0.85 means:",options:["85% of variation in Y is explained by X","15% of variation in Y is explained by X","Correlation is 0.85","The model has 85 variables"],correct:0,explanation:"R² (coefficient of determination) = 0.85 means the independent variable explains 85% of the dependent variable's variation."},
        {q:"Linear Programming is used to:",options:["Calculate probability","Find optimal resource allocation under constraints","Measure correlation","Test hypotheses"],correct:1,explanation:"LP maximizes/minimizes an objective function (profit/cost) subject to constraints (resources)."},
        {q:"In LP, the objective function represents:",options:["Constraints on resources","What you want to maximize or minimize","Non-negativity conditions","The feasible region"],correct:1,explanation:"Objective function: e.g., Maximize Profit = 5X + 8Y — the goal of the optimization."},
        {q:"Constraints in LP represent:",options:["The goal to achieve","Limitations on available resources","Unlimited possibilities","Negative values"],correct:1,explanation:"Constraints express resource limitations (labor ≤ 100 hours, material ≤ 200 kg)."},
        {q:"The feasible region in LP is:",options:["Area where constraints are violated","Set of all points satisfying all constraints simultaneously","Always infinite","Outside the constraint lines"],correct:1,explanation:"The feasible region is where all constraints overlap — the optimal solution lies at a corner point of this region."},
        {q:"Moving average is a:",options:["Qualitative forecasting method","Quantitative time-series smoothing technique","Hypothesis test","Correlation measure"],correct:1,explanation:"Moving average smooths time-series data by averaging consecutive data points — removes short-term fluctuations."},
        {q:"Exponential smoothing gives more weight to:",options:["Older observations","Recent observations","The median","All observations equally"],correct:1,explanation:"Exponential smoothing weights recent data more heavily using a smoothing constant (α). Higher α = more weight on recent data."},
        {q:"The Delphi method is a:",options:["Quantitative technique","Qualitative forecasting using expert opinions iteratively","Statistical test","Sampling method"],correct:1,explanation:"Delphi gathers expert opinions through multiple anonymous rounds until consensus is reached — good for long-range forecasting."},
        {q:"A scatter plot shows:",options:["Time series data","Relationship between two variables visually","Frequency distribution","Organizational hierarchy"],correct:1,explanation:"Scatter plots display data points on X-Y axes — visual inspection of correlation pattern (linear, curvilinear, no pattern)."},
        {q:"Variance is:",options:["Square root of standard deviation","Average of squared deviations from the mean","The range of data","The most frequent value"],correct:1,explanation:"Variance = Σ(xi - mean)² / n. Standard Deviation = √Variance — same unit as original data."},
        {q:"Range is calculated as:",options:["Mean − Mode","Maximum value − Minimum value","Standard deviation × 2","Q3 − Q1"],correct:1,explanation:"Range = Max − Min. Simple but sensitive to outliers. IQR (Q3-Q1) is more robust."},
        {q:"A confidence interval of 95% means:",options:["We are 95% sure the parameter is in this interval","95% of samples will contain the true parameter in their intervals","The probability of error is 95%","The sample size is 95"],correct:1,explanation:"95% CI: if we repeated the sampling 100 times, about 95 of those intervals would contain the true population parameter."},
        {q:"Sampling error is:",options:["A mistake in data collection","The natural difference between sample statistic and population parameter","A systematic bias","Always zero"],correct:1,explanation:"Sampling error is natural variation — the sample mean may differ from population mean by chance. Increases with smaller samples."},
        {q:"Stratified sampling divides the population into:",options:["Random groups","Homogeneous subgroups (strata) then samples from each","Equal-sized clusters","Sequential groups"],correct:1,explanation:"Stratified sampling ensures representation from all subgroups — e.g., sampling from each department proportionally."},
        {q:"F-test is primarily used to:",options:["Compare two means","Compare two or more variances / ANOVA","Test independence","Calculate correlation"],correct:1,explanation:"F-test compares variances and is the basis of ANOVA (Analysis of Variance) — testing if means of 3+ groups differ."},
        {q:"ANOVA is used to test:",options:["Correlation between two variables","Whether means of three or more groups are significantly different","Independence of categorical variables","Regression coefficients"],correct:1,explanation:"ANOVA (Analysis of Variance) compares means across multiple groups simultaneously — avoiding multiple t-tests."},
        {q:"In decision theory, 'maximax' strategy is:",options:["Conservative — minimize maximum loss","Optimistic — maximize maximum payoff","Pessimistic — expect the worst","Based on equal probability"],correct:1,explanation:"Maximax: choose the alternative with the highest possible payoff — an optimistic decision-maker's approach."},
        {q:"'Minimax regret' in decision-making minimizes:",options:["Maximum profit","Maximum opportunity loss (regret)","Total costs","Average returns"],correct:1,explanation:"Minimax regret: minimize the maximum potential regret — regret = best possible outcome minus actual outcome."},
        {q:"Expected Monetary Value (EMV) is:",options:["The guaranteed profit","Weighted average of outcomes using their probabilities","The maximum possible value","Minimum profit guaranteed"],correct:1,explanation:"EMV = Σ(probability × payoff) for each outcome. Used for rational decision-making under risk."},
        {q:"A decision tree helps in:",options:["Planting trees","Visualizing sequential decisions and their outcomes under uncertainty","Filing documents","Employee evaluation"],correct:1,explanation:"Decision trees map out decision points, chance events, probabilities, and payoffs — visual decision-making tool."},
        {q:"Time series components include:",options:["Mean, median, mode","Trend, Seasonal, Cyclical, Irregular variations","Only random fluctuations","Only seasonal patterns"],correct:1,explanation:"Time series = Trend (long-term direction) + Seasonal (regular patterns) + Cyclical (business cycles) + Irregular (random)."},
        {q:"Index number measures:",options:["Absolute value of a variable","Relative change in a variable compared to a base period","Standard deviation","Correlation"],correct:1,explanation:"Index numbers express change relative to a base period (=100). E.g., CPI 130 means 30% increase from base year."},
        {q:"Regression analysis is used to:",options:["Classify data","Predict the value of a dependent variable based on independent variable(s)","Count frequency","Test independence"],correct:1,explanation:"Regression establishes a mathematical relationship between variables for prediction — Y = a + bX."},
        {q:"Non-parametric tests are used when:",options:["Data is normally distributed","Data doesn't meet normality assumptions or is ordinal/nominal","Sample size is very large","Population SD is known"],correct:1,explanation:"Non-parametric tests (Mann-Whitney, Kruskal-Wallis) don't assume normal distribution — used for ordinal or non-normal data."},
        {q:"Simulation in quantitative analysis:",options:["Replaces all statistical methods","Models real-world processes using random variables to analyze behavior","Is only theoretical","Requires no computers"],correct:1,explanation:"Monte Carlo simulation and similar techniques model complex systems using random inputs to understand outcome distributions."},
        {q:"The Central Limit Theorem states that:",options:["All data is normally distributed","Sample means approach a normal distribution as sample size increases, regardless of population shape","Mean equals median always","Variance is always 1"],correct:1,explanation:"CLT: as n→∞, the distribution of sample means becomes normal — enabling use of z-tests even for non-normal populations."}
    ];

    let userAnswers=new Array(questions.length).fill(-1);
    function renderQuiz(){const c=document.getElementById('quizContainer');c.innerHTML=questions.map((q,i)=>`<div class="question-card" id="qcard-${i}"><div class="q-number">Question ${i+1} of ${questions.length}</div><div class="q-text">${q.q}</div><div class="q-options">${q.options.map((opt,j)=>`<div class="q-option" onclick="selectAnswer(${i},${j})" id="q${i}-opt${j}"><span class="q-option-letter">${'ABCD'[j]}</span><span>${opt}</span></div>`).join('')}</div><div class="q-explanation" id="q${i}-exp">💡 ${q.explanation}</div></div>`).join('');}
    function selectAnswer(qi,oi){if(document.getElementById(`qcard-${qi}`).classList.contains('correct')||document.getElementById(`qcard-${qi}`).classList.contains('incorrect'))return;userAnswers[qi]=oi;questions[qi].options.forEach((_,j)=>{document.getElementById(`q${qi}-opt${j}`).classList.toggle('selected',j===oi);});updateStats();}
    function checkAllAnswers(){questions.forEach((q,i)=>{const card=document.getElementById(`qcard-${i}`);if(userAnswers[i]===-1)return;card.classList.add(userAnswers[i]===q.correct?'correct':'incorrect');document.getElementById(`q${i}-opt${q.correct}`).classList.add('correct-answer');if(userAnswers[i]!==q.correct&&userAnswers[i]>=0)document.getElementById(`q${i}-opt${userAnswers[i]}`).classList.add('wrong-answer');document.getElementById(`q${i}-exp`).classList.add('visible');});updateStats();}
    function updateStats(){const answered=userAnswers.filter(a=>a>=0).length;const correct=userAnswers.filter((a,i)=>a===questions[i].correct).length;const pct=answered>0?Math.round((correct/questions.length)*100):0;document.getElementById('scoreDisplay').textContent=correct;document.getElementById('answeredDisplay').textContent=`${answered}/${questions.length}`;document.getElementById('percentDisplay').textContent=pct+'%';}
    function saveScore(){const answered=userAnswers.filter(a=>a>=0).length;if(answered<questions.length&&!confirm(`Answered ${answered}/${questions.length}. Save?`))return;checkAllAnswers();const correct=userAnswers.filter((a,i)=>a===questions[i].correct).length;const pct=Math.round((correct/questions.length)*100);localStorage.setItem(`studyhub-quiz-${QUIZ_ID}`,pct);if(pct>=80)localStorage.setItem(`studyhub-progress-${QUIZ_ID}`,100);showToast(`Score: ${pct}%`,pct>=80?'success':'info');setTimeout(()=>{window.location.href='study-hub.html';},2000);}
    function resetQuiz(){userAnswers=new Array(questions.length).fill(-1);renderQuiz();updateStats();}
    renderQuiz();
    </script>
</body>
</html>
