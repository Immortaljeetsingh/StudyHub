<body class="subject-mmpc06">

    <script>document.write(renderApiSettingsModal());document.write(renderToolbar('mmpc-06'));</script>
    <div class="quiz-header"><h1>&#x1F497; MMPC-06: Marketing Management Quiz</h1><div class="quiz-stats"><div class="quiz-stat"><div class="stat-value" id="scoreDisplay">0</div><div class="stat-label">Score</div></div><div class="quiz-stat"><div class="stat-value" id="answeredDisplay">0/50</div><div class="stat-label">Answered</div></div><div class="quiz-stat"><div class="stat-value" id="percentDisplay">0%</div><div class="stat-label">Percentage</div></div></div></div>
    <div class="quiz-controls"><button class="btn btn-primary" onclick="checkAllAnswers()">&#x2705; Check All</button><button class="btn btn-success" onclick="saveScore()">&#x1F4BE; Save Score</button><button class="btn btn-outline" onclick="resetQuiz()">&#x1F504; Reset</button></div>
    <div class="quiz-container" id="quizContainer"></div>
    <div class="study-footer"><a href="study-mmpc06.html">&#x1F497; Study Material</a> | <a href="study-hub.html">&#x2190; Hub</a></div>
    <script>
    const QUIZ_ID = 'mmpc-06';
    const questions = [
        {q:"Marketing is defined as creating, communicating, and delivering value by:",options:["Adam Smith","Philip Kotler","Peter Drucker","Henry Fayol"],correct:1,explanation:"Philip Kotler is widely regarded as the 'Father of Modern Marketing.'"},
        {q:"The marketing concept focuses on:",options:["Production efficiency","Aggressive selling","Identifying and satisfying customer needs","Product features only"],correct:2,explanation:"Marketing concept: 'Make what you can sell' vs Selling concept: 'Sell what you make.'"},
        {q:"STP stands for:",options:["Sales, Trading, Promotion","Segmentation, Targeting, Positioning","Strategy, Tactics, Planning","Supply, Transport, Packaging"],correct:1,explanation:"STP is the strategic marketing framework &#x2014; segment the market, target segments, position your offering."},
        {q:"The 4Ps of marketing mix are:",options:["Product, Price, Place, Promotion","Planning, People, Process, Performance","Profit, Production, Price, Placement","Product, People, Pricing, Packaging"],correct:0,explanation:"McCarthy's 4Ps: Product (what), Price (how much), Place (where), Promotion (how to communicate)."},
        {q:"Demographic segmentation divides markets by:",options:["Geographic region","Age, gender, income, education","Lifestyle and values","Purchase behavior"],correct:1,explanation:"Demographic variables are the most commonly used segmentation criteria &#x2014; measurable and accessible."},
        {q:"Psychographic segmentation divides markets by:",options:["Age and gender","Income and education","Lifestyle, values, personality","City size"],correct:2,explanation:"Psychographics go beyond demographics &#x2014; capturing lifestyle, attitudes, interests, and opinions (AIO)."},
        {q:"Penetration pricing strategy involves:",options:["High initial price","Low price to gain market share quickly","Premium pricing","Dynamic pricing"],correct:1,explanation:"Penetration pricing captures market share fast with low prices &#x2014; Jio's free data launch is a classic example."},
        {q:"Price skimming involves:",options:["Low initial price, increasing later","High initial price, lowering over time","Fixed price always","Cost-plus pricing"],correct:1,explanation:"Skimming targets early adopters willing to pay premium, then lowers price to capture broader market (Apple iPhone strategy)."},
        {q:"The Product Life Cycle stages are:",options:["Birth, Growth, Death","Introduction, Growth, Maturity, Decline","Launch, Peak, Exit","Planning, Execution, Review"],correct:1,explanation:"PLC: Introduction (high costs) &#x2192; Growth (rising sales) &#x2192; Maturity (peak sales, competition) &#x2192; Decline (falling demand)."},
        {q:"In which PLC stage are sales highest?",options:["Introduction","Growth","Maturity","Decline"],correct:2,explanation:"Sales peak during Maturity &#x2014; but growth rate slows, competition intensifies, and prices come under pressure."},
        {q:"Brand equity consists of:",options:["Only brand name","Awareness, associations, perceived quality, loyalty","Only sales revenue","Logo and colors"],correct:1,explanation:"Aaker's model: Brand Awareness + Brand Associations + Perceived Quality + Brand Loyalty = Brand Equity."},
        {q:"Consumer behavior is influenced most fundamentally by:",options:["Personal factors","Psychological factors","Social factors","Cultural factors"],correct:3,explanation:"Culture is the most fundamental influence on consumer behavior &#x2014; it shapes wants, perceptions, and values."},
        {q:"The consumer decision-making process starts with:",options:["Information search","Need recognition","Evaluation of alternatives","Purchase decision"],correct:1,explanation:"Need recognition triggers the buying process &#x2014; when the consumer becomes aware of a gap between actual and desired state."},
        {q:"Post-purchase dissonance is:",options:["Satisfaction after purchase","Doubt or anxiety after making a purchase decision","Pre-purchase research","Brand loyalty"],correct:1,explanation:"Cognitive dissonance: buyer's remorse or uncertainty about whether they made the right choice."},
        {q:"BCG Matrix classifies products as:",options:["Big, Common, Good","Stars, Cash Cows, Question Marks, Dogs","Red, Yellow, Green","High, Medium, Low"],correct:1,explanation:"BCG Matrix: Stars (high growth, high share), Cash Cows (low growth, high share), Question Marks (high growth, low share), Dogs (low, low)."},
        {q:"A Cash Cow in BCG Matrix has:",options:["High market growth, high market share","Low market growth, high market share","High growth, low share","Low growth, low share"],correct:1,explanation:"Cash Cows generate steady profits with minimal investment &#x2014; they fund Stars and Question Marks."},
        {q:"Positioning means:",options:["Physical placement of products in stores","Creating a distinct image in the consumer's mind relative to competitors","Setting prices competitively","Advertising placement"],correct:1,explanation:"Positioning = how you want consumers to perceive your brand vs competition (Volvo = safety, BMW = driving pleasure)."},
        {q:"Market research primarily helps in:",options:["Product manufacturing","Understanding consumer needs, preferences, and market trends","Hiring employees","Setting accounting standards"],correct:1,explanation:"Market research provides data-driven insights for marketing decisions &#x2014; reducing risk and uncertainty."},
        {q:"AIDA model stands for:",options:["Analysis, Integration, Development, Action","Attention, Interest, Desire, Action","Awareness, Information, Decision, Acceptance","Advertising, Investment, Distribution, Assessment"],correct:1,explanation:"AIDA describes the stages a consumer goes through: Attention &#x2192; Interest &#x2192; Desire &#x2192; Action (purchase)."},
        {q:"Direct marketing includes:",options:["TV advertisements only","Email, SMS, direct mail, telemarketing &#x2014; direct to consumer","Retail store displays","Wholesale distribution"],correct:1,explanation:"Direct marketing communicates directly with targeted consumers &#x2014; email campaigns, catalogs, direct mail, telemarketing."},
        {q:"A unique selling proposition (USP) is:",options:["The lowest price","A distinctive benefit that differentiates the product from competitors","Company's total revenue","Any product feature"],correct:1,explanation:"USP is the one key benefit that makes your product unique and gives consumers a reason to choose you over competition."},
        {q:"Push strategy in promotion means:",options:["Advertising directly to consumers","Pushing products through distribution channels (trade promotions, incentives)","Pulling consumers to stores","Digital marketing only"],correct:1,explanation:"Push: manufacturer promotes to wholesaler &#x2192; retailer &#x2192; consumer. Pull: manufacturer creates consumer demand through advertising."},
        {q:"Pull strategy in promotion means:",options:["Pushing products through middlemen","Creating consumer demand that pulls products through the channel","Reducing prices","Limiting distribution"],correct:1,explanation:"Pull strategy builds consumer demand through advertising/social media &#x2014; consumers demand the product from retailers."},
        {q:"Market segmentation helps companies:",options:["Ignore customer differences","Target specific groups with tailored offerings","Sell the same product to everyone","Reduce product variety"],correct:1,explanation:"Segmentation enables focused targeting &#x2014; different customers have different needs, and one size doesn't fit all."},
        {q:"Niche marketing targets:",options:["The entire market","A small, well-defined segment with specialized needs","Only premium customers","Only low-income segments"],correct:1,explanation:"Niche marketing focuses on a narrow, specific segment &#x2014; deep expertise and customization (e.g., Ferrari for ultra-luxury)."},
        {q:"Maslow's hierarchy is relevant to marketing because:",options:["It's a pricing model","It helps understand consumer motivation at different need levels","It measures market size","It predicts sales"],correct:1,explanation:"Maslow helps marketers understand what drives consumer behavior &#x2014; a hungry person responds to food ads, not luxury watch ads."},
        {q:"Selective distribution uses:",options:["All available outlets","A limited number of carefully chosen outlets","Only one exclusive outlet","No physical outlets"],correct:1,explanation:"Selective distribution: choose specific retailers that match the brand image (e.g., premium clothing in select department stores)."},
        {q:"Intensive distribution aims to:",options:["Sell through one exclusive dealer","Place products in as many outlets as possible","Sell only online","Use only direct channels"],correct:1,explanation:"Intensive distribution: maximum coverage &#x2014; FMCG products (Coca-Cola, Parle-G) available everywhere."},
        {q:"Exclusive distribution means:",options:["Selling through all possible channels","Granting exclusive rights to one distributor in a territory","Free distribution of samples","Online-only sales"],correct:1,explanation:"Exclusive distribution: one dealer per territory &#x2014; used for luxury/prestige brands (Rolex, Louis Vuitton)."},
        {q:"Personal selling is most effective for:",options:["FMCG products","Complex, high-value products requiring explanation","Mass market items","Digital products"],correct:1,explanation:"Personal selling works best for complex products (insurance, industrial machinery) requiring customized presentations."},
        {q:"Sales promotion includes:",options:["Only advertising","Coupons, discounts, contests, free samples, BOGO offers","Only personal selling","Only PR activities"],correct:1,explanation:"Sales promotion = short-term incentives to boost immediate sales &#x2014; coupons, discounts, free trials, contests."},
        {q:"Public Relations (PR) aims to:",options:["Generate immediate sales","Build positive image and manage organization's reputation","Set product prices","Manage distribution"],correct:1,explanation:"PR builds long-term favorable image through press releases, events, CSR activities, and media relations."},
        {q:"Marketing myopia (Theodore Levitt) warns against:",options:["Overpricing products","Defining business too narrowly by product rather than customer need","Excessive advertising","Too much market research"],correct:1,explanation:"Levitt: railroads declined because they defined themselves as 'railroad business' not 'transportation business.'"},
        {q:"CRM stands for:",options:["Cost Reduction Management","Customer Relationship Management","Corporate Revenue Model","Competitive Resource Mapping"],correct:1,explanation:"CRM systems manage customer interactions, data, and relationships &#x2014; improving retention and lifetime value."},
        {q:"Customer lifetime value (CLV) measures:",options:["One-time purchase value","Total revenue a customer generates over their entire relationship","Daily sales","Market share"],correct:1,explanation:"CLV helps prioritize customer segments &#x2014; a customer buying &#x20B9;500/month for 10 years has CLV of &#x20B9;60,000."},
        {q:"Content marketing involves:",options:["Paid advertisements only","Creating valuable, relevant content to attract and engage target audience","Cold calling customers","Setting up retail stores"],correct:1,explanation:"Content marketing (blogs, videos, infographics) builds trust and authority &#x2014; attracting customers through value, not interruption."},
        {q:"SEO stands for:",options:["Sales Enhancement Operations","Search Engine Optimization","Social Engagement Outreach","Strategic Enterprise Organization"],correct:1,explanation:"SEO improves website visibility in organic (unpaid) search engine results &#x2014; crucial for digital presence."},
        {q:"Which pricing strategy bases price on customer perception of value?",options:["Cost-plus pricing","Competitive pricing","Value-based pricing","Penetration pricing"],correct:2,explanation:"Value-based pricing: charge based on what customers believe the product is worth &#x2014; regardless of actual production cost."},
        {q:"Test marketing involves:",options:["Testing products in a limited market before full launch","Testing marketing team","Testing competitors' products","Internal product testing only"],correct:0,explanation:"Test marketing launches a product in select markets to gauge consumer response before a nationwide rollout."},
        {q:"Green marketing promotes:",options:["Products in green packaging only","Environmentally friendly products and sustainable practices","Products sold in parks","Agricultural products"],correct:1,explanation:"Green marketing appeals to environmentally conscious consumers &#x2014; eco-friendly products, sustainable packaging, carbon-neutral operations."},
        {q:"A franchise model is an example of which entry mode?",options:["Direct exporting","Licensing","Franchising","Wholly-owned subsidiary"],correct:2,explanation:"Franchising: franchisor grants rights to use brand, systems, and processes in exchange for fees &#x2014; McDonald's model."},
        {q:"What does FMCG stand for?",options:["Financial Market Goods Commission","Fast Moving Consumer Goods","First Market Growth Category","Federal Manufacturing Goods Company"],correct:1,explanation:"FMCG: everyday products sold quickly at low prices &#x2014; soap, toothpaste, packaged food (high volume, low margin)."},
        {q:"An oligopoly market has:",options:["One seller","Two sellers","A few dominant sellers","Many sellers"],correct:2,explanation:"Oligopoly: few large firms dominate &#x2014; telecom (Jio, Airtel, Vi), automobiles. Actions of one firm affect others."},
        {q:"Ansoff's Growth Matrix includes which strategy?",options:["Market penetration, development, product development, diversification","Only market penetration","Only product development","Only diversification"],correct:0,explanation:"Ansoff's 4 strategies: Penetration (existing product, existing market), Market Development (existing product, new market), Product Development (new product, existing market), Diversification (new product, new market)."},
        {q:"Social media marketing advantages include:",options:["High cost, low reach","Low cost, precise targeting, real-time engagement","No measurable results","Limited audience"],correct:1,explanation:"Social media offers targeted reach, two-way engagement, cost efficiency, and detailed analytics &#x2014; revolutionizing marketing."},
        {q:"Service marketing adds 3 extra Ps, making it 7Ps. The additional Ps are:",options:["Profit, Production, Packaging","People, Process, Physical Evidence","Performance, Productivity, Planning","Power, Position, Prestige"],correct:1,explanation:"Services need: People (staff), Process (service delivery), Physical Evidence (tangible cues) &#x2014; beyond the original 4Ps."},
        {q:"Market leader strategy includes:",options:["Ignoring competition","Expanding total market, defending market share, expanding share","Copying competitors","Reducing product range"],correct:1,explanation:"Market leaders grow the total market pie, protect their share through innovation, and try to increase share."},
        {q:"Guerrilla marketing uses:",options:["Large budgets and traditional media","Unconventional, low-cost, creative tactics for maximum impact","Only TV advertising","Only print media"],correct:1,explanation:"Guerrilla marketing creates buzz through surprise, creativity, and unconventional tactics &#x2014; effective for small budgets."},
        {q:"Which segmentation basis uses purchase frequency and brand loyalty?",options:["Geographic","Demographic","Psychographic","Behavioral"],correct:3,explanation:"Behavioral segmentation: based on usage rate, loyalty status, benefits sought, readiness stage, and occasions."},
        {q:"Influencer marketing leverages:",options:["Celebrity endorsements only","Social media personalities with engaged followers to promote products","Government influencers","Employee ambassadors only"],correct:1,explanation:"Influencer marketing partners with content creators who have dedicated audiences &#x2014; authenticity drives engagement."}
    ];

    let userAnswers=new Array(questions.length).fill(-1);
    function renderQuiz(){const c=document.getElementById('quizContainer');c.innerHTML=questions.map((q,i)=>`<div class="question-card" id="qcard-${i}"><div class="q-number">Question ${i+1} of ${questions.length}</div><div class="q-text">${q.q}</div><div class="q-options">${q.options.map((opt,j)=>`<div class="q-option" onclick="selectAnswer(${i},${j})" id="q${i}-opt${j}"><span class="q-option-letter">${'ABCD'[j]}</span><span>${opt}</span></div>`).join('')}</div><div class="q-explanation" id="q${i}-exp">&#x1F4A1; ${q.explanation}</div></div>`).join('');}
    function selectAnswer(qi,oi){if(document.getElementById(`qcard-${qi}`).classList.contains('correct')||document.getElementById(`qcard-${qi}`).classList.contains('incorrect'))return;userAnswers[qi]=oi;questions[qi].options.forEach((_,j)=>{document.getElementById(`q${qi}-opt${j}`).classList.toggle('selected',j===oi);});updateStats();}
    function checkAllAnswers(){questions.forEach((q,i)=>{const card=document.getElementById(`qcard-${i}`);if(userAnswers[i]===-1)return;card.classList.add(userAnswers[i]===q.correct?'correct':'incorrect');document.getElementById(`q${i}-opt${q.correct}`).classList.add('correct-answer');if(userAnswers[i]!==q.correct&&userAnswers[i]>=0)document.getElementById(`q${i}-opt${userAnswers[i]}`).classList.add('wrong-answer');document.getElementById(`q${i}-exp`).classList.add('visible');});updateStats();}
    function updateStats(){const answered=userAnswers.filter(a=>a>=0).length;const correct=userAnswers.filter((a,i)=>a===questions[i].correct).length;const pct=answered>0?Math.round((correct/questions.length)*100):0;document.getElementById('scoreDisplay').textContent=correct;document.getElementById('answeredDisplay').textContent=`${answered}/${questions.length}`;document.getElementById('percentDisplay').textContent=pct+'%';}
    function saveScore(){const answered=userAnswers.filter(a=>a>=0).length;if(answered<questions.length&&!confirm(`Answered ${answered}/${questions.length}. Save?`))return;checkAllAnswers();const correct=userAnswers.filter((a,i)=>a===questions[i].correct).length;const pct=Math.round((correct/questions.length)*100);localStorage.setItem(`studyhub-quiz-${QUIZ_ID}`,pct);if(pct>=80)localStorage.setItem(`studyhub-progress-${QUIZ_ID}`,100);showToast(`Score: ${pct}%`,pct>=80?'success':'info');setTimeout(()=>{window.location.href='study-hub.html';},2000);}
    function resetQuiz(){userAnswers=new Array(questions.length).fill(-1);renderQuiz();updateStats();}
    renderQuiz();
    </script>
