<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPC-16 International Business - Quiz | StudyHub</title>
    <link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="quiz-header" style="padding-top: 3.5rem;">
        <h1>&#x1F4E0; MMPC-16 International Business Quiz</h1>
        <p>Test your knowledge of International Business</p>
        <div class="quiz-stats">
            <div class="quiz-stat">
                <div class="stat-value" id="currentQ">1</div>
                <div class="stat-label">Current</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="scoreVal">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="timeVal">20:00</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>
        <div class="quiz-progress-container">
            <div class="quiz-progress-bar" id="progressBar"></div>
        </div>
        <div class="quiz-progress-text" id="progressText">Question 1 of 10</div>
    </header>

    <div class="quiz-controls" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="quizEngine.reviewMode()" id="reviewBtn">
            <span class="icon">&#x1F4CB;</span> Review Answers
        </button>
        <div class="review-panel" id="reviewPanel">
            <h3><span class="icon">&#x1F4CD;</span> Jump to Question</h3>
            <div class="question-nav-grid" id="navGrid"></div>
        </div>
        <button class="btn btn-outline" onclick="quizEngine.toggleTimer()" id="timerBtn">
            <span class="icon">&#x23F1;</span> Toggle Timer
        </button>
    </div>

    <main style="max-width: 800px; margin: 0 auto; padding: 0 1.5rem;">
        <div class="question-nav" id="questionNav">
            <h3><span class="icon">&#x1F50D;</span> Question Navigation</h3>
            <div class="question-nav-grid" id="questionNavGrid"></div>
        </div>

        <div class="question-card current-question" id="questionCard">
            <h3 id="questionTitle">Question Title</h3>
            <div id="questionContent"></div>
        </div>

        <div id="answerOptions"></div>
        <div id="explanationArea" style="margin-top: 1rem;"></div>

        <div class="quiz-controls" style="justify-content: space-between; margin-top: 2rem;">
            <button class="btn btn-outline" onclick="quizEngine.prev()" id="prevBtn">
                <span class="icon">&#x2190;</span> Previous
            </button>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
                <button class="btn btn-secondary" onclick="quizEngine.randomize()" id="randomBtn">
                    <span class="icon">&#x1F500;</span> Randomize
                </button>
                <button class="btn btn-secondary" onclick="quizEngine.markReview()" id="markBtn">
                    <span class="icon">&#x1F516;</span> Mark for Review
                </button>
            </div>
            <button class="btn btn-primary" onclick="quizEngine.next()" id="nextBtn">
                Next <span class="icon">&#x2192;</span>
            </button>
        </div>
    </main>

    <div class="quiz-timer" id="quizTimer">
        <span class="icon">&#x23F1;</span> <span id="timerDisplay">20:00</span>
    </div>

    <script src="quiz-engine.js"></script>
    <script>
        const questions = [
            {
                question: "Which of the following is NOT one of the four 'seeking' motives that drive firms to go international?",
                options: [
                    "Market seeking",
                    "Resource seeking",
                    "Efficiency seeking",
                    "Monopoly seeking"
                ],
                answer: 3,
                explanation: "The four motives are Market, Resource, Efficiency, and Strategic Asset seeking. Firms seek new customers, raw materials, lower costs, and brands or technology."
            },
            {
                question: "The three waves of globalization occurred in the periods:",
                options: [
                    "1870-1914, 1945-1980, 1980-present",
                    "1900-1930, 1940-1970, 1970-present",
                    "1500-1700, 1800-1900, 1950-present",
                    "1914-1945, 1960-1990, 1990-present"
                ],
                answer: 0,
                explanation: "The three waves are 1870-1914 (trade expansion and colonialism), 1945-1980 (Bretton Woods and GATT), and 1980-present (technology revolution and emerging markets)."
            },
            {
                question: "In Hofstede's cultural dimensions, Japan scores highest (95) on which dimension?",
                options: [
                    "Power Distance",
                    "Individualism",
                    "Masculinity",
                    "Uncertainty Avoidance"
                ],
                answer: 2,
                explanation: "Japan scores 95 on Masculinity, reflecting a competitive, achievement-driven work culture. India scores 77 on Power Distance and Japan scores 92 on Uncertainty Avoidance."
            },
            {
                question: "According to Ricardo's comparative advantage theory, a country should specialize in goods where it has:",
                options: [
                    "The lowest absolute cost",
                    "The lowest opportunity cost",
                    "The largest domestic market",
                    "The highest tariff protection"
                ],
                answer: 1,
                explanation: "Comparative advantage (Ricardo, 1817) says a country should produce goods at the lowest opportunity cost, even if another country makes them absolutely cheaper."
            },
            {
                question: "The WTO principle requiring equal treatment of foreign and domestic goods after customs clearance is called:",
                options: [
                    "Most Favoured Nation",
                    "National Treatment",
                    "Reciprocity",
                    "Predictability"
                ],
                answer: 1,
                explanation: "National Treatment requires members to treat foreign goods no less favourably than domestic goods once they have entered the market. MFN means equal treatment among all members."
            },
            {
                question: "Which stage of economic integration has no internal tariffs AND a common external tariff?",
                options: [
                    "Free Trade Area",
                    "Preferential Trade Agreement",
                    "Customs Union",
                    "Political Union"
                ],
                answer: 2,
                explanation: "A Customs Union (e.g., MERCOSUR) removes internal tariffs and applies a common external tariff, unlike an FTA where members keep independent external tariffs."
            },
            {
                question: "According to the Uppsala model, firms internationalize by:",
                options: [
                    "Making large FDI commitments immediately",
                    "Entering all markets simultaneously",
                    "Starting with psychically close markets and increasing commitment incrementally",
                    "Only entering markets with the highest growth rates"
                ],
                answer: 2,
                explanation: "The Uppsala model says firms expand incrementally, starting with culturally close markets and moving from low-commitment modes like exporting to JVs and WOS."
            },
            {
                question: "The EPRG framework for international marketing orientations includes:",
                options: [
                    "Economic, Political, Regional, Global",
                    "Export, Price, Retail, Growth",
                    "European, Pacific, Russian, Global",
                    "Ethnocentric, Polycentric, Region-centric, Geocentric"
                ],
                answer: 3,
                explanation: "EPRG stands for Ethnocentric, Polycentric, Region-centric, and Geocentric. Ethnocentric applies the home approach everywhere; Geocentric uses a globally integrated approach."
            },
            {
                question: "Which type of exchange rate risk affects a firm's actual cash flows from foreign currency transactions?",
                options: [
                    "Translation risk",
                    "Economic risk",
                    "Transaction risk",
                    "Political risk"
                ],
                answer: 2,
                explanation: "Transaction risk hits actual cash flows, e.g., an export payment received in a foreign currency. Translation risk affects consolidated statements; economic risk affects competitive position."
            },
            {
                question: "An ethnocentric staffing approach fills key international positions with:",
                options: [
                    "Host country nationals",
                    "The best person regardless of nationality",
                    "Managers from the same region only",
                    "Home country nationals"
                ],
                answer: 3,
                explanation: "Ethnocentric staffing uses home country nationals, common in early internationalization. Polycentric uses host country nationals; geocentric hires the best person regardless of nationality."
            }
        ];

        const quizEngine = new QuizEngine('mmpc16', 'MMPC16', questions);
        quizEngine.init();

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            switch(e.key) {
                case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); quizEngine.prev(); break;
                case 'ArrowRight': case 'd': case 'D': e.preventDefault(); quizEngine.next(); break;
                case '1': case '2': case '3': case '4':
                    if (quizEngine.state === 'in-progress') {
                        const num = parseInt(e.key);
                        if (num <= quizEngine.getCurrentQuestion().options.length) {
                            quizEngine.selectAnswer(num - 1);
                        }
                    }
                    break;
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                quizEngine.toggleTimer(false);
            } else {
                if (quizEngine.timerEnabled) {
                    quizEngine.toggleTimer(true);
                }
            }
        });
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
