<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StudyHub flashcards - review key IGNOU MBA concepts with quick flip cards for every subject.">
    <title>&#x1F48F; Flashcards - StudyHub</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .back-link{display:inline-flex;align-items:center;gap:6px;margin:1rem 1rem 0;padding:6px 14px;border-radius:999px;background:var(--glass,transparent);border:1px solid var(--glass-border);color:var(--text-muted);text-decoration:none;font-size:.85rem;width:fit-content}
        .back-link:hover{color:var(--text-primary);border-color:var(--accent)}
        .flashcards-header,.subject-selector,#flashcardPanel{padding-left:1rem;padding-right:1rem}
        .subject-btn{padding:.45rem .9rem;border-radius:999px;border:1px solid var(--glass-border);background:transparent;color:var(--text-muted);font-size:.8rem;font-weight:600;cursor:pointer;min-height:38px}
        .subject-btn.active{background:rgba(94,140,240,.15);border-color:rgba(94,140,240,.4);color:var(--accent)}
        .flashcard-nav-btn{padding:.45rem 1rem;border-radius:8px;border:1px solid var(--glass-border);background:transparent;color:var(--text-primary);font-size:.85rem;font-weight:600;cursor:pointer;min-height:38px}
        .flashcard-nav-btn:hover{border-color:var(--accent)}
        @media(max-width:480px){.flashcard-face{padding:1.25rem !important}}
    </style>

<link rel="manifest" href="manifest.json">
</head>
<body>
    <a href="study-hub.html" class="back-link">&#x2190; Back to Hub</a>
    
    <div class="flashcards-header">
        <h1>&#x1F48F; Flashcards Review</h1>
        <p style="color: var(--text-muted);">Flip cards to review key concepts</p>
    </div>

    <div class="subject-selector" id="subjectSelector">
        <button class="subject-btn active" data-subject="all">All Subjects</button>
        <button class="subject-btn" data-subject="mmpc-01">MMPC-01</button>
        <button class="subject-btn" data-subject="mmpc-02">MMPC-02</button>
        <button class="subject-btn" data-subject="mmpc-03">MMPC-03</button>
        <button class="subject-btn" data-subject="mmpc-04">MMPC-04</button>
        <button class="subject-btn" data-subject="mmpc-05">MMPC-05</button>
        <button class="subject-btn" data-subject="mmpc-06">MMPC-06</button>
        <button class="subject-btn" data-subject="mmpc-07">MMPC-07</button>
    </div>

    <div id="flashcardPanel"></div>
    <div id="noCards" class="no-cards" style="display: none;">
        <p>No flashcards found. Please select a subject with key takeaways.</p>
    </div>

    <script src="flashcards-app.js"></script>
    <script src="pwa-register.js"></script>
</body>
</html>
