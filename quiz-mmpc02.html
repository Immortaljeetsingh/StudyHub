            <div class="quiz-stat"><div class="stat-value" id="scoreDisplay">0</div><div class="stat-label">Score</div></div>
            <div class="quiz-stat"><div class="stat-value" id="answeredDisplay">0/50</div><div class="stat-label">Answered</div></div>

        <a href="study-mmpc02.html">&#x1F4D7; Study Material</a> | <a href="study-hub.html">&#x2190; Study Hub</a>
    </div>

    <script>
    const QUIZ_ID = 'mmpc-02';
    const questions = [
        {q:"HRM is primarily concerned with managing:", options:["Financial resources","Physical assets","Human resources (people)","Technology systems"], correct:2, explanation:"HRM focuses on acquiring, developing, motivating, and retaining an organization's most valuable asset &#x2014; its people."},
        {q:"Job Analysis produces two key documents:", options:["Resume and cover letter","Job Description and Job Specification","Offer letter and contract","Appraisal form and scorecard"], correct:1, explanation:"Job Description (what the job involves) and Job Specification (what the person needs) are the twin outputs of job analysis."},
        {q:"Which is an internal source of recruitment?", options:["Campus placement","Employment exchange","Promotions and transfers","Job portals"], correct:2, explanation:"Internal sources include promotions, transfers, internal job postings, and employee referrals from within the organization."},
        {q:"The selection process typically begins with:", options:["Medical examination","Reference checking","Application screening","Final interview"], correct:2, explanation:"Screening applications against job requirements is the first step to shortlist candidates from the applicant pool."},
        {q:"Kirkpatrick's training evaluation model has how many levels?", options:["2","3","4","5"], correct:2, explanation:"4 levels: Reaction (satisfaction), Learning (knowledge gained), Behavior (on-job application), Results (business impact)."},
        {q:"Training Need Analysis (TNA) identifies:", options:["Best candidates for promotion","Gaps between current and required competencies","Employee salary expectations","Organizational culture"], correct:1, explanation:"TNA systematically identifies where training is needed, who needs it, and what type of training will close competency gaps."},
        {q:"On-the-job training includes:", options:["Classroom lectures","Case study method","Job rotation and coaching","Simulation exercises"], correct:2, explanation:"On-the-job methods (rotation, coaching, mentoring, apprenticeship) train employees while they work in their actual environment."},
        {q:"360-degree feedback involves input from:", options:["Only the supervisor","Supervisor, peers, subordinates, self, and customers","Only the employee themselves","Only HR department"], correct:1, explanation:"360Â° feedback provides a comprehensive view by collecting evaluations from all directions &#x2014; above, beside, below, and external."},
        {q:"The Halo Effect in appraisal means:", options:["Rating everyone as average","One positive trait inflating all other ratings","Being too strict in ratings","Remembering only recent performance"], correct:1, explanation:"Halo Effect: if an employee excels in one area, the rater unconsciously rates them high on all other dimensions too."},
        {q:"Recency bias in performance appraisal refers to:", options:["Giving higher ratings to recent hires","Only considering recent performance, ignoring the rest of the period","Preferring younger employees","Rating based on first impressions"], correct:1, explanation:"Recency bias means the rater focuses disproportionately on recent events rather than evaluating the entire review period."},
        {q:"BARS stands for:", options:["Basic Annual Rating System","Behaviorally Anchored Rating Scales","Business Achievement Rating Standards","Balanced Assessment Review System"], correct:1, explanation:"BARS rates specific observable behaviors on a scale, anchoring each rating point with a behavioral example &#x2014; more objective than trait-based scales."},
        {q:"Dearness Allowance (DA) is a component of:", options:["Non-monetary compensation","Basic pay","Allowances","Incentives"], correct:2, explanation:"DA is an allowance paid to offset the impact of inflation on purchasing power &#x2014; it's separate from basic pay."},
        {q:"ESOPs stand for:", options:["Employee Safety Operating Procedures","Employee Stock Ownership Plans","Essential Staffing Operations Protocol","Employee Service Optimization Plans"], correct:1, explanation:"ESOPs give employees ownership stake in the company through stock options &#x2014; aligning employee interests with company performance."},
        {q:"The Payment of Gratuity Act applies after:", options:["1 year of service","3 years of service","5 years of continuous service","10 years of service"], correct:2, explanation:"Employees are entitled to gratuity after completing 5 years of continuous service with the same employer."},
        {q:"Industrial Disputes Act, 1947 primarily deals with:", options:["Minimum wages","Settlement of industrial disputes, layoffs, retrenchment","Factory safety standards","Employee stock options"], correct:1, explanation:"The ID Act provides mechanisms for dispute resolution, governs layoffs, retrenchment, and closure of industrial establishments."},
        {q:"Human Resource Planning (HRP) involves:", options:["Only hiring new employees","Forecasting future HR needs and matching supply with demand","Setting employee salaries","Designing office spaces"], correct:1, explanation:"HRP ensures the right number of qualified people are available at the right time &#x2014; it forecasts demand and plans for supply."},
        {q:"Which interview type uses the same questions for all candidates?", options:["Unstructured interview","Behavioral interview","Structured interview","Stress interview"], correct:2, explanation:"Structured interviews use standardized, predetermined questions asked to all candidates &#x2014; improving consistency and reducing bias."},
        {q:"Induction/Orientation serves to:", options:["Evaluate employee performance","Introduce new employees to the organization, culture, and role","Determine salary increases","Plan employee retirement"], correct:1, explanation:"Induction helps new hires understand the company culture, policies, team members, and job expectations &#x2014; reducing initial anxiety."},
        {q:"Which HRM approach treats employees as 'costs to minimize'?", options:["Strategic HRM","Personnel Management (traditional)","Human Capital Management","Talent Management"], correct:1, explanation:"Traditional Personnel Management was administrative and reactive, viewing workers as costs. Modern HRM views them as strategic assets."},
        {q:"Quality of Work Life (QWL) focuses on:", options:["Product quality only","Overall employee well-being and work satisfaction","Financial reporting quality","Manufacturing quality control"], correct:1, explanation:"QWL encompasses working conditions, job security, work-life balance, participation in decisions &#x2014; overall workplace quality."},
        {q:"Collective bargaining is negotiation between:", options:["Individual employee and HR","Trade union(s) and management","Two competing companies","Government and businesses"], correct:1, explanation:"Collective bargaining is the negotiation process between organized workers (union) and employer to determine wages, hours, and conditions."},
        {q:"Competency mapping identifies:", options:["Geographic location of employees","Skills, knowledge, and abilities required for each role","Competitive companies in the market","Map of office locations"], correct:1, explanation:"Competency mapping defines the specific competencies (KSAs) needed for each role &#x2014; used for hiring, training, and promotion decisions."},
        {q:"Which method evaluates jobs to determine their relative worth?", options:["Job Analysis","Job Evaluation","Job Description","Job Rotation"], correct:1, explanation:"Job Evaluation determines the relative value of different jobs within an organization &#x2014; forming the basis for equitable compensation."},
        {q:"Assessment centers are used primarily for:", options:["Day-to-day work allocation","Identifying managerial potential through multiple exercises","Filing employee records","Calculating payroll"], correct:1, explanation:"Assessment centers use multiple exercises (simulations, in-basket, group discussions) to evaluate candidates for management positions."},
        {q:"Separation from employment includes:", options:["Only retirement","Resignation, retirement, termination, retrenchment, and layoff","Only getting fired","Only voluntary separation"], correct:1, explanation:"Separation encompasses all forms of employment ending &#x2014; voluntary (resignation, retirement) and involuntary (termination, retrenchment)."},
        {q:"HR audit is:", options:["Financial audit of HR department","Systematic evaluation of HR policies, practices, and outcomes","Checking employee attendance","Reviewing payroll calculations only"], correct:1, explanation:"HR audit comprehensively examines HR systems, processes, policies, and their effectiveness &#x2014; identifying gaps and improvement areas."},
        {q:"The 'glass ceiling' refers to:", options:["Transparent office partitions","Invisible barriers preventing women/minorities from advancing to top positions","Maximum salary cap","Clear communication policies"], correct:1, explanation:"The glass ceiling is a metaphor for invisible organizational and societal barriers that prevent women and minorities from reaching senior leadership."},
        {q:"Succession planning ensures:", options:["That the company changes CEOs frequently","Ready replacements for key positions in the organization","All employees get promoted at the same time","External hiring for all positions"], correct:1, explanation:"Succession planning identifies and develops future leaders to fill critical roles &#x2014; ensuring business continuity and leadership pipeline."},
        {q:"Which act governs minimum wages in India?", options:["Factories Act, 1948","Payment of Wages Act, 1936","Minimum Wages Act, 1948","Industrial Employment Act, 1946"], correct:2, explanation:"The Minimum Wages Act, 1948 empowers the government to fix minimum rates of wages for employees in scheduled employment."},
        {q:"Grievance handling in organizations follows:", options:["No specific process","A structured step-by-step resolution process","Only legal proceedings","Only informal discussions"], correct:1, explanation:"Best practice: Supervisor &#x2192; Department Head &#x2192; Grievance Committee &#x2192; Arbitration &#x2014; providing escalation paths for unresolved issues."},
        {q:"Human capital refers to:", options:["Money invested in business","The economic value of employees' skills, knowledge, and experience","Physical equipment and machinery","Company's stock market value"], correct:1, explanation:"Human capital is the collective skills, knowledge, and abilities of employees that create economic value for the organization."},
        {q:"Which appraisal method ranks employees from best to worst?", options:["Graphic rating scale","Critical incident method","Forced ranking/distribution","Essay method"], correct:2, explanation:"Forced ranking (also called 'rank and yank') requires managers to place employees into performance categories &#x2014; controversial but used by companies like GE."},
        {q:"Mentoring differs from coaching in that:", options:["Mentoring is short-term, coaching is long-term","Mentoring focuses on career development; coaching on specific skills","They are exactly the same","Mentoring is only for senior executives"], correct:1, explanation:"Mentoring is a long-term developmental relationship focused on career guidance. Coaching is typically short-term, targeting specific performance improvement."},
        {q:"Attrition rate measures:", options:["Employee satisfaction levels","The rate at which employees leave the organization","Training effectiveness","Revenue per employee"], correct:1, explanation:"Attrition rate = (Number of employees who left / Average total employees) Ã— 100. High attrition signals retention problems."},
        {q:"The Factories Act, 1948 primarily regulates:", options:["Banking operations","Health, safety, welfare, and working conditions in factories","Agricultural practices","Information technology services"], correct:1, explanation:"The Factories Act ensures basic health, safety, welfare, and working hour standards for factory workers."},
        {q:"Talent management encompasses:", options:["Only recruitment","Attracting, developing, engaging, and retaining top talent","Only training programs","Only compensation decisions"], correct:1, explanation:"Talent management is a holistic approach covering the entire employee lifecycle &#x2014; from attracting talent to succession planning."},
        {q:"Which training method uses hypothetical business scenarios for group discussion?", options:["On-the-job training","Case study method","Job rotation","Apprenticeship"], correct:1, explanation:"The case study method presents real or hypothetical business situations for analysis and discussion &#x2014; develops analytical and decision-making skills."},
        {q:"A psychological contract is:", options:["A legally binding employment agreement","Unwritten mutual expectations between employer and employee","A mental health assessment tool","A contract signed by psychologists"], correct:1, explanation:"The psychological contract consists of implicit, unwritten expectations &#x2014; e.g., the employee expects fair treatment, the employer expects loyalty."},
        {q:"Broadbanding in compensation refers to:", options:["Increasing salary range for all","Collapsing many pay grades into a few wide salary bands","Internet bandwidth allocation","Expanding job descriptions"], correct:1, explanation:"Broadbanding consolidates numerous narrow pay grades into fewer, wider bands &#x2014; increasing flexibility in pay and career movement."},
        {q:"Which of the following is a non-monetary reward?", options:["Annual bonus","Profit-sharing","Public recognition and praise","Medical insurance"], correct:2, explanation:"Non-monetary rewards include recognition, flexible work hours, meaningful work, career development opportunities, and praise."},
        {q:"HR analytics involves:", options:["Using data and statistics to improve HR decision-making","Analyzing only financial data","Physical analysis of workplace","Studying competitor HR practices only"], correct:0, explanation:"HR analytics uses data science to make evidence-based HR decisions &#x2014; predicting turnover, measuring engagement, optimizing hiring."},
        {q:"The concept of 'employer branding' refers to:", options:["Company logo and visual identity","The organization's reputation as an employer to attract talent","Product brand management","Advertising budget allocation"], correct:1, explanation:"Employer branding creates a compelling image of the company as a great place to work &#x2014; crucial for attracting top talent in competitive markets."},
        {q:"Flexi-time is an example of:", options:["Performance-based pay","Flexible work arrangement","Training method","Recruitment strategy"], correct:1, explanation:"Flexi-time allows employees to choose their work hours within certain limits &#x2014; improving work-life balance and satisfaction."},
        {q:"Statutory compliance in HRM includes adherence to:", options:["Only company policies","Labor laws and regulations mandated by government","International standards only","Voluntary industry guidelines"], correct:1, explanation:"Statutory compliance means following all applicable labor laws &#x2014; PF, ESI, minimum wages, gratuity, maternity benefits, etc."},
        {q:"The 'Peter Principle' states that employees:", options:["Always perform at their best","Rise to their level of incompetence through promotions","Are most productive in their first year","Should be promoted every 2 years"], correct:1, explanation:"Laurence Peter's principle: employees get promoted based on current-role performance until they reach a position where they're no longer competent."},
        {q:"Vestibule training is:", options:["Training in the company lobby","Off-the-job training in a simulated work environment","Training during commute","Online training only"], correct:1, explanation:"Vestibule training creates a replica of the actual workplace for training purposes &#x2014; common in manufacturing and technical jobs."},
        {q:"Employee engagement is best described as:", options:["Just showing up for work","Emotional commitment and involvement of employees toward the organization","Following company rules","Working overtime"], correct:1, explanation:"Engaged employees are emotionally invested in their work and organization &#x2014; they go beyond minimum requirements voluntarily."},
        {q:"What is the full form of KRA in performance management?", options:["Key Resource Allocation","Key Result Areas","Knowledge and Research Analysis","Key Recruitment Activity"], correct:1, explanation:"KRAs define the most important areas where an employee is expected to deliver results &#x2014; forming the basis for performance measurement."},
        {q:"Downsizing refers to:", options:["Moving to a smaller office","Planned reduction in workforce to improve efficiency","Reducing product size","Lowering prices"], correct:1, explanation:"Downsizing is the deliberate reduction of employees &#x2014; often through layoffs or early retirement &#x2014; to cut costs or improve efficiency."}
    ];

    let userAnswers = new Array(questions.length).fill(-1);
    function renderQuiz(){const c=document.getElementById('quizContainer');c.innerHTML=questions.map((q,i)=>`<div class="question-card" id="qcard-${i}"><div class="q-number">Question ${i+1} of ${questions.length}</div><div class="q-text">${q.q}</div><div class="q-options">${q.options.map((opt,j)=>`<div class="q-option" onclick="selectAnswer(${i},
{q:"Workers' Participation in Management (WPM) in India is mandated under which Act?", options:["Industrial Disputes Act, 1947","Factories Act, 1948","Companies Act, 2013","Payment of Wages Act, 1936"], correct:0, explanation:"The Industrial Disputes Act, 1947 provides for Works Committees and other mechanisms for workers' participation in management in India."},
${j})" id="q${i}-opt${j}"><span class="q-option-letter">${'ABCD'[j]}</span><span>${opt}</span></div>`).join('')}</div><div class="q-explanation" id="q${i}-exp">&#x1F4A1; ${q.explanation}</div></div>`).join('');}
    function selectAnswer(qi,oi){if(document.getElementById(`qcard-${qi}`).classList.contains('correct')||document.getElementById(`qcard-${qi}`).classList.contains('incorrect'))return;userAnswers[qi]=oi;questions[qi].options.forEach((_,j)=>{document.getElementById(`q${qi}-opt${j}`).classList.toggle('selected',j===oi);});updateStats();}
    function checkAllAnswers(){questions.forEach((q,i)=>{const card=document.getElementById(`qcard-${i}`);if(userAnswers[i]===-1)return;card.classList.add(userAnswers[i]===q.correct?'correct':'incorrect');document.getElementById(`q${i}-opt${q.correct}`).classList.add('correct-answer');if(userAnswers[i]!==q.correct&&userAnswers[i]>=0)document.getElementById(`q${i}-opt${userAnswers[i]}`).classList.add('wrong-answer');document.getElementById(`q${i}-exp`).classList.add('visible');});updateStats();}
    function updateStats(){const answered=userAnswers.filter(a=>a>=0).length;const correct=userAnswers.filter((a,i)=>a===questions[i].correct).length;const pct=answered>0?Math.round((correct/questions.length)*100):0;document.getElementById('scoreDisplay').textContent=correct;document.getElementById('answeredDisplay').textContent=`${answered}/${questions.length}`;document.getElementById('percentDisplay').textContent=pct+'%';}
    function saveScore(){const answered=userAnswers.filter(a=>a>=0).length;if(answered<questions.length&&!confirm(`You've answered ${answered}/${questions.length}. Save anyway?`))return;checkAllAnswers();const correct=userAnswers.filter((a,i)=>a===questions[i].correct).length;const pct=Math.round((correct/questions.length)*100);localStorage.setItem(`studyhub-quiz-${QUIZ_ID}`,pct);if(pct>=80)localStorage.setItem(`studyhub-progress-${QUIZ_ID}`,100);showToast(`Score saved: ${pct}%`,pct>=80?'success':'info');setTimeout(()=>{window.location.href='study-hub.html';},2000);}
    function resetQuiz(){userAnswers=new Array(questions.length).fill(-1);renderQuiz();updateStats();}
    renderQuiz();
    </script>
