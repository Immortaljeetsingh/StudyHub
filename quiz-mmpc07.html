<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPC-07 Quiz: Business Communication | StudyHub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="subject-mmpc07">
    <div id="liveRegion" class="sr-only" aria-live="polite"></div>
    <script src="api-utils.js"></script>
    <script>document.write(renderApiSettingsModal());document.write(renderToolbar('mmpc-07'));</script>
    <div class="quiz-header"><h1>🩵 MMPC-07: Business Communication Quiz</h1><div class="quiz-stats"><div class="quiz-stat"><div class="stat-value" id="scoreDisplay">0</div><div class="stat-label">Score</div></div><div class="quiz-stat"><div class="stat-value" id="answeredDisplay">0/50</div><div class="stat-label">Answered</div></div><div class="quiz-stat"><div class="stat-value" id="percentDisplay">0%</div><div class="stat-label">Percentage</div></div></div></div>
    <div class="quiz-controls"><button class="btn btn-primary" onclick="checkAllAnswers()">✅ Check All</button><button class="btn btn-success" onclick="saveScore()">💾 Save Score</button><button class="btn btn-outline" onclick="resetQuiz()">🔄 Reset</button></div>
    <div class="quiz-container" id="quizContainer"></div>
    <div class="study-footer"><a href="study-mmpc07.html">🩵 Study Material</a> | <a href="study-hub.html">← Hub</a></div>
    <script>
    const QUIZ_ID = 'mmpc-07';
    const questions = [
        {q:"Communication is the process of:",options:["Only sending messages","Exchanging information, ideas, and feelings between parties","Writing emails","Public speaking only"],correct:1,explanation:"Communication involves a two-way exchange — sending AND receiving messages with feedback."},
        {q:"The Shannon-Weaver model includes which key element?",options:["Only sender and receiver","Sender, Message, Channel, Receiver, Feedback, Noise","Only message and medium","Only encoding and decoding"],correct:1,explanation:"The complete model: Sender → Encoding → Channel → Decoding → Receiver → Feedback, with Noise at any stage."},
        {q:"Downward communication flows from:",options:["Peers to peers","Subordinates to superiors","Superiors to subordinates","External to internal"],correct:2,explanation:"Downward: instructions, policies, and feedback flowing from management to employees."},
        {q:"Upward communication flows from:",options:["CEO to employees","Subordinates to superiors","Peers to peers","External stakeholders to company"],correct:1,explanation:"Upward: reports, suggestions, grievances, and feedback moving from employees to management."},
        {q:"Horizontal communication occurs between:",options:["Manager and subordinate","People at the same hierarchical level","Company and customers","Internal and external parties"],correct:1,explanation:"Horizontal communication: coordination between peers in same or different departments — e.g., marketing and sales teams."},
        {q:"The 7 Cs of communication include:",options:["Cost, Coverage, Competition, Creativity, Content, Channel, Customer","Clear, Concise, Concrete, Correct, Coherent, Complete, Courteous","Connect, Create, Collaborate, Commit, Control, Change, Close","None of the above"],correct:1,explanation:"The 7 Cs ensure effective communication — Clear, Concise, Concrete, Correct, Coherent, Complete, Courteous."},
        {q:"Semantic barriers arise from:",options:["Physical noise","Ambiguous language, jargon, or different word interpretations","Emotional state","Organizational hierarchy"],correct:1,explanation:"Semantic barriers: same word meaning different things — 'table' a report (discuss) vs 'table' a report (postpone) in US vs UK English."},
        {q:"Psychological barriers include:",options:["Poor internet connection","Prejudice, emotions, fear, selective perception","Language differences","Office layout"],correct:1,explanation:"Psychological barriers are internal mental states that filter, distort, or block message reception."},
        {q:"Filtering in communication means:",options:["Using spam filters","Sender manipulating information so receiver perceives it favorably","Removing noise","Sorting emails"],correct:1,explanation:"Filtering: subordinates may present only good news to superiors, distorting reality at each hierarchical level."},
        {q:"Information overload occurs when:",options:["There's too little information","People receive more information than they can process","Communication is too clear","All channels are blocked"],correct:1,explanation:"In the digital age, information overload is a major barrier — people can't process hundreds of emails, messages, notifications daily."},
        {q:"Mehrabian's Rule states that communication impact is:",options:["100% words","55% body language, 38% tone, 7% words","50% words, 50% tone","Equal across all channels"],correct:1,explanation:"Mehrabian found that in expressing feelings/attitudes: 55% body language, 38% vocal tone, only 7% actual words."},
        {q:"Kinesics is the study of:",options:["Sound and voice","Body movements — facial expressions, gestures, posture","Space and distance","Touch"],correct:1,explanation:"Kinesics: body language communication — eye contact, facial expressions, hand gestures, head nods, posture."},
        {q:"Proxemics is the study of:",options:["Body movements","Use of physical space in communication","Vocal qualities","Written symbols"],correct:1,explanation:"Proxemics (Edward Hall): intimate (0-18\"), personal (18\"-4'), social (4'-12'), public (12'+) zones."},
        {q:"Paralanguage refers to:",options:["Written language","How you say something — tone, pitch, pace, volume","Body movements","Sign language"],correct:1,explanation:"Paralanguage = vocal qualities that accompany speech. 'I didn't say he stole the money' — emphasis changes meaning entirely."},
        {q:"Chronemics involves:",options:["Body language","Use of time in communication","Written reports","Visual aids"],correct:1,explanation:"Chronemics: being late to a meeting signals disrespect; making someone wait signals power. Time communicates."},
        {q:"Haptics in communication refers to:",options:["Hearing","Touch-based communication (handshake, pat on back)","Visual cues","Written messages"],correct:1,explanation:"Haptics: communication through touch — handshake firmness, cultural norms around physical contact."},
        {q:"Business letters typically follow which format?",options:["Informal, casual","Structured format with date, salutation, body, closing","Stream of consciousness","Bullet points only"],correct:1,explanation:"Business letters: letterhead/date → inside address → salutation → body → complimentary close → signature."},
        {q:"A memo is used for:",options:["External communication","Internal communication within the organization","Legal contracts","Marketing to customers"],correct:1,explanation:"Memos (memorandums) are internal documents — brief, action-oriented, used for announcements, policies, instructions."},
        {q:"An executive summary should:",options:["Be longer than the full report","Provide a concise overview of key findings and recommendations","Include all data and charts","Be written first, before research"],correct:1,explanation:"Executive summary: 1-page max, standalone summary for busy decision-makers who may not read the full report."},
        {q:"The grapevine is:",options:["A type of formal report","The informal communication network in an organization","Company newsletter","Official email chain"],correct:1,explanation:"Grapevine: unofficial channel where information (and rumors) spread through social networks — fast but often inaccurate."},
        {q:"Active listening involves:",options:["Just hearing words","Fully concentrating, understanding, responding, and remembering","Multitasking while listening","Interrupting to show interest"],correct:1,explanation:"Active listening: pay full attention, acknowledge, paraphrase to confirm understanding, ask clarifying questions."},
        {q:"Feedback in communication serves to:",options:["End the conversation","Confirm understanding and allow the sender to adjust the message","Criticize the sender","Fill awkward silences"],correct:1,explanation:"Feedback closes the communication loop — it tells the sender whether the message was received and understood correctly."},
        {q:"Which is NOT a type of business report?",options:["Analytical report","Informational report","Feasibility study","Personal diary"],correct:3,explanation:"Business reports are formal, organizational documents. A personal diary is private and not a business communication tool."},
        {q:"Informational reports primarily:",options:["Analyze and recommend","Present facts without analysis or recommendations","Persuade the reader","Argue a position"],correct:1,explanation:"Informational reports (annual reports, progress reports) present data objectively. Analytical reports add analysis and recommendations."},
        {q:"The 6x6 rule for presentations means:",options:["6 slides, 6 minutes","Maximum 6 lines per slide, 6 words per line","6 presenters, 6 topics","6 visuals, 6 transitions"],correct:1,explanation:"6×6 rule keeps slides clean and readable — no one wants to read paragraphs projected on a screen."},
        {q:"Effective meeting management requires:",options:["No agenda needed","Clear agenda, time limits, assigned roles, action items","As many participants as possible","Meetings lasting 3+ hours"],correct:1,explanation:"Productive meetings: advance agenda → start on time → stay focused → assign action items → distribute minutes."},
        {q:"Non-verbal communication can:",options:["Only support verbal messages","Contradict, substitute, complement, or regulate verbal messages","Never be misinterpreted","Only occur face-to-face"],correct:1,explanation:"Non-verbal cues can reinforce words, contradict them (smiling while saying 'I'm fine' angrily), or replace them entirely."},
        {q:"Crisis communication's first rule is:",options:["Wait and gather all facts","Respond quickly (within the golden hour)","Blame others","Deny everything"],correct:1,explanation:"In crisis, speed matters — the golden hour. Delayed response creates information vacuum that rumors fill."},
        {q:"The 3 Rs of crisis communication are:",options:["Read, Research, Report","Respond quickly, show Regret/Responsibility, provide Remedy","Reduce, Reuse, Recycle","Review, Revise, Repeat"],correct:1,explanation:"Respond fast, take Responsibility (don't blame victims), Remedy the situation — J&J's Tylenol crisis is the gold standard."},
        {q:"Corporate communication manages:",options:["Only internal emails","Overall organizational reputation across all stakeholders","Only media relations","Only customer complaints"],correct:1,explanation:"Corporate communication is strategic — managing brand image across employees, investors, media, government, and public."},
        {q:"Visual aids in presentations should:",options:["Replace the speaker entirely","Support and enhance the speaker's message, not replace it","Contain maximum text","Be as complex as possible"],correct:1,explanation:"Visual aids (slides, charts, videos) support — the speaker is the presentation, not the slides."},
        {q:"Noise in communication refers to:",options:["Only physical sound","Anything that distorts or interferes with message transmission","Only visual distractions","Feedback from receiver"],correct:1,explanation:"Noise = any barrier (physical, semantic, psychological, organizational) that prevents the message from being received clearly."},
        {q:"Which communication channel is richest?",options:["Written memo","Email","Face-to-face","Bulletin board"],correct:2,explanation:"Face-to-face is the richest channel — it includes verbal, vocal, and visual cues plus immediate feedback."},
        {q:"Johari Window model helps understand:",options:["Financial data","Self-awareness and interpersonal communication","Marketing strategy","Project management"],correct:1,explanation:"Johari Window: Open (known to self and others), Blind (known to others, not self), Hidden (known to self, not others), Unknown."},
        {q:"Cross-cultural communication challenges include:",options:["Only language translation","Different norms, values, communication styles, and body language meanings","Only time zone differences","Only technology access"],correct:1,explanation:"Culture affects everything — directness vs indirectness, high-context vs low-context, attitudes toward silence, hierarchy, etc."},
        {q:"High-context cultures (Japan, India) rely heavily on:",options:["Explicit verbal messages","Context, non-verbal cues, relationship, and implied meaning","Written contracts only","Direct confrontation"],correct:1,explanation:"High-context: meaning derived from context, tone, relationship. Low-context (US, Germany): meaning is in explicit words."},
        {q:"Email etiquette includes:",options:["Using ALL CAPS for emphasis","Clear subject line, professional tone, concise body, proper greeting","Sending to maximum recipients","No need for proofreading"],correct:1,explanation:"Professional emails: descriptive subject line, greeting, clear purpose, concise body, call to action, professional close."},
        {q:"Persuasive communication aims to:",options:["Only inform","Change attitudes, beliefs, or behaviors of the audience","Confuse the audience","Provide entertainment"],correct:1,explanation:"Persuasion uses logical arguments (logos), emotional appeals (pathos), and credibility (ethos) to influence the audience."},
        {q:"Empathy in communication means:",options:["Agreeing with everything","Understanding and sharing the feelings of another person","Showing sympathy","Ignoring emotions"],correct:1,explanation:"Empathy: putting yourself in the other's shoes. Sympathy = feeling for someone; Empathy = feeling with someone."},
        {q:"Assertive communication is:",options:["Aggressive and demanding","Expressing views confidently while respecting others' rights","Passive and submissive","Manipulative"],correct:1,explanation:"Assertive = confident expression without aggression. It's between passive (door mat) and aggressive (steamroller)."},
        {q:"A press release is a tool of:",options:["Personal communication","Public Relations (PR)","Internal memos","Sales promotion"],correct:1,explanation:"Press releases announce newsworthy information to media — new products, achievements, crisis responses."},
        {q:"Constructive feedback should be:",options:["Vague and general","Specific, timely, focused on behavior (not person), and balanced","Only negative","Given only during annual reviews"],correct:1,explanation:"Effective feedback: specific (not 'good job'), timely, behavior-focused ('The report lacked data' not 'You're careless')."},
        {q:"What is a communication audit?",options:["Financial audit of communications department","Systematic evaluation of an organization's communication effectiveness","Testing phone systems","Counting emails sent"],correct:1,explanation:"Communication audit examines all communication channels, messages, and effectiveness — identifies gaps and improvements."},
        {q:"Encoding in communication is:",options:["Receiving a message","Converting thoughts into symbols, words, or gestures","Providing feedback","Adding encryption"],correct:1,explanation:"Encoding: sender translates ideas into communicable form — choosing words, tone, gestures, medium."},
        {q:"Decoding in communication is:",options:["Sending a message","The receiver interpreting and making sense of the message","Writing code","Encrypting data"],correct:1,explanation:"Decoding: receiver translates the received symbols back into meaning — influenced by experience, culture, context."},
        {q:"Which is a formal communication channel?",options:["Office gossip","Official reports, memos, and meetings","Lunch conversations","Social media chat"],correct:1,explanation:"Formal channels follow organizational hierarchy — reports, official emails, meetings, notices."},
        {q:"Interpersonal communication occurs between:",options:["Large groups","Two or a few individuals","Organizations","Mass audiences"],correct:1,explanation:"Interpersonal communication: direct exchange between individuals — the most common form of business communication."},
        {q:"A proposal differs from a report in that it:",options:["Only presents facts","Recommends a specific course of action and persuades the reader","Is always shorter","Is only internal"],correct:1,explanation:"Proposals are persuasive — they present a plan, justify it, and request approval/funding. Reports present findings."},
        {q:"Ethical communication requires:",options:["Manipulating data to support your argument","Honesty, transparency, and respect for the audience","Withholding negative information","Exaggerating benefits"],correct:1,explanation:"Ethical communication is truthful, fair, non-deceptive, and respects the audience's right to make informed decisions."},
        {q:"Digital communication advantages include:",options:["Always secure and private","Speed, wide reach, low cost, and multimedia capability","No misunderstandings possible","Replaces all face-to-face communication"],correct:1,explanation:"Digital communication offers instant delivery, global reach, cost efficiency, and rich media — but lacks personal touch."}
    ];

    let userAnswers=new Array(questions.length).fill(-1);
    function renderQuiz(){const c=document.getElementById('quizContainer');c.innerHTML=questions.map((q,i)=>`<div class="question-card" id="qcard-${i}"><div class="q-number">Question ${i+1} of ${questions.length}</div><div class="q-text">${q.q}</div><div class="q-options">${q.options.map((opt,j)=>`<div class="q-option" onclick="selectAnswer(${i},${j})" id="q${i}-opt${j}"><span class="q-option-letter">${'ABCD'[j]}</span><span>${opt}</span></div>`).join('')}</div><div class="q-explanation" id="q${i}-exp">💡 ${q.explanation}</div></div>`).join('');}
    function selectAnswer(qi,oi){if(document.getElementById(`qcard-${qi}`).classList.contains('correct')||document.getElementById(`qcard-${qi}`).classList.contains('incorrect'))return;userAnswers[qi]=oi;questions[qi].options.forEach((_,j)=>{document.getElementById(`q${qi}-opt${j}`).classList.toggle('selected',j===oi);});updateStats();}
    function checkAllAnswers(){questions.forEach((q,i)=>{const card=document.getElementById(`qcard-${i}`);if(userAnswers[i]===-1)return;card.classList.add(userAnswers[i]===q.correct?'correct':'incorrect');document.getElementById(`q${i}-opt${q.correct}`).classList.add('correct-answer');if(userAnswers[i]!==q.correct&&userAnswers[i]>=0)document.getElementById(`q${i}-opt${userAnswers[i]}`).classList.add('wrong-answer');document.getElementById(`q${i}-exp`).classList.add('visible');});updateStats();}
    function updateStats(){const answered=userAnswers.filter(a=>a>=0).length;const correct=userAnswers.filter((a,i)=>a===questions[i].correct).length;const pct=answered>0?Math.round((correct/questions.length)*100):0;document.getElementById('scoreDisplay').textContent=correct;document.getElementById('answeredDisplay').textContent=`${answered}/${questions.length}`;document.getElementById('percentDisplay').textContent=pct+'%';}
    function saveScore(){const answered=userAnswers.filter(a=>a>=0).length;if(answered<questions.length&&!confirm(`Answered ${answered}/${questions.length}. Save?`))return;checkAllAnswers();const correct=userAnswers.filter((a,i)=>a===questions[i].correct).length;const pct=Math.round((correct/questions.length)*100);localStorage.setItem(`studyhub-quiz-${QUIZ_ID}`,pct);if(pct>=80)localStorage.setItem(`studyhub-progress-${QUIZ_ID}`,100);showToast(`Score: ${pct}%`,pct>=80?'success':'info');setTimeout(()=>{window.location.href='study-hub.html';},2000);}
    function resetQuiz(){userAnswers=new Array(questions.length).fill(-1);renderQuiz();updateStats();}
    renderQuiz();
    </script>
</body>
</html>
