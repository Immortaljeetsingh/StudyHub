<body class="subject-mmpc04">

    <div class="quiz-header"><h1>&#x1F4D5; MMPC-04: Accounting for Managers Quiz</h1><div class="quiz-stats"><div class="quiz-stat"><div class="stat-value" id="scoreDisplay">0</div><div class="stat-label">Score</div></div><div class="quiz-stat"><div class="stat-value" id="answeredDisplay">0/50</div><div class="stat-label">Answered</div></div><div class="quiz-stat"><div class="stat-value" id="percentDisplay">0%</div><div class="stat-label">Percentage</div></div></div></div>
    <div class="quiz-controls"><button class="btn btn-primary" onclick="checkAllAnswers()">&#x2705; Check All</button><button class="btn btn-success" onclick="saveScore()">&#x1F4BE; Save Score</button><button class="btn btn-outline" onclick="resetQuiz()">&#x1F504; Reset</button></div>
    <div class="quiz-container" id="quizContainer"></div>
    <div class="study-footer"><a href="study-mmpc04.html">&#x1F4D5; Study Material</a> | <a href="study-hub.html">&#x2190; Hub</a></div>
    <script>
    const QUIZ_ID = 'mmpc-04';
    const questions = [
        {q:"The accounting equation is:",options:["Assets = Revenue - Expenses","Assets = Liabilities + Owner's Equity","Revenue = Assets + Liabilities","Profit = Revenue - Liabilities"],correct:1,explanation:"This is the foundation of double-entry bookkeeping &#x2014; every transaction keeps this equation balanced."},
        {q:"Which financial statement shows profitability over a period?",options:["Balance Sheet","Cash Flow Statement","Income Statement (Profit & Loss)","Trial Balance"],correct:2,explanation:"The Income Statement shows revenues minus expenses = profit or loss for a specific period."},
        {q:"A Balance Sheet shows the financial position at:",options:["Over a period of time","A specific point in time","For the entire year only","Over a decade"],correct:1,explanation:"The Balance Sheet is a snapshot &#x2014; it shows assets, liabilities, and equity at a particular date."},
        {q:"Going Concern concept assumes:",options:["Business will close soon","Business will continue indefinitely","Profits will always increase","No debts will be taken"],correct:1,explanation:"Going Concern: financial statements assume the business will continue operating &#x2014; not liquidating assets."},
        {q:"Accrual basis accounting records transactions when:",options:["Cash is received or paid","They are earned or incurred, regardless of cash flow","The bank statement arrives","The fiscal year ends"],correct:1,explanation:"Accrual accounting records revenue when earned and expenses when incurred &#x2014; not when cash changes hands."},
        {q:"The matching principle states:",options:["Revenue should match industry average","Expenses should be matched to the revenues they generate","Assets should match liabilities","Every debit must have a credit"],correct:1,explanation:"Match expenses to the period's revenue they helped create &#x2014; ensuring accurate profit measurement."},
        {q:"Current ratio is calculated as:",options:["Total Assets Ã· Total Liabilities","Current Assets Ã· Current Liabilities","Net Income Ã· Revenue","Total Debt Ã· Total Equity"],correct:1,explanation:"Current Ratio measures short-term liquidity. Ideal = 2:1 (&#x20B9;2 of current assets for every &#x20B9;1 of current liability)."},
        {q:"Quick ratio excludes which item from current assets?",options:["Cash","Accounts receivable","Inventory","Short-term investments"],correct:2,explanation:"Quick Ratio = (Current Assets - Inventory) Ã· Current Liabilities. Inventory is excluded because it's least liquid."},
        {q:"Fixed costs are costs that:",options:["Change with production volume","Remain constant regardless of output","Only occur once","Are always higher than variable costs"],correct:1,explanation:"Fixed costs (rent, salary, depreciation) don't change with production volume in the short run."},
        {q:"Variable costs:",options:["Stay the same regardless of production","Change in proportion to production volume","Are always fixed","Only apply to service industries"],correct:1,explanation:"Variable costs (raw materials, direct labor per unit) increase or decrease with production output."},
        {q:"Break-even point is where:",options:["Profit is maximized","Total revenue equals total costs (zero profit)","Variable costs equal zero","Fixed costs equal zero"],correct:1,explanation:"BEP = Fixed Costs Ã· (Selling Price - Variable Cost per unit). Below BEP = loss, above = profit."},
        {q:"If Fixed Costs = &#x20B9;5,00,000 and Contribution per unit = &#x20B9;100, BEP is:",options:["500 units","5,000 units","50,000 units","50 units"],correct:1,explanation:"BEP = &#x20B9;5,00,000 Ã· &#x20B9;100 = 5,000 units. The company must sell 5,000 units to cover all costs."},
        {q:"Depreciation represents:",options:["Increase in asset value","Decrease in cash balance","Allocation of asset cost over its useful life","Loss from selling an asset"],correct:2,explanation:"Depreciation systematically allocates the cost of a tangible asset over its useful life &#x2014; it's a non-cash expense."},
        {q:"Straight-line depreciation means:",options:["Equal depreciation each year","Higher depreciation in early years","No depreciation","Variable depreciation"],correct:0,explanation:"Straight-line: (Cost - Salvage Value) Ã· Useful Life = same amount charged each year."},
        {q:"ROE (Return on Equity) measures:",options:["Total asset efficiency","Profit generated per rupee of shareholder investment","Cash flow adequacy","Market value of shares"],correct:1,explanation:"ROE = Net Income Ã· Shareholder's Equity. Higher ROE means better returns for shareholders."},
        {q:"Debt-Equity ratio measures:",options:["Profitability","Liquidity","Financial leverage (proportion of debt vs equity)","Efficiency"],correct:2,explanation:"D/E Ratio = Total Debt Ã· Total Equity. Higher ratio = more leveraged = higher financial risk."},
        {q:"Inventory turnover ratio indicates:",options:["How quickly inventory is sold","Profit margin on each item","Total inventory value","Storage costs"],correct:0,explanation:"Inventory Turnover = COGS Ã· Average Inventory. Higher = inventory sells faster = more efficient."},
        {q:"Working capital is calculated as:",options:["Total Assets - Total Liabilities","Current Assets - Current Liabilities","Revenue - Expenses","Cash + Bank Balance"],correct:1,explanation:"Working Capital = CA - CL. Positive = can meet short-term obligations. Negative = liquidity risk."},
        {q:"Cash flow from operating activities includes:",options:["Buying equipment","Issuing shares","Collections from customers and payments to suppliers","Dividend payments"],correct:2,explanation:"Operating cash flows come from core business &#x2014; sales receipts, supplier payments, salary payments, tax payments."},
        {q:"Cash flow from investing activities includes:",options:["Loan repayment","Sale of equipment, purchase of property","Revenue from sales","Payment of dividends"],correct:1,explanation:"Investing activities involve buying/selling long-term assets &#x2014; property, equipment, investments."},
        {q:"Cash flow from financing activities includes:",options:["Buying raw materials","Issuing shares, taking loans, paying dividends","Selling products","Paying salaries"],correct:1,explanation:"Financing activities relate to how the business is funded &#x2014; equity issues, borrowing, repaying debt, dividends."},
        {q:"Conservatism principle states:",options:["Always show highest possible profit","Recognize losses early, gains only when realized","Ignore uncertain transactions","Show revenue as early as possible"],correct:1,explanation:"Conservatism = anticipate no profits, provide for all possible losses. This leads to more prudent reporting."},
        {q:"A budget is:",options:["Historical record of transactions","Financial plan expressing future goals in quantitative terms","Tax return document","Audit report"],correct:1,explanation:"Budgets translate organizational plans into financial targets &#x2014; used for both planning and control."},
        {q:"The master budget includes:",options:["Only the cash budget","Only the sales budget","All departmental budgets combined into a comprehensive plan","Only capital expenditure"],correct:2,explanation:"The master budget is the comprehensive financial plan that integrates all individual budgets."},
        {q:"Zero-based budgeting requires:",options:["Starting with last year's budget","Justifying every expense from scratch each period","Zero expenditure","No budget at all"],correct:1,explanation:"ZBB starts from zero &#x2014; every expense must be justified anew, regardless of previous period's spending."},
        {q:"Favorable variance means:",options:["Actual results are worse than budgeted","Actual results are better than budgeted","No difference from budget","Budget was set incorrectly"],correct:1,explanation:"Favorable variance: actual revenue > budget, or actual costs < budget &#x2014; better than planned."},
        {q:"Contribution margin equals:",options:["Revenue - Total Costs","Selling Price - Variable Cost per unit","Revenue - Fixed Costs","Gross Profit - Net Profit"],correct:1,explanation:"Contribution = SP - VC per unit. It shows how much each unit contributes toward fixed costs and profit."},
        {q:"Direct costs can be:",options:["Easily traced to a specific product or service","Never traced to any product","Only overhead costs","Only fixed costs"],correct:0,explanation:"Direct costs are traceable to a specific product &#x2014; direct materials (wood in furniture), direct labor."},
        {q:"Indirect costs are also called:",options:["Direct expenses","Overhead costs","Variable costs only","Revenue expenses"],correct:1,explanation:"Indirect costs (overhead) cannot be directly traced to specific products &#x2014; factory rent, electricity, admin salaries."},
        {q:"Absorption costing includes:",options:["Only variable costs in product cost","Both fixed and variable costs in product cost","Only fixed costs","Neither fixed nor variable costs"],correct:1,explanation:"Absorption costing assigns all manufacturing costs (fixed + variable) to products. Required for external reporting."},
        {q:"Marginal costing treats fixed costs as:",options:["Product costs","Period costs (charged to P&L of the period)","Sunk costs","Capital costs"],correct:1,explanation:"In marginal costing, only variable costs are product costs. Fixed costs are charged entirely to the period's income statement."},
        {q:"Net Profit Margin is calculated as:",options:["Gross Profit Ã· Revenue Ã— 100","Net Profit Ã· Revenue Ã— 100","Revenue Ã· Total Assets Ã— 100","Operating Profit Ã· Equity Ã— 100"],correct:1,explanation:"Net Profit Margin = Net Profit Ã· Revenue Ã— 100. Shows how much of each revenue rupee becomes profit."},
        {q:"Gross Profit = Revenue minus:",options:["All expenses","Cost of Goods Sold (COGS)","Tax only","Operating expenses only"],correct:1,explanation:"Gross Profit = Revenue - COGS. It shows profit before operating expenses, interest, and taxes."},
        {q:"FIFO inventory method assumes:",options:["Last items purchased are sold first","First items purchased are sold first","Average cost for all items","Highest cost items sold first"],correct:1,explanation:"First In, First Out: oldest inventory is sold first. During inflation, FIFO shows higher profits than LIFO."},
        {q:"The trial balance ensures:",options:["Profitability of the business","All debits equal all credits","All assets are valued correctly","Revenue exceeds expenses"],correct:1,explanation:"Trial balance checks arithmetic accuracy &#x2014; total debits must equal total credits. It doesn't guarantee error-free books."},
        {q:"Goodwill is classified as:",options:["Current asset","Tangible fixed asset","Intangible asset","Current liability"],correct:2,explanation:"Goodwill is an intangible asset &#x2014; representing brand value, customer relationships, reputation exceeding tangible net assets."},
        {q:"Which ratio measures how efficiently a company uses its assets?",options:["Current Ratio","Debt-Equity Ratio","Asset Turnover Ratio","Quick Ratio"],correct:2,explanation:"Asset Turnover = Revenue Ã· Total Assets. Higher ratio means the company generates more revenue per rupee of assets."},
        {q:"A debenture is:",options:["A type of share capital","A long-term debt instrument issued by a company","A government tax","An employee benefit"],correct:1,explanation:"Debentures are long-term loans taken by issuing debt instruments &#x2014; they pay fixed interest and rank above equity in repayment."},
        {q:"Capital expenditure (CapEx) is:",options:["Day-to-day operational spending","Spending on long-term assets (plant, equipment, buildings)","Payment of salaries","Payment of dividends"],correct:1,explanation:"CapEx = investment in assets that will benefit the business for multiple years &#x2014; machinery, buildings, vehicles."},
        {q:"Revenue expenditure is:",options:["Spending whose benefits last more than a year","Day-to-day operational expenses (salaries, rent, utilities)","Investment in fixed assets","Loan repayments"],correct:1,explanation:"Revenue expenditure benefits only the current period &#x2014; regular operating costs like salaries, rent, supplies."},
        {q:"Prudence concept is similar to:",options:["Going concern","Matching principle","Conservatism","Materiality"],correct:2,explanation:"Prudence (conservatism) = don't overstate assets or income; don't understate liabilities or expenses."},
        {q:"Cost-Volume-Profit (CVP) analysis helps determine:",options:["Tax liability","The relationship between costs, volume, and profit at different output levels","Employee performance","Market share"],correct:1,explanation:"CVP analysis shows how changes in costs and volume affect profit &#x2014; essential for break-even and pricing decisions."},
        {q:"Accounts receivable represents:",options:["Money the company owes to suppliers","Money owed to the company by customers","Cash in the bank","Inventory value"],correct:1,explanation:"Accounts Receivable = money customers owe for goods/services delivered but not yet paid &#x2014; a current asset."},
        {q:"Accounts payable represents:",options:["Money owed by customers","Cash reserves","Money the company owes to its suppliers","Share capital"],correct:2,explanation:"Accounts Payable = money the company owes to suppliers for goods/services received but not yet paid &#x2014; a current liability."},
        {q:"Earnings Per Share (EPS) is calculated as:",options:["Total Revenue Ã· Number of Shares","Net Income Ã· Number of Outstanding Shares","Total Assets Ã· Number of Shares","Dividends Ã· Number of Shares"],correct:1,explanation:"EPS = Net Income Ã· Total Outstanding Shares. It shows profit earned per share &#x2014; key metric for investors."},
        {q:"Standard costing involves:",options:["Using actual costs only","Setting predetermined costs and comparing with actuals","Ignoring cost data","Using only historical costs"],correct:1,explanation:"Standard costing sets expected costs for materials, labor, and overheads &#x2014; then analyzes variances from actual costs."},
        {q:"The P/E ratio helps investors assess:",options:["Company's debt level","How much they're paying per rupee of earnings","Employee productivity","Inventory efficiency"],correct:1,explanation:"Price/Earnings ratio = Market Price per Share Ã· EPS. High P/E may indicate growth expectations or overvaluation."},
        {q:"Fund flow statement shows:",options:["Daily cash transactions","Changes in financial position between two balance sheet dates","Profit and loss only","Tax calculations"],correct:1,explanation:"Fund Flow Statement analyzes changes in working capital between two balance sheet dates &#x2014; different from cash flow."},
        {q:"Which method charges higher depreciation in early years?",options:["Straight-line method","Written Down Value (Reducing Balance) method","No depreciation method","Units of production method"],correct:1,explanation:"WDV/Reducing Balance charges higher depreciation initially, decreasing over time &#x2014; reflects faster asset value decline."},
        {q:"Opportunity cost refers to:",options:["The actual cost paid for resources","The value of the next best alternative foregone","Hidden manufacturing costs","Cost of capital"],correct:1,explanation:"Opportunity cost = what you give up by choosing one option over another. It's not recorded in books but crucial for decision-making."}
    ];

    let userAnswers=new Array(questions.length).fill(-1);
    function renderQuiz(){const c=document.getElementById('quizContainer');c.innerHTML=questions.map((q,i)=>`<div class="question-card" id="qcard-${i}"><div class="q-number">Question ${i+1} of ${questions.length}</div><div class="q-text">${q.q}</div><div class="q-options">${q.options.map((opt,j)=>`<div class="q-option" onclick="selectAnswer(${i},${j})" id="q${i}-opt${j}"><span class="q-option-letter">${'ABCD'[j]}</span><span>${opt}</span></div>`).join('')}</div><div class="q-explanation" id="q${i}-exp">&#x1F4A1; ${q.explanation}</div></div>`).join('');}
    function selectAnswer(qi,oi){if(document.getElementById(`qcard-${qi}`).classList.contains('correct')||document.getElementById(`qcard-${qi}`).classList.contains('incorrect'))return;userAnswers[qi]=oi;questions[qi].options.forEach((_,j)=>{document.getElementById(`q${qi}-opt${j}`).classList.toggle('selected',j===oi);});updateStats();}
    function checkAllAnswers(){questions.forEach((q,i)=>{const card=document.getElementById(`qcard-${i}`);if(userAnswers[i]===-1)return;card.classList.add(userAnswers[i]===q.correct?'correct':'incorrect');document.getElementById(`q${i}-opt${q.correct}`).classList.add('correct-answer');if(userAnswers[i]!==q.correct&&userAnswers[i]>=0)document.getElementById(`q${i}-opt${userAnswers[i]}`).classList.add('wrong-answer');document.getElementById(`q${i}-exp`).classList.add('visible');});updateStats();}
    function updateStats(){const answered=userAnswers.filter(a=>a>=0).length;const correct=userAnswers.filter((a,i)=>a===questions[i].correct).length;const pct=answered>0?Math.round((correct/questions.length)*100):0;document.getElementById('scoreDisplay').textContent=correct;document.getElementById('answeredDisplay').textContent=`${answered}/${questions.length}`;document.getElementById('percentDisplay').textContent=pct+'%';}
    function saveScore(){const answered=userAnswers.filter(a=>a>=0).length;if(answered<questions.length&&!confirm(`Answered ${answered}/${questions.length}. Save?`))return;checkAllAnswers();const correct=userAnswers.filter((a,i)=>a===questions[i].correct).length;const pct=Math.round((correct/questions.length)*100);localStorage.setItem(`studyhub-quiz-${QUIZ_ID}`,pct);if(pct>=80)localStorage.setItem(`studyhub-progress-${QUIZ_ID}`,100);showToast(`Score: ${pct}%`,pct>=80?'success':'info');setTimeout(()=>{window.location.href='study-hub.html';},2000);}
    function resetQuiz(){userAnswers=new Array(questions.length).fill(-1);renderQuiz();updateStats();}
    renderQuiz();
    </script>
