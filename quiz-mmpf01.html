<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPF-01 Working Capital Management - Quiz | StudyHub</title>
    <link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="quiz-header">
        <h1>&#x1F4E0; MMPF-01 Working Capital Management Quiz</h1>
        <p>Test your knowledge of Working Capital Management</p>
        <div class="quiz-stats">
            <div class="quiz-stat">
                <div class="stat-value" id="currentQ">1</div>
                <div class="stat-label">Current</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="scoreVal">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="quiz-stat">
                <div class="stat-value" id="timeVal">20:00</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>
        <div class="quiz-progress-container">
            <div class="quiz-progress-bar" id="progressBar"></div>
        </div>
        <div class="quiz-progress-text" id="progressText">Question 1 of 10</div>
    </header>

    <div class="quiz-controls" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="quizEngine.reviewMode()" id="reviewBtn">
            <span class="icon">&#x1F4CB;</span> Review Answers
        </button>
        <div class="review-panel" id="reviewPanel">
            <h3><span class="icon">&#x1F4CD;</span> Jump to Question</h3>
            <div class="question-nav-grid" id="navGrid"></div>
        </div>
        <button class="btn btn-outline" onclick="quizEngine.toggleTimer()" id="timerBtn">
            <span class="icon">&#x23F1;</span> Toggle Timer
        </button>
    </div>

    <main style="max-width: 800px; margin: 0 auto; padding: 0 1.5rem;">
        <div class="question-nav" id="questionNav">
            <h3><span class="icon">&#x1F50D;</span> Question Navigation</h3>
            <div class="question-nav-grid" id="questionNavGrid"></div>
        </div>

        <div class="question-card current-question" id="questionCard">
            <h3 id="questionTitle">Question Title</h3>
            <div id="questionContent"></div>
        </div>

        <div id="answerOptions"></div>
        <div id="explanationArea" style="margin-top: 1rem;"></div>

        <div class="quiz-controls" style="justify-content: space-between; margin-top: 2rem;">
            <button class="btn btn-outline" onclick="quizEngine.prev()" id="prevBtn">
                <span class="icon">&#x2190;</span> Previous
            </button>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
                <button class="btn btn-secondary" onclick="quizEngine.randomize()" id="randomBtn">
                    <span class="icon">&#x1F500;</span> Randomize
                </button>
                <button class="btn btn-secondary" onclick="quizEngine.markReview()" id="markBtn">
                    <span class="icon">&#x1F516;</span> Mark for Review
                </button>
            </div>
            <button class="btn btn-primary" onclick="quizEngine.next()" id="nextBtn">
                Next <span class="icon">&#x2192;</span>
            </button>
        </div>
    </main>

    <div class="quiz-timer" id="quizTimer">
        <span class="icon">&#x23F1;</span> <span id="timerDisplay">20:00</span>
    </div>

    <script src="quiz-engine.js"></script>
    <script>
        const questions = [
            {
                question: "Net Working Capital is calculated as:",
                options: [
                    "Total Assets - Total Liabilities",
                    "Current Assets - Current Liabilities",
                    "Current Assets + Current Liabilities",
                    "Fixed Assets - Current Liabilities"
                ],
                answer: 1,
                explanation: "Net Working Capital = Current Assets - Current Liabilities, indicating the liquidity position of the firm; a positive NWC means it can meet short-term obligations. Gross WC is the total of current assets."
            },
            {
                question: "Temporary (variable) working capital refers to:",
                options: [
                    "The minimum WC always required",
                    "Additional WC needed during seasonal or peak periods",
                    "WC invested in fixed assets",
                    "WC financed by equity only"
                ],
                answer: 1,
                explanation: "Temporary WC is the additional working capital required during seasonal or peak periods, while permanent WC is the minimum level always needed regardless of business fluctuations."
            },
            {
                question: "The Cash Conversion Cycle (CCC) is calculated as:",
                options: [
                    "Inventory Days - Receivable Days + Payable Days",
                    "Operating Cycle + Payable Days",
                    "Receivable Days - Payable Days",
                    "Inventory Days + Receivable Days - Payable Days"
                ],
                answer: 3,
                explanation: "CCC = Inventory Days + Receivable Days - Payable Days, the net time cash is tied up in operations. Amazon runs a negative CCC because it collects from customers before paying suppliers."
            },
            {
                question: "In the 5 C's of credit evaluation, 'Character' refers to:",
                options: [
                    "The borrower's financial strength",
                    "The borrower's willingness to pay",
                    "The security offered",
                    "The economic environment"
                ],
                answer: 1,
                explanation: "Character is the borrower's willingness to pay based on reputation and past record; Capacity is the ability to pay, Capital is financial strength, Conditions is the economic environment, and Collateral is the security offered."
            },
            {
                question: "Holding cash to take advantage of unexpected investment opportunities is called the:",
                options: [
                    "Speculative motive",
                    "Transaction motive",
                    "Precautionary motive",
                    "Liquidity motive"
                ],
                answer: 0,
                explanation: "The three motives for holding cash are Transaction (daily operations), Precautionary (emergency buffer), and Speculative (investment opportunities), remembered as TPS."
            },
            {
                question: "Which cash management model handles random cash inflows and outflows using upper and lower control limits?",
                options: [
                    "Baumol model",
                    "Miller-Orr model",
                    "EOQ model",
                    "Walker's model"
                ],
                answer: 1,
                explanation: "The Miller-Orr model handles random cash flows by setting an upper limit, lower limit, and return point. The Baumol model assumes uniform cash flows and computes optimal cash as sqrt(2FT/K)."
            },
            {
                question: "The Economic Order Quantity (EOQ) is calculated using the formula:",
                options: [
                    "sqrt(2DS/H)",
                    "sqrt(2FT/K)",
                    "D x S / H",
                    "2DS x H"
                ],
                answer: 0,
                explanation: "EOQ = sqrt(2DS/H), where D is annual demand, S is ordering cost per order, and H is holding cost per unit per year. It minimizes total ordering and carrying costs."
            },
            {
                question: "In ABC analysis, 'A' category items typically represent:",
                options: [
                    "10% of items and 70% of value",
                    "70% of items and 10% of value",
                    "20% of items and 20% of value",
                    "50% of items and 50% of value"
                ],
                answer: 0,
                explanation: "ABC analysis classifies inventory by value: A items (10% of items, 70% of value) get tight control and frequent review; B items (20%/20%) get moderate control; C items (70%/10%) get loose control."
            },
            {
                question: "The annual cost of forgoing the discount under credit terms '2/10 net 30' is approximately:",
                options: [
                    "18.43%",
                    "37.24%",
                    "12.00%",
                    "24.50%"
                ],
                answer: 1,
                explanation: "Cost = (Discount / (1 - Discount)) x (365 / days past discount period) = (2/98) x (365/20) = 37.24% per annum. If short-term borrowing costs are lower, the firm should take the discount."
            },
            {
                question: "As per the Tandon Committee norms, banks can finance up to what percentage of the working capital gap?",
                options: [
                    "25%",
                    "40%",
                    "75%",
                    "50%"
                ],
                answer: 1,
                explanation: "The Tandon Committee (1975) recommended banks finance up to 40% of the WC gap (Current Assets - Current Liabilities other than bank borrowings), ensuring borrowers contribute their own funds to part of WC needs."
            }
        ];

        const quizEngine = new QuizEngine('mmpf01', 'MMPF01', questions);
        quizEngine.init();

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            switch(e.key) {
                case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); quizEngine.prev(); break;
                case 'ArrowRight': case 'd': case 'D': e.preventDefault(); quizEngine.next(); break;
                case '1': case '2': case '3': case '4':
                    if (quizEngine.state === 'in-progress') {
                        const num = parseInt(e.key);
                        if (num <= quizEngine.getCurrentQuestion().options.length) {
                            quizEngine.selectAnswer(num - 1);
                        }
                    }
                    break;
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                quizEngine.toggleTimer(false);
            } else {
                if (quizEngine.timerEnabled) {
                    quizEngine.toggleTimer(true);
                }
            }
        });
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
